<script>
(function () {
'use strict';

/* =====================================================================
   A. DANH MỤC PPE
   Hiện dùng danh mục mặc định. Khi bạn mô tả SharePoint list PPE,
   chỉ cần gọi: window.setPPECatalog([{ id, icon, label }, ...])
   ===================================================================== */
const PPE_SOURCE = { name: 'Danh mục mặc định', sharepointListUrl: '' };
let PPE_CATALOG = [
  { id: 'helmet',  icon: '⛑️', label: 'Mũ bảo hộ' },
  { id: 'glasses', icon: '🥽', label: 'Kính bảo hộ' },
  { id: 'gloves',  icon: '🧤', label: 'Găng tay' },
  { id: 'heat',    icon: '🔥', label: 'Bảo hộ chịu nhiệt' },
  { id: 'chem',    icon: '🧪', label: 'Bảo hộ hóa chất' },
  { id: 'boots',   icon: '🥾', label: 'Giày bảo hộ' },
  { id: 'ear',     icon: '🎧', label: 'Nút / chụp tai' },
  { id: 'mask',    icon: '😷', label: 'Khẩu trang / mặt nạ' },
  { id: 'harness', icon: '🪢', label: 'Dây an toàn trên cao' },
  { id: 'loto',    icon: '🔒', label: 'Khóa LOTO cá nhân' },
  { id: 'vest',    icon: '🦺', label: 'Áo phản quang' },
];
let PPE_MAP = new Map(PPE_CATALOG.map(p => [p.id, p]));
const ppeInfo = v => PPE_MAP.get(v) || { id: v, icon: '🛡️', label: v };
window.setPPECatalog = function (list, sourceName) {
  if (!Array.isArray(list) || !list.length) return;
  PPE_CATALOG = list.map(x => ({ id: String(x.id ?? x.label), icon: x.icon || '🛡️', label: String(x.label ?? x.id) }));
  PPE_MAP = new Map(PPE_CATALOG.map(p => [p.id, p]));
  if (sourceName) PPE_SOURCE.name = sourceName;
  if (window.App && App.res) App.renderMain();
};

const Ext = { pending: null, ppeSel: [], meta: new Map(), byId: new Map(), chainFollow: true };
window.ShutdownExt = Ext;

/* =====================================================================
   B. MODEL – thêm trường ppe (mảng) và priority (task ưu tiên)
   ===================================================================== */
const _norm = normalizeTask;
normalizeTask = function (t) {
  const x = _norm(t);
  if (Ext.pending && x.id === Ext.pending.id) Object.assign(x, Ext.pending.vals);
  x.ppe = Array.isArray(x.ppe) ? [...new Set(x.ppe.map(String).filter(Boolean))] : [];
  x.priority = !!x.priority;
  return x;
};

/* =====================================================================
   C. DANH SÁCH DẠNG CÂY – task "chạy sau" 1 task cùng process
      hiện thành NHÁNH CON ngay dưới task đó
   ===================================================================== */
function treeOrder(list) {
  const ids = new Set(list.map(t => t.id)), byId = new Map(list.map(t => [t.id, t]));
  const parentOf = new Map(), kids = new Map();
  for (const t of list) {
    let par = null;
    for (const d of t.dependencyIds) if (ids.has(d) && d !== t.id && (!par || byId.get(d).order > byId.get(par).order)) par = d;
    if (par) { parentOf.set(t.id, par); if (!kids.has(par)) kids.set(par, []); kids.get(par).push(t); }
  }
  const out = [], seen = new Set();
  const walk = (t, depth, isLast, trail) => {
    if (seen.has(t.id)) return; seen.add(t.id);
    const ch = (kids.get(t.id) || []).slice().sort((a, b) => a.order - b.order);
    out.push({ t, depth, isLast, trail, hasKids: ch.length > 0, kidCount: ch.length, parent: parentOf.get(t.id) || null });
    const nextTrail = depth === 0 ? [] : [...trail, !isLast];
    ch.forEach((c, i) => walk(c, depth + 1, i === ch.length - 1, nextTrail));
  };
  list.filter(t => !parentOf.has(t.id)).sort((a, b) => a.order - b.order).forEach(r => walk(r, 0, true, []));
  list.slice().sort((a, b) => a.order - b.order).forEach(t => { if (!seen.has(t.id)) walk(t, 0, true, []); });
  return out;
}

Gantt.buildRows = function () {
  const p = Store.plan(), ui = Store.ui();
  Ext.meta = new Map(); Ext.byId = new Map(p.tasks.map(t => [t.id, t]));
  const vis = p.tasks.filter(t => App.passFilter(t)), branches = new Map();
  for (const t of p.tasks.slice().sort((a, b) => a.order - b.order)) {
    if (!branches.has(t.branch)) branches.set(t.branch, new Map());
    const bm = branches.get(t.branch); if (!bm.has(t.process)) bm.set(t.process, []);
  }
  for (const t of vis) branches.get(t.branch).get(t.process).push(t);
  const rows = [];
  for (const [b, procs] of branches) {
    const all = [...procs.values()].flat(); if (!all.length) continue;
    const bKey = 'B|' + b; rows.push({ type: 'branch', key: bKey, branch: b, tasks: all });
    if (ui.collapsed[bKey]) continue;
    for (const [pr, list] of procs) {
      if (!list.length) continue;
      const pKey = 'P|' + b + '|' + pr; rows.push({ type: 'proc', key: pKey, branch: b, process: pr, tasks: list });
      if (ui.collapsed[pKey]) continue;
      for (const n of treeOrder(list)) { Ext.meta.set(n.t.id, n); rows.push({ type: 'task', key: n.t.id, task: n.t }); }
    }
  }
  this.rows = rows;
  return { rows, visCount: vis.length, total: p.tasks.length };
};

Gantt.taskRow = function (t, g, p) {
  const r = App.res.R.get(t.id), st = STATUS[r.status], fill = processColor(p, t.process);
  const x = g.x(r.start), w = Math.max(3, g.x(r.end) - x), who = t.assignee || '';
  const m = Ext.meta.get(t.id) || { depth: 0, isLast: true, trail: [], hasKids: false, kidCount: 0, parent: null };
  const pri = t.priority || m.hasKids, id = U.esc(t.id);
  const bar = t.durationHours > 0 ? `<div class="bar ${r.critical ? 'crit' : ''} ${r.warn && !r.critical ? 'warn' : ''} ${t.locked ? 'locked' : ''} ${pri ? 'pri' : ''}" data-id="${id}" style="left:${x}px;width:${w}px;background:${fill};--c:${fill}">
      <div class="prog" style="width:${t.progress}%"></div><span class="lbl">${w > 70 ? (pri ? '⚑ ' : '') + U.esc(t.taskName) : ''}</span>${t.locked ? '' : '<div class="handle"></div>'}</div>` : '';
  const msX = t.durationHours > 0 ? g.x(r.end) : x;
  const ms = t.milestone ? `<div class="ms" data-id="${id}" style="left:${msX - 6}px"></div>` : '';
  const outTxt = [w > 70 ? '' : t.taskName, who || t.owner].filter(Boolean).join(' · ');
  // cây nhánh
  const D = Math.min(m.depth, 6), step = 16; let tree = '';
  if (D > 0) {
    let lines = '';
    m.trail.slice(0, D - 1).forEach((on, k) => { if (on) lines += `<b style="left:${k * step + 7}px"></b>`; });
    lines += `<i style="left:${(D - 1) * step + 7}px"></i>`;
    if (!m.isLast) lines += `<b style="left:${(D - 1) * step + 7}px"></b>`;
    tree = `<span class="tree" style="width:${D * step + 4}px;--c:${fill}">${lines}</span>`;
  }
  // chip ưu tiên + phụ thuộc ngoài nhánh
  const ext = t.dependencyIds.filter(d => d !== m.parent).map(d => Ext.byId.get(d)).filter(Boolean);
  let chips = '';
  if (pri) chips += `<span class="chip pri" title="Task ưu tiên – dời task này thì cả nhánh phía sau dời theo">⚑ Ưu tiên${m.kidCount ? ' · ' + m.kidCount + ' nhánh' : ''}</span>`;
  if (ext.length) chips += `<span class="chip" title="Chạy sau: ${U.esc(ext.map(e => e.taskName + ' (' + e.process + ')').join(', '))}">↳ sau #${ext.map(e => e.order).join(', #')}</span>`;
  // PPE
  const pp = t.ppe || [];
  const ppeHtml = `<span class="c-ppe" title="${U.esc(pp.map(v => ppeInfo(v).label).join(', ') || 'Chưa chọn PPE')}">${pp.length ? pp.slice(0, 4).map(v => `<span>${ppeInfo(v).icon}</span>`).join('') + (pp.length > 4 ? `<em>+${pp.length - 4}</em>` : '') : '<span class="ppe-empty">—</span>'}</span>`;
  return `<div class="grow ${App.selectedId === t.id ? 'sel' : ''} ${pri ? 'is-pri' : ''}" data-id="${id}">
    <div class="gleft" data-open="${id}" style="padding-left:36px" title="${U.esc(t.taskName)}">
      <button class="addchild" data-addchild="${id}" title="Thêm task chạy SAU task này (nhánh con)">＋</button>
      <span class="stdot" style="background:${st.color}" title="${st.label}"></span><span class="c-stt">${t.order}</span>${tree}
      <span class="c-name" style="${r.warn ? 'color:#b45309' : ''}"><span class="nm">${U.esc(t.taskName)}</span>${chips}</span>
      ${ppeHtml}
      <span class="c-who ${who ? '' : 'empty'}">${who ? U.esc(who) : 'Chưa phân công'}</span>
      <span class="c-dur">${U.fmtDur(t.durationHours, true)}</span><span class="c-start">${U.fmtDM(r.start)}</span></div>
    <div class="gright">${bar}${ms}<div class="outlbl" style="left:${(t.milestone ? msX + 10 : x + w) + 6}px">${U.esc(outTxt)}</div></div></div>`;
};

/* Vẽ lại Gantt có hiệu ứng: thanh task trượt mượt tới vị trí mới (FLIP) */
const _gRender = Gantt.render.bind(Gantt);
Gantt.render = function () {
  const old = new Map(), oldRows = new Set();
  $$('#gcanvas .bar[data-id]').forEach(b => old.set(b.dataset.id, { l: parseFloat(b.style.left), w: parseFloat(b.style.width) }));
  $$('#gcanvas .grow[data-id]').forEach(r => oldRows.add(r.dataset.id));
  _gRender();
  const h = $('#gcanvas .ghead-left');
  if (h && !h.querySelector('.c-ppe')) { const s = document.createElement('span'); s.className = 'c-ppe'; s.textContent = 'PPE'; h.insertBefore(s, h.querySelector('.c-who')); }
  const lg = $('#legend');
  if (lg) lg.insertAdjacentHTML('beforeend', '<span>⚑ = task ưu tiên · └ = nhánh con · rê chuột vào dòng rồi bấm <b>＋</b> để thêm task chạy sau · kéo task ưu tiên → cả nhánh dời theo</span>');
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  if (old.size) $$('#gcanvas .bar[data-id]').forEach(b => {
    const o = old.get(b.dataset.id); if (!o) return;
    const nl = parseFloat(b.style.left), nw = parseFloat(b.style.width);
    if (Math.abs(o.l - nl) < 1 && Math.abs(o.w - nw) < 1) return;
    b.animate([{ transform: `translateX(${o.l - nl}px)`, width: o.w + 'px' }, { transform: 'translateX(0)', width: nw + 'px' }], { duration: 600, easing: 'cubic-bezier(.22,1.2,.36,1)' });
    b.classList.add('flash'); setTimeout(() => b.classList.remove('flash'), 800);
  });
  if (oldRows.size) $$('#gcanvas .grow[data-id]').forEach(r => {
    if (!oldRows.has(r.dataset.id)) r.animate([{ opacity: 0, transform: 'translateY(-6px)' }, { opacity: 1, transform: 'none' }], { duration: 420, easing: 'ease-out' });
  });
};

/* Nút ＋ trên dòng: thêm task con chạy sau task đó */
document.getElementById('gcanvas').addEventListener('click', e => {
  const b = e.target.closest('[data-addchild]'); if (!b) return;
  e.preventDefault(); e.stopImmediatePropagation(); e.stopPropagation();
  Ext.addChild(b.dataset.addchild);
}, true);
Ext.addChild = function (pid) {
  App.selectedId = pid;
  Drawer.openNew();
  const s = $('#x_after'); if (s) s.value = pid;
  const btn = $('#x_seq button[data-v="after"]'); if (btn) btn.click();
};

/* Tooltip có thêm PPE */
const _tipShow = Tip.show.bind(Tip);
Tip.show = function (id, e) {
  _tipShow(id, e);
  const t = Store.plan().tasks.find(x => x.id === id), tb = $('#tip table');
  if (t && tb && t.ppe && t.ppe.length) {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>PPE</td><td>${t.ppe.map(v => { const i = ppeInfo(v); return i.icon + ' ' + U.esc(i.label); }).join('<br>')}</td>`;
    tb.appendChild(tr);
  }
};

/* =====================================================================
   D. KÉO TASK → CẢ NHÁNH PHÍA SAU DỜI THEO
   ===================================================================== */
const _dStart = Drag.start.bind(Drag), _dMove = Drag.move.bind(Drag), _dEnd = Drag.end.bind(Drag);
Drag.start = function (e) {
  _dStart(e);
  const d = this.active; if (!d || d.mode !== 'move') return;
  d.desc = new Set([...Scheduler.descendants(Store.plan(), d.id)].filter(x => x !== d.id));
  d.chain = [...d.desc].map(id => ({ id, bar: $(`#gcanvas .bar[data-id="${CSS.escape(id)}"]`) })).filter(c => c.bar);
  d.chain.forEach(c => c.bar.classList.add('chain-hl'));
};
Drag.move = function (e) {
  _dMove(e);
  const d = this.active;
  if (d && d.chain && d.moved && d.mode === 'move') {
    const px = d.dh * App.geo.pxH;
    d.chain.forEach(c => c.bar.style.transform = `translateX(${px}px)`);
    if (d.desc.size) $('#tip').insertAdjacentHTML('beforeend', `<div style="margin-top:4px;color:#ffd60a">⤷ ${d.desc.size} task phía sau sẽ dời theo</div>`);
  }
};
Drag.end = function () {
  const d = this.active;
  if (d && d.chain) d.chain.forEach(c => { c.bar.style.transform = ''; c.bar.classList.remove('chain-hl'); });
  if (!d || d.mode !== 'move' || !d.moved || d.dh === 0 || !d.desc || !d.desc.size || !Ext.chainFollow) return _dEnd();
  this.active = null; Tip.hide();
  d.bar.onpointermove = d.bar.onpointerup = d.bar.onpointercancel = null;
  this.justDragged = true; setTimeout(() => this.justDragged = false, 0);
  const P = App.res.P, want = d.r.start + d.dh * MS_H, delta = d.dh;
  const before = new Map([...d.desc].map(id => [id, App.res.R.get(id)?.start]));
  Store.commit('Dời cả nhánh: ' + d.t.taskName, p => {
    const t = p.tasks.find(x => x.id === d.id);
    if (t.executionMode === 'fixed') t.constraintOffsetHours = (want - P) / MS_H;
    else if (want <= d.r.required) { t.constraintType = 'ASAP'; t.constraintOffsetHours = null; }
    else { t.constraintType = 'SNET'; t.constraintOffsetHours = (want - P) / MS_H; }
    for (const x of p.tasks) {
      if (!d.desc.has(x.id) || x.locked || x.executionMode === 'fixed') continue;
      if (x.constraintType === 'SNET' && x.constraintOffsetHours !== null) x.constraintOffsetHours += delta;
    }
  });
  const nr = App.res.R.get(d.id); let n = 0;
  for (const [id, s] of before) { const r = App.res.R.get(id); if (r && s !== undefined && Math.abs(r.start - s) >= MS_MIN) n++; }
  if (nr.start > want + MS_MIN) toast(`Không thể bắt đầu trước ${U.fmtDT(nr.start)} vì phải chờ task trước.`, 'warn');
  else toast(`Đã dời "${d.t.taskName}" → ${U.fmtDT(nr.start)} · ${n} task phía sau dời theo`, 'ok');
};

/* =====================================================================
   E. PANEL THÊM / SỬA TASK – hỏi trình tự rõ ràng + chọn PPE
   ===================================================================== */
const _dRender = Drawer.render.bind(Drawer);
Drawer.render = function (t, isNew) {
  _dRender(t, isNew);
  try { injectDrawer(t, isNew); } catch (err) { console.error(err); }
};
function injectDrawer(t, isNew) {
  const p = Store.plan(), body = $('#drawer .drawer-b'); if (!body) return;
  Ext.ppeSel = [...(t.ppe || [])];
  const blocked = isNew ? new Set() : Scheduler.descendants(p, t.id);
  const cands = p.tasks.filter(x => x.id !== t.id && !blocked.has(x.id)).sort((a, b) => a.order - b.order);
  const groups = new Map();
  cands.forEach(x => { const k = x.branch + ' · ' + x.process; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(x); });
  const deps = t.dependencyIds || [];
  const cur = t.executionMode === 'fixed' ? 'fixed' : (deps.length || t.executionMode === 'after_dependency') ? 'after' : t.executionMode === 'parallel' ? 'start' : 'seq';
  const curDep = deps[deps.length - 1] || '';

  const box = document.createElement('div'); box.className = 'xseq';
  box.innerHTML = `
    <div class="xs-h"><span class="xs-n">1</span> Task này bắt đầu khi nào?</div>
    <div class="segc" id="x_seq">
      <button type="button" data-v="seq"><b>≡</b><span>Nối tiếp</span><small>sau task trước trong cùng process</small></button>
      <button type="button" data-v="after"><b>⤷</b><span>Sau 1 task cụ thể</span><small>tạo nhánh con dưới task đó</small></button>
      <button type="button" data-v="start"><b>▶</b><span>Bắt đầu ngay</span><small>song song từ đầu Shutdown</small></button>
    </div>
    <div class="xs-after hidden" id="x_afterBox">
      <select id="x_after"><option value="">— Chọn task phải XONG trước —</option>${[...groups].map(([k, l]) => `<optgroup label="${U.esc(k)}">${l.map(x => `<option value="${U.esc(x.id)}" ${x.id === curDep ? 'selected' : ''}>#${x.order} · ${U.esc(x.taskName)}</option>`).join('')}</optgroup>`).join('')}</select>
      <div class="xs-flow" id="x_flow"></div>
    </div>
    <div class="xs-fixed hidden" id="x_fixedNote">Task đang ở chế độ <b>Cố định thời điểm</b> – chỉnh trong “Thiết lập nâng cao”.</div>
    <label class="xtog"><input type="checkbox" id="x_pri" ${t.priority ? 'checked' : ''}><span class="sw"></span><span>⚑ <b>Task ưu tiên</b> – dời task này thì cả nhánh phía sau dời theo</span></label>
    <div class="xs-h" style="margin-top:16px"><span class="xs-n">2</span> PPE cần dùng <span class="muted small" style="font-weight:400">· ${U.esc(PPE_SOURCE.name)}</span></div>
    <div class="ppegrid" id="x_ppe"></div>
    <div class="inline" style="margin-top:6px"><input id="x_ppeNew" placeholder="PPE khác… gõ rồi nhấn Enter"></div>`;
  body.insertBefore(box, body.firstChild);

  let mode = cur, lastAfter = curDep;
  const depBox = v => $(`#d_deps input[value="${CSS.escape(v)}"]`);
  const flow = () => {
    const el = $('#x_flow'); if (!el) return;
    const x = p.tasks.find(k => k.id === $('#x_after').value);
    if (mode !== 'after' || !x) { el.innerHTML = '<span class="muted">Chọn task phải hoàn thành trước – task này sẽ hiện thành nhánh con ngay dưới task đó.</span>'; return; }
    const r = App.res.R.get(x.id), lag = U.num($('#d_lag')?.value, 0) * ($('#d_lagU')?.value === 'm' ? 1 / 60 : 1);
    el.innerHTML = `<div class="fl-node" style="--c:${processColor(p, x.process)}">#${x.order} ${U.esc(x.taskName)}<small>${U.esc(x.process)} · xong lúc ${r ? U.fmtDM(r.end) : '–'}</small></div>
      <div class="fl-arrow">⤷</div>
      <div class="fl-node me">${U.esc($('#d_name').value || 'Task này')}<small>bắt đầu sớm nhất ${r ? U.fmtDM(r.end + lag * MS_H) : '–'}</small></div>`;
  };
  const applyAfter = () => {
    const v = $('#x_after').value;
    if (lastAfter && lastAfter !== v) { const o = depBox(lastAfter); if (o) o.checked = false; }
    if (v) {
      const i = depBox(v); if (i) i.checked = true;
      const par = p.tasks.find(k => k.id === v);
      if (isNew && par) { $('#d_process').value = par.process; $('#d_branch').value = par.branch; if (!$('#d_owner').value) $('#d_owner').value = par.owner; }
    }
    lastAfter = v; flow();
  };
  const setMode = v => {
    mode = v;
    $$('#x_seq button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
    $('#x_afterBox').classList.toggle('hidden', v !== 'after');
    $('#x_fixedNote').classList.toggle('hidden', v !== 'fixed');
    $('#x_seq').classList.toggle('hidden', v === 'fixed');
    if (v !== 'fixed') {
      const md = $('#d_mode');
      md.value = v === 'after' ? 'after_dependency' : v === 'start' ? 'parallel' : 'sequential';
      md.dispatchEvent(new Event('change'));
    }
    if (v === 'start') $$('#d_deps input').forEach(i => i.checked = false);
    if (v === 'seq' && lastAfter) { const o = depBox(lastAfter); if (o) o.checked = false; }
    if (v === 'after') applyAfter();
    flow();
  };
  $$('#x_seq button').forEach(b => b.onclick = () => setMode(b.dataset.v));
  $('#x_after').onchange = applyAfter;
  $('#d_name').addEventListener('input', flow);
  $('#d_mode').addEventListener('change', e => {
    const v = e.target.value, want = v === 'fixed' ? 'fixed' : v === 'parallel' ? 'start' : v === 'after_dependency' ? 'after' : 'seq';
    if (want !== mode) { mode = want; $$('#x_seq button').forEach(b => b.classList.toggle('on', b.dataset.v === want)); $('#x_afterBox').classList.toggle('hidden', want !== 'after'); $('#x_fixedNote').classList.toggle('hidden', want !== 'fixed'); $('#x_seq').classList.toggle('hidden', want === 'fixed'); flow(); }
  });

  const drawPPE = () => {
    const all = [...PPE_CATALOG, ...Ext.ppeSel.filter(v => !PPE_MAP.has(v)).map(v => ({ id: v, icon: '🛡️', label: v }))];
    $('#x_ppe').innerHTML = all.map(x => `<button type="button" class="ppe ${Ext.ppeSel.includes(x.id) ? 'on' : ''}" data-ppe="${U.esc(x.id)}" title="${U.esc(x.label)}"><span>${x.icon}</span><small>${U.esc(x.label)}</small></button>`).join('');
  };
  $('#x_ppe').onclick = e => {
    const b = e.target.closest('[data-ppe]'); if (!b) return;
    const v = b.dataset.ppe;
    Ext.ppeSel = Ext.ppeSel.includes(v) ? Ext.ppeSel.filter(x => x !== v) : [...Ext.ppeSel, v];
    b.classList.toggle('on');
    b.animate([{ transform: 'scale(.88)' }, { transform: 'scale(1.06)' }, { transform: 'scale(1)' }], { duration: 380, easing: 'cubic-bezier(.22,1.2,.36,1)' });
  };
  $('#x_ppeNew').onkeydown = e => {
    if (e.key !== 'Enter') return; e.preventDefault();
    const v = e.target.value.trim(); if (v && !Ext.ppeSel.includes(v)) { Ext.ppeSel.push(v); drawPPE(); }
    e.target.value = '';
  };
  drawPPE();
  setMode(cur);
}
const _dSave = Drawer.save.bind(Drawer);
Drawer.save = function () {
  Ext.pending = { id: App.drawerTaskId, vals: { ppe: [...Ext.ppeSel], priority: !!$('#x_pri')?.checked } };
  try { return _dSave(); } finally { Ext.pending = null; }
};

/* =====================================================================
   F. HIỆU ỨNG CHUYỂN MÀN HÌNH + XUẤT EXCEL CÓ CỘT PPE
   ===================================================================== */
const _sv = App.switchView.bind(App);
App.switchView = function (v) {
  const prev = this.view; _sv(v);
  if (prev === v) return;
  const el = $(v === 'home' ? '#viewHome' : v === 'gantt' ? '#viewGantt' : '#viewDash');
  if (el && el.animate) el.animate([{ opacity: 0, transform: 'translateY(10px) scale(.99)' }, { opacity: 1, transform: 'none' }], { duration: 440, easing: 'cubic-bezier(.2,.8,.2,1)' });
};
if (!EXPORT_HEAD.includes('PPE')) EXPORT_HEAD.push('PPE');
const _tRows = IO.tableRows.bind(IO);
IO.tableRows = function (plan, res, asText) {
  const byId = new Map(plan.tasks.map(t => [t.id, t]));
  return _tRows(plan, res, asText).map(r => [...r, (byId.get(r[1])?.ppe || []).map(v => ppeInfo(v).label).join(', ')]);
};
})();

<script>
(function () {
'use strict';
/* =====================================================================
   1. CẤU HÌNH
   UPLOAD_URL = URL Web App của Google Apps Script (xem file apps_script_upload.gs).
   Có thể để trống ở đây và nhập trong menu ☰ → "Cấu hình upload ảnh" (sẽ đồng bộ cho mọi máy).
   ===================================================================== */
const UPLOAD_URL = 'https://script.google.com/macros/s/AKfycbwBBRYjbZDwdDTpNLSsjTgJzElSd8NGgXjmqxIq97rGCL0-Cxtk-mYu0oNi7oQP-qJ0/exec';
const PRESETS = ['Ảnh checklist giấy đã điền', 'Ảnh Gemba / hiện trường', 'Ảnh LOTO đã khóa', 'Ảnh sau khi vệ sinh', 'Ảnh thiết bị sau khi lắp'];
const DEFAULT_EV = [{ id: 'done', label: 'Ảnh xác nhận hoàn thành', min: 1 }];
const SHIFTS = [{ n: 1, s: 6, label: '06–14' }, { n: 2, s: 14, label: '14–22' }, { n: 3, s: 22, label: '22–06' }];
const PPE = { helmet: ['⛑️', 'Mũ bảo hộ'], glasses: ['🥽', 'Kính'], gloves: ['🧤', 'Găng tay'], heat: ['🔥', 'Chịu nhiệt'], chem: ['🧪', 'Hóa chất'],
  boots: ['🥾', 'Giày'], ear: ['🎧', 'Bảo vệ tai'], mask: ['😷', 'Khẩu trang'], harness: ['🪢', 'Dây an toàn'], loto: ['🔒', 'Khóa LOTO'], vest: ['🦺', 'Áo phản quang'] };

const OP = { planId: null, date: '', ca: 1, mine: false, sheet: null, local: new Map(), prev: new Map(), pendingEv: null };
window.OperatorView = OP;

const plans = () => Store.state.plans;
const myName = () => SafeStore.get('op.name') || '';
const uploadUrl = () => (UPLOAD_URL.startsWith('http') ? UPLOAD_URL : '') || (plans().find(p => p.uploadUrl) || {}).uploadUrl || '';
const evOf = t => (Array.isArray(t.evidence) && t.evidence.length ? t.evidence : DEFAULT_EV);
const proofsOf = (t, id) => ((t.proofs || {})[id] || []);
function evStat(t) {
  let have = 0, need = 0, ok = true;
  for (const e of evOf(t)) { const n = Math.max(1, e.min || 1), h = Math.min(n, proofsOf(t, e.id).length); have += h; need += n; if (h < n) ok = false; }
  return { have, need, ok };
}
const ppeIcon = v => (PPE[v] || ['🛡️', v])[0], ppeLabel = v => (PPE[v] || ['🛡️', v])[1];

/* =====================================================================
   2. MODEL – thêm evidence (yêu cầu bằng chứng) + proofs (ảnh đã nộp)
   ===================================================================== */
const _norm = normalizeTask;
normalizeTask = function (t) {
  const x = _norm(t);
  if (OP.pendingEv && x.id === OP.pendingEv.id) x.evidence = OP.pendingEv.list;
  x.evidence = Array.isArray(x.evidence)
    ? x.evidence.filter(e => e && String(e.label || '').trim()).map(e => ({ id: String(e.id || U.uid()), label: String(e.label).trim(), min: Math.max(1, Math.round(U.num(e.min, 1))) }))
    : [];
  x.proofs = x.proofs && typeof x.proofs === 'object' && !Array.isArray(x.proofs) ? x.proofs : {};
  return x;
};

/* =====================================================================
   3. PLANNER – khai báo yêu cầu bằng chứng trong panel sửa task
   ===================================================================== */
let evDraft = [];
const _dRender = Drawer.render.bind(Drawer);
Drawer.render = function (t, isNew) { _dRender(t, isNew); try { injectEv(t); } catch (e) { console.error(e); } };
function injectEv(t) {
  const body = $('#drawer .drawer-b'); if (!body) return;
  evDraft = (t.evidence || []).map(e => ({ ...e }));
  const box = document.createElement('div'); box.className = 'xseq';
  const anchor = body.querySelector('.xseq');
  if (anchor) anchor.after(box); else body.insertBefore(box, body.firstChild);
  const draw = () => {
    box.innerHTML = `<div class="xs-h"><span class="xs-n">3</span> Bằng chứng để đóng task <span class="muted small" style="font-weight:400">· operator phải upload đủ mới đóng được</span></div>
      ${evDraft.length ? evDraft.map((e, i) => `<div class="ev-row"><input data-evl="${i}" value="${U.esc(e.label)}" placeholder="VD: Ảnh checklist giấy">
        <input data-evm="${i}" type="number" min="1" value="${e.min || 1}" title="Số ảnh tối thiểu"><button type="button" class="btn icon" data-evd="${i}">✕</button></div>`).join('')
        : '<div class="muted small">Chưa đặt yêu cầu → mặc định cần 1 "Ảnh xác nhận hoàn thành".</div>'}
      <div class="muted small" style="margin-top:4px">Cột số = số ảnh tối thiểu.</div>
      <div class="ev-pre">${PRESETS.map(p => `<button type="button" data-evp="${U.esc(p)}">+ ${U.esc(p)}</button>`).join('')}<button type="button" data-evp="">+ Yêu cầu khác</button></div>`;
  };
  box.addEventListener('input', e => {
    const l = e.target.dataset.evl, m = e.target.dataset.evm;
    if (l !== undefined) evDraft[+l].label = e.target.value;
    if (m !== undefined) evDraft[+m].min = U.num(e.target.value, 1);
  });
  box.addEventListener('click', e => {
    const d = e.target.closest('[data-evd]'), p = e.target.closest('[data-evp]');
    if (d) { evDraft.splice(+d.dataset.evd, 1); draw(); }
    if (p) { evDraft.push({ id: U.uid(), label: p.dataset.evp, min: 1 }); draw(); if (!p.dataset.evp) { const ins = box.querySelectorAll('[data-evl]'); ins[ins.length - 1]?.focus(); } }
  });
  draw();
}
const _dSave = Drawer.save.bind(Drawer);
Drawer.save = function () {
  OP.pendingEv = { id: App.drawerTaskId, list: evDraft.filter(e => String(e.label).trim()).map(e => ({ ...e })) };
  try { return _dSave(); } finally { OP.pendingEv = null; }
};

/* =====================================================================
   4. TIỆN ÍCH: ca, ảnh, upload, lưu đồng bộ
   ===================================================================== */
function shiftWin(date, ca) { const s = U.parseLocalISO(date + 'T00:00') + SHIFTS[ca - 1].s * MS_H; return [s, s + 8 * MS_H]; }
function nowShift() {
  const n = new Date(), h = n.getHours(), d = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  if (h < 6) d.setDate(d.getDate() - 1);
  return { date: U.toLocalISO(d.getTime()).slice(0, 10), ca: h >= 6 && h < 14 ? 1 : h >= 14 && h < 22 ? 2 : 3 };
}
function pickPlan() {
  const now = Date.now();
  for (const p of plans()) { if (!p.tasks.length) continue; const r = Scheduler.schedule(p); if (r.windowStart - 12 * MS_H <= now && now <= r.windowEnd + 12 * MS_H) return p.id; }
  return Store.state.activePlanId;
}
function curTask(planId, taskId) { const p = plans().find(x => x.id === planId); return p ? { p, t: p.tasks.find(x => x.id === taskId) } : null; }
function loadImg(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Không đọc được ảnh')); i.src = src; }); }
async function resize(src, max, q) {
  const i = await loadImg(src), s = Math.min(1, max / Math.max(i.naturalWidth, i.naturalHeight));
  const c = document.createElement('canvas'); c.width = Math.round(i.naturalWidth * s); c.height = Math.round(i.naturalHeight * s);
  c.getContext('2d').drawImage(i, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', q);
}
async function compress(file) { const u = URL.createObjectURL(file); try { return await resize(u, 1600, 0.82); } finally { URL.revokeObjectURL(u); } }
async function postUpload(url, payload) {
  const r = await fetch(url, { method: 'POST', body: JSON.stringify(payload) });   // text/plain → không bị chặn CORS
  let j; try { j = await r.json(); } catch (e) { throw new Error('Apps Script trả về không đúng – kiểm tra Deploy "Anyone"'); }
  if (!j.ok) throw new Error(j.error || 'Upload lỗi');
  return j;
}
/* Lấy bản mới nhất trên cloud trước khi ghi → hạn chế 2 operator ghi đè nhau */
async function freshCommit(label, planId, taskId, fn) {
  try {
    if (typeof sb !== 'undefined' && typeof applyCloud === 'function') {
      const { data } = await sb.from('planner_state').select('data').eq('id', 1).maybeSingle();
      const d = data && data.data;
      if (d && Array.isArray(d.plans) && d.plans.length && (typeof lastCloudAt === 'undefined' || (d.savedAt || 0) > lastCloudAt)) applyCloud(d);
    }
  } catch (e) { console.warn(e); }
  Store.commit(label, () => { const c = curTask(planId, taskId); if (!c || !c.t) return false; fn(c.t); });
}
const partial = t => Math.round(90 * evStat(t).have / evStat(t).need);
function statusOf(t, r) {
  if (t.progress >= 100) return ['done', 'Hoàn thành'];
  const now = Date.now();
  if (now >= r.end) return ['late', 'Trễ'];
  if (now >= r.start || evStat(t).have) return ['run', 'Đang làm'];
  return ['todo', 'Chưa bắt đầu'];
}

/* =====================================================================
   5. DANH SÁCH TASK TRONG CA
   ===================================================================== */
OP.open = function () {
  document.body.classList.add('op-mode'); $('#opView').classList.remove('hidden');
  if (!OP.planId || !plans().find(p => p.id === OP.planId)) { OP.planId = pickPlan(); Object.assign(OP, nowShift()); }

};
OP.close = function () {

  App.render();
};
OP.render = function () {
  if (!document.body.classList.contains('op-mode')) return;

  const res = Scheduler.schedule(plan), [ws, we] = shiftWin(OP.date, OP.ca), me = U.norm(myName());

  if (OP.mine && me) list = list.filter(t => U.norm(t.assignee).includes(me));
  list.sort((a, b) => res.R.get(a.id).start - res.R.get(b.id).start || a.order - b.order);
  const done = list.filter(t => t.progress >= 100).length, late = list.filter(t => statusOf(t, res.R.get(t.id))[0] === 'late').length;
  $('#opView').innerHTML = `
    <div class="op-h"><b>📋 Ca trực Shutdown</b>
      <button class="btn sm" id="opName">👤 ${U.esc(myName() || 'Nhập tên')}</button>
      <button class="btn sm" id="opBack">Planner</button></div>
    <div class="op-f">
      <select id="opPlan" class="full">${plans().map(p => `<option value="${U.esc(p.id)}" ${p.id === plan.id ? 'selected' : ''}>${U.esc(p.name)}</option>`).join('')}</select>
      <input type="date" id="opDate" value="${OP.date}">
      <label class="chk"><input type="checkbox" id="opMine" ${OP.mine ? 'checked' : ''}> Chỉ task của tôi</label>
      <div class="op-ca">${SHIFTS.map(s => `<button data-ca="${s.n}" class="${s.n === OP.ca ? 'on' : ''}">Ca ${s.n}<small>${s.label}</small></button>`).join('')}</div>
    </div>
    <div class="op-sum"><span><b>${list.length}</b>task${OP.mine ? ` (của tôi / ${total})` : ''}</span><span><b style="color:#16a34a">${done}</b>đã đóng</span>
      <span><b style="color:${late ? '#dc2626' : 'inherit'}">${late}</b>trễ</span><span><button class="btn sm" id="opNow">⟳ Ca hiện tại</button></span></div>
    ${list.length ? list.map(t => {
      const r = res.R.get(t.id), [st, stL] = statusOf(t, r), s = evStat(t), c = processColor(plan, t.process);
      const pct = t.progress >= 100 ? 100 : Math.round(100 * s.have / s.need);

          ${new Date(r.start).toDateString() !== new Date(r.end).toDateString() ? `<span class="muted">(${U.fmtDM(r.end).slice(0, 5)})</span>` : ''}
          <span class="op-tag">${U.esc(t.process)}</span><span class="op-st ${st}">${stL}</span></div>
        <div class="op-name">#${t.order} ${t.priority ? '⚑ ' : ''}${U.esc(t.taskName)}</div>
        <div class="op-meta">👤 ${U.esc(t.assignee || t.owner || 'Chưa phân công')}${(t.ppe || []).length ? ' · ' + t.ppe.map(ppeIcon).join(' ') : ''}<br>📷 ${s.have}/${s.need} ảnh bằng chứng</div>
        <div class="op-pb"><div style="width:${pct}%"></div></div></button>`;
    }).join('') : `<div class="op-empty">Không có task nào trong Ca ${OP.ca} ngày ${OP.date.split('-').reverse().join('/')}${OP.mine ? ' được giao cho bạn' : ''}.</div>`}`;
};

/* =====================================================================
   6. CHI TIẾT TASK + UPLOAD ẢNH + ĐÓNG TASK
   ===================================================================== */
OP.openTask = function (taskId) {
  const m = openModal(`<div class="modal-h"><h3 id="opSheetT"></h3><button class="x" data-close>×</button></div>
    <div class="modal-b" id="opSheetB"></div><div class="modal-f" id="opSheetF" style="display:block"></div>`, 'op-sheet');
  OP.sheet = { planId: OP.planId, taskId, m };
  m.addEventListener('change', e => {
    const i = e.target.closest('input[type=file][data-req]'); if (!i) return;
    const files = [...i.files]; i.value = '';
    files.forEach(f => uploadOne(OP.sheet.planId, taskId, i.dataset.req, f));
  });
  m.addEventListener('click', e => {
    if (e.target.closest('#opDone')) closeTask(taskId);
    if (e.target.closest('#opReopen')) reopenTask(taskId);
    const rm = e.target.closest('[data-rm]');
    if (rm) { e.preventDefault(); removeProof(taskId, rm.dataset.req, rm.dataset.rm); }
    const fl = e.target.closest('[data-fail]');
    if (fl) { const k = taskId + '|' + fl.dataset.req; OP.local.set(k, (OP.local.get(k) || []).filter(x => x.k !== fl.dataset.fail)); drawSheet(); }
  });
  drawSheet();
};
function drawSheet() {
  const s = OP.sheet; if (!s || !document.body.contains(s.m)) return;
  const c = curTask(s.planId, s.taskId); if (!c || !c.t) return;
  const { p, t } = c, r = Scheduler.schedule(p).R.get(t.id), st = evStat(t), done = t.progress >= 100, me = myName();
  const wait = t.dependencyIds.map(id => p.tasks.find(x => x.id === id)).filter(x => x && x.progress < 100);
  $('#opSheetT', s.m).textContent = `#${t.order} ${t.taskName}`;
  $('#opSheetB', s.m).innerHTML = `
    <div class="op-info">🕒 <b>${U.fmtDM(r.start)} → ${U.fmtDM(r.end)}</b> (${U.fmtDur(t.durationHours)})<br>
      🏭 ${U.esc(t.process)} · ${U.esc(t.branch)}<br>
      👤 ${U.esc(t.assignee || 'Chưa phân công')}${t.owner ? ' · ' + U.esc(t.owner) : ''}
      ${(t.ppe || []).length ? `<br>🦺 PPE: ${t.ppe.map(v => ppeIcon(v) + ' ' + U.esc(ppeLabel(v))).join(' · ')}` : ''}
      ${t.notes ? `<br>📝 ${U.esc(t.notes)}` : ''}${t.method ? `<br>🔧 ${U.esc(t.method)}` : ''}
      ${t.proofFolder ? `<br>📁 <a href="${U.esc(t.proofFolder)}" target="_blank" rel="noopener">Mở thư mục ảnh trên Drive</a>` : ''}</div>
    ${wait.length ? `<div class="op-warn">⚠ Task trước chưa đóng: ${wait.map(x => '#' + x.order + ' ' + U.esc(x.taskName)).join(', ')}</div>` : ''}
    ${!uploadUrl() ? '<div class="op-warn">⚠ Chưa cài nơi lưu ảnh nên chưa chụp / upload được. Người lập kế hoạch vào Planner → ☰ → <b>Cấu hình upload ảnh (Google Drive)</b> và dán link Apps Script dạng https://script.google.com/macros/s/…/exec</div>' : ''}
    ${evOf(t).map(e => {
      const pr = proofsOf(t, e.id), loc = (OP.local.get(t.id + '|' + e.id) || []), need = Math.max(1, e.min || 1), ok = pr.length >= need;
      return `<div class="op-req ${ok ? 'ok' : ''}"><h5>${ok ? '✅' : '📷'} ${U.esc(e.label)}<span>${Math.min(pr.length, need)}/${need}</span></h5>
        ${pr.length || loc.length ? `<div class="op-thumbs">
          ${pr.map(x => `<a href="${U.esc(x.url)}" target="_blank" rel="noopener"><img loading="lazy" src="${OP.prev.get(x.fid) || 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(x.fid) + '&sz=w300'}" alt="">
            <small>${U.esc(x.by)} · ${U.fmtHM(x.at)}</small>${!done && U.norm(x.by) === U.norm(me) ? `<i data-rm="${U.esc(x.fid)}" data-req="${U.esc(e.id)}" title="Gỡ ảnh">✕</i>` : ''}</a>`).join('')}
          ${loc.map(l => `<div class="${l.state === 'up' ? 'up' : 'fail'}" ${l.state === 'fail' ? `data-fail="${l.k}" data-req="${U.esc(e.id)}"` : ''}>${l.prev ? `<img src="${l.prev}" alt="">` : ''}
            <small>${l.state === 'up' ? 'Đang tải lên…' : 'Lỗi: ' + U.esc(l.err) + ' (chạm để bỏ)'}</small></div>`).join('')}</div>` : ''}
        ${done ? '' : `<div class="op-acts">
          <label class="op-btn cam">📷 Chụp ảnh<input type="file" accept="image/*" capture="environment" data-req="${U.esc(e.id)}"></label>
          <label class="op-btn">🖼️ Chọn ảnh<input type="file" accept="image/*" multiple data-req="${U.esc(e.id)}"></label></div>`}</div>`;
    }).join('')}`;
  $('#opSheetF', s.m).innerHTML = done
    ? `<div class="op-doneline"><span>✅ Đã đóng${t.doneBy ? ' bởi <b>' + U.esc(t.doneBy) + '</b>' : ''}${t.doneAt ? ' lúc ' + U.fmtDM(t.doneAt) : ''}</span><button class="btn" id="opReopen">Mở lại</button></div>`
    : `<button class="op-close" id="opDone" ${st.ok ? '' : 'disabled'}>${st.ok ? '✓ Đóng task' : `Còn thiếu ${st.need - st.have} ảnh để đóng task`}</button>`;
}
async function uploadOne(planId, taskId, reqId, file) {
  if (!myName()) { toast('Hãy nhập tên trước khi upload (nút 👤).', 'warn'); return; }
  const url = uploadUrl(); if (!url) { toast('Chưa cấu hình nơi lưu ảnh.', 'err'); return; }
  const key = taskId + '|' + reqId, item = { k: U.uid(), prev: '', state: 'up', err: '' };
  if (!OP.local.has(key)) OP.local.set(key, []); OP.local.get(key).push(item); drawSheet();
  try {
    const data = await compress(file);
    item.prev = await resize(data, 300, 0.7); drawSheet();
    const c = curTask(planId, taskId), t = c.t, e = evOf(t).find(x => x.id === reqId) || { label: 'Anh' };
    const at = Date.now(), dd = OP.date.split('-').reverse().slice(0, 2).join('-');
    const j = await postUpload(url, {
      plan: c.p.name,
      folder: `#${pad2(t.order)} ${t.taskName} – Ca ${OP.ca} (${dd})`,
      name: `${e.label}_${myName()}_${stamp()}_${item.k.slice(0, 4)}.jpg`,
      mime: 'image/jpeg', data: data.split(',')[1],
    });
    OP.prev.set(j.id, item.prev);
    await freshCommit('Upload ảnh: ' + t.taskName, planId, taskId, tk => {
      tk.proofs = tk.proofs || {};
      (tk.proofs[reqId] = tk.proofs[reqId] || []).push({ fid: j.id, url: j.url, by: myName(), at, ca: OP.ca });
      if (j.folder) tk.proofFolder = j.folder;
      if (tk.progress < 100) tk.progress = Math.max(tk.progress, partial(tk));
    });
    OP.local.set(key, OP.local.get(key).filter(x => x !== item));
    toast('Đã lưu ảnh lên Drive', 'ok');
  } catch (err) { item.state = 'fail'; item.err = err.message; toast('Upload lỗi: ' + err.message, 'err'); }
  drawSheet(); OP.render();
}
function removeProof(taskId, reqId, fid) {
  const s = OP.sheet;
  freshCommit('Gỡ ảnh bằng chứng', s.planId, taskId, t => {
    t.proofs[reqId] = proofsOf(t, reqId).filter(x => x.fid !== fid);
    if (t.progress < 100) t.progress = partial(t);
  }).then(() => { drawSheet(); OP.render(); });
}
function closeTask(taskId) {
  const s = OP.sheet, c = curTask(s.planId, taskId); if (!c || !evStat(c.t).ok) return;
  freshCommit('Đóng task ' + c.t.taskName, s.planId, taskId, t => {
    if (!evStat(t).ok) return;
    t.progress = 100; t.doneBy = myName(); t.doneAt = Date.now();
  }).then(() => { toast('Đã đóng task ✓', 'ok'); drawSheet(); OP.render(); });
}
function reopenTask(taskId) {
  const s = OP.sheet;
  freshCommit('Mở lại task', s.planId, taskId, t => { t.progress = partial(t); delete t.doneBy; delete t.doneAt; })
    .then(() => { drawSheet(); OP.render(); });
}
function askName() {
  const names = [...new Set(plans().flatMap(p => p.tasks.flatMap(t => U.splitOwners(t.assignee))))].sort((a, b) => a.localeCompare(b, 'vi'));
  const m = openModal(`<div class="modal-h"><h3>Bạn là ai?</h3><button class="x" data-close>×</button></div>
    <div class="modal-b"><p class="muted" style="margin-top:0">Tên sẽ gắn vào ảnh bạn chụp và khi đóng task.</p>
      <input id="opNm" list="opNms" style="width:100%;font-size:16px;padding:12px" value="${U.esc(myName())}" placeholder="Họ tên">
      <datalist id="opNms">${names.map(n => `<option value="${U.esc(n)}">`).join('')}</datalist></div>
    <div class="modal-f"><button class="btn primary lg" id="opNmOk">Lưu</button></div>`, 'sm');
  $('#opNmOk', m).onclick = () => { const v = $('#opNm', m).value.trim(); if (!v) return; SafeStore.set('op.name', v); closeModal(); OP.render(); };
}

/* =====================================================================
   7. CẤU HÌNH UPLOAD (planner) – lưu vào kế hoạch nên mọi máy đều nhận
   ===================================================================== */
function configUpload() {
  const m = openModal(`<div class="modal-h"><h3>Cấu hình upload ảnh (Google Drive)</h3><button class="x" data-close>×</button></div>
    <div class="modal-b"><p style="margin-top:0">Dán URL Web App của Google Apps Script (dạng <code>https://script.google.com/macros/s/…/exec</code>).</p>
      <input id="upUrl" style="width:100%" value="${U.esc(uploadUrl())}"><div class="calc" id="upMsg" style="margin-top:10px">Ảnh sẽ lưu theo: <b>Tên kế hoạch / #STT Tên task – Ca X (dd-mm) / ảnh.jpg</b></div></div>
    <div class="modal-f"><button class="btn" id="upTest">Kiểm tra kết nối</button><button class="btn" data-close>Hủy</button><button class="btn primary" id="upSave">Lưu</button></div>`, 'sm');
  $('#upTest', m).onclick = async () => {
    const u = $('#upUrl', m).value.trim(); $('#upMsg', m).textContent = 'Đang kiểm tra…';
    try { const j = await (await fetch(u)).json(); $('#upMsg', m).textContent = j.ok ? '✅ Kết nối được: ' + (j.folder || j.msg || '') : '❌ ' + (j.error || 'Lỗi'); }
    catch (e) { $('#upMsg', m).textContent = '❌ Không kết nối được – kiểm tra URL và quyền "Anyone".'; }
  };
  $('#upSave', m).onclick = () => {
    const u = $('#upUrl', m).value.trim();
    Store.commit('Cấu hình upload ảnh', () => { plans().forEach(p => p.uploadUrl = u); });
    closeModal(); toast('Đã lưu – mọi máy sẽ dùng cấu hình này.', 'ok');
  };
}

/* =====================================================================
   8. CÀI ĐẶT
   ===================================================================== */
function install() {
  const v = document.createElement('div'); v.id = 'opView'; v.className = 'hidden'; document.body.appendChild(v);
  v.addEventListener('click', e => {
    if (e.target.closest('#opBack')) return OP.close();
    if (e.target.closest('#opName')) return askName();
    if (e.target.closest('#opNow')) { Object.assign(OP, nowShift()); OP.planId = pickPlan(); return OP.render(); }
    const ca = e.target.closest('[data-ca]'); if (ca) { OP.ca = +ca.dataset.ca; return OP.render(); }
    const tk = e.target.closest('[data-op-task]'); if (tk) OP.openTask(tk.dataset.opTask);
  });
  v.addEventListener('change', e => {
    if (e.target.id === 'opPlan') OP.planId = e.target.value;
    if (e.target.id === 'opDate' && e.target.value) OP.date = e.target.value;
    if (e.target.id === 'opMine') OP.mine = e.target.checked;
    OP.render();
  });
  const sp = $('.topbar .spacer');
  if (sp) { const b = document.createElement('button'); b.className = 'tb-btn'; b.textContent = '📱 Ca trực'; b.onclick = () => OP.open(); sp.parentNode.insertBefore(b, sp); }
  const menu = $('#menuMore');
  if (menu) { const b = document.createElement('button'); b.textContent = 'Cấu hình upload ảnh (Google Drive)'; b.onclick = configUpload; menu.insertBefore(b, menu.querySelector('hr')); }
  const _render = App.render.bind(App);
  App.render = function () { _render(); OP.render(); drawSheet(); };
  window.addEventListener('hashchange', () => { if (location.hash === '#op') OP.open(); });
  if (location.hash === '#op' || (matchMedia('(max-width:700px)').matches && !/^#(wr|admin)$/.test(location.hash))) OP.open();
}
document.addEventListener('DOMContentLoaded', install);
})();

<script>
(function () {
'use strict';
/* =====================================================================
   1. ĐĂNG NHẬP
   Mật khẩu KHÔNG lưu dạng chữ – chỉ lưu mã băm SHA-256 của "decaf-planner|user|pass".
   Đổi tài khoản: tạo mã băm mới rồi thay vào AUTH_HASH.
   ===================================================================== */
const AUTH_HASH = 'e710f3cafdaede8961a9e626bbbcf6a0e6435ac8e63691b7629774ba7039ba07';
const AUTH_KEY = 'sp.auth.v1';
const START_HASH = location.hash;   // nhớ hash ban đầu (trang Ca trực có thể tự đổi hash trên điện thoại)

async function sha256(s) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
}
const Auth = {
  ok: false, user: '',
  load() {
    try { const a = JSON.parse(localStorage.getItem(AUTH_KEY) || 'null'); if (a && a.h === AUTH_HASH) { this.ok = true; this.user = a.u; } } catch (e) { }
  },
  async login(u, p) {
    if (await sha256('decaf-planner|' + u.trim() + '|' + p) !== AUTH_HASH) return false;
    this.ok = true; this.user = u.trim();
    try { localStorage.setItem(AUTH_KEY, JSON.stringify({ u: this.user, h: AUTH_HASH, at: Date.now() })); } catch (e) { }
    apply(); return true;
  },
  logout() { this.ok = false; this.user = ''; try { localStorage.removeItem(AUTH_KEY); } catch (e) { } apply(); if (document.body.classList.contains('admin-mode')) Admin.close(); },
};
window.Auth = Auth;

const opMode = () => document.body.classList.contains('op-mode');
const canWrite = () => Auth.ok || opMode();

function askLogin(reason) {
  return new Promise(res => {
    const m = openModal(`<div class="modal-h"><h3>🔒 Đăng nhập để chỉnh sửa</h3><button class="x" data-close>×</button></div>
      <div class="modal-b au-form">
        ${reason ? `<div class="au-lock">${U.esc(reason)}</div>` : ''}
        <input id="auU" placeholder="Tên đăng nhập" autocomplete="username" autocapitalize="off">
        <input id="auP" type="password" placeholder="Mật khẩu" autocomplete="current-password">
        <div class="au-err" id="auE"></div>
        <p class="muted small" style="margin:0">Máy này sẽ nhớ đăng nhập cho tới khi bấm Đăng xuất.</p></div>
      <div class="modal-f"><button class="btn" data-close>Chỉ xem</button><button class="btn primary" id="auOk">Đăng nhập</button></div>`, 'sm');
    let done = false;
    const go = async () => {
      if (await Auth.login($('#auU', m).value, $('#auP', m).value)) { done = true; closeModal(); toast('Đã đăng nhập – có thể chỉnh sửa.', 'ok'); res(true); }
      else { $('#auE', m).textContent = 'Sai tên đăng nhập hoặc mật khẩu.'; $('#auP', m).select(); }
    };
    $('#auOk', m).onclick = go;
    m.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    $$('[data-close]', m).forEach(b => b.addEventListener('click', () => { if (!done) res(false); }));
    setTimeout(() => $('#auU', m)?.focus(), 50);
  });
}
const lockMsg = 'Kế hoạch đang ở chế độ chỉ xem. Đăng nhập để tạo / sửa task.';
const deny = () => { if (!$('#modalRoot').innerHTML) askLogin(lockMsg); return false; };

/* =====================================================================
   2. CHẶN CHỈNH SỬA KHI CHƯA ĐĂNG NHẬP (cài sau cùng để bọc ngoài mọi module)
   ===================================================================== */
function guard() {
  const _commit = Store.commit;
  Store.commit = function (...a) { if (!canWrite()) return deny(); return _commit.apply(this, a); };
  const _undo = Store.doUndo, _redo = Store.doRedo;
  Store.doUndo = function (...a) { if (!canWrite()) return deny(); return _undo.apply(this, a); };
  Store.doRedo = function (...a) { if (!canWrite()) return deny(); return _redo.apply(this, a); };

  const _wiz = Home.wizard;
  Home.wizard = async function (...a) { if (!Auth.ok && !(await askLogin('Cần đăng nhập để tạo kế hoạch mới.'))) return; return _wiz.apply(this, a); };
  const _new = Drawer.openNew;
  Drawer.openNew = async function (...a) { if (!Auth.ok && !(await askLogin('Cần đăng nhập để thêm task.'))) return; return _new.apply(this, a); };

  /* Kéo thả: chưa đăng nhập thì chỉ mở xem chi tiết task */
  const _ds = Drag.start;
  Drag.start = function (e) {
    if (Auth.ok) return _ds.call(this, e);
    const b = e.target.closest('.bar[data-id]'); if (!b || e.button !== 0) return;
    e.preventDefault(); App.selectedId = b.dataset.id; Gantt.render(); Drawer.open(b.dataset.id);
  };

  /* Panel task: chỉ xem */
  const _dr = Drawer.render;
  Drawer.render = function (...a) {
    _dr.apply(this, a);
    if (Auth.ok) return;
    const d = $('#drawer'); if (!d) return;
    $$('input,select,textarea,.drawer-b button', d).forEach(x => { if (!x.closest('.drawer-h')) x.disabled = true; });
    const f = $('.drawer-f', d);
    if (f) { f.innerHTML = '<button class="btn primary" id="auEdit">🔒 Đăng nhập để sửa</button><span style="flex:1"></span><button class="btn" id="auCl">Đóng</button>';
      $('#auCl', f).onclick = () => Drawer.close();
      $('#auEdit', f).onclick = async () => { const id = App.drawerTaskId; if (await askLogin()) Drawer.open(id); }; }
    const h = $('.drawer-h h3', d); if (h) h.textContent = 'Chi tiết task (chỉ xem)';
  };

  /* Không đẩy dữ liệu lên cloud khi đang chỉ xem (tránh ghi đè bản mới của người khác) */
  if (typeof cloudSave === 'function') {
    const _cs = cloudSave;
    cloudSave = function (...a) { if (!canWrite()) return; return _cs.apply(this, a); };
  }

  /* Menu ☰: giữ lại mục chỉ xem/ xuất file */
  $$('#menuMore [data-more]').forEach(b => { if (['warnings', 'dark', 'copy-data', 'save-app'].includes(b.dataset.more)) b.setAttribute('data-ro-ok', ''); });
  $$('#menuExport button').forEach(b => b.setAttribute('data-ro-ok', ''));
}

/* =====================================================================
   3. GIAO DIỆN: badge trạng thái + nút Admin
   ===================================================================== */
function apply() {
  document.body.classList.toggle('ro', !Auth.ok);
  ['#planName', '#planStart', '#planTarget'].forEach(s => { const x = $(s); if (x) x.disabled = !Auth.ok; });
  const b = $('#auBadge');
  if (b) { b.className = 'au-badge ' + (Auth.ok ? 'rw' : 'ro'); b.textContent = Auth.ok ? '✓ ' + Auth.user : '👁 Chỉ xem – Đăng nhập'; b.title = Auth.ok ? 'Bấm để đăng xuất' : 'Đăng nhập để chỉnh sửa'; }
  const a = $('#auAdmin'); if (a) a.style.display = Auth.ok ? '' : 'none';
  if (typeof App !== 'undefined' && App.res) { App.render(); if (App.drawerTaskId && !App.drawerIsNew) Drawer.open(App.drawerTaskId); }
}
function installUI() {
  const sp = $('.topbar .spacer'); if (!sp) return;
  const ad = document.createElement('button'); ad.className = 'tb-btn'; ad.id = 'auAdmin'; ad.textContent = '🛡 Admin'; ad.onclick = () => Admin.open();
  const bd = document.createElement('span'); bd.id = 'auBadge';
  bd.onclick = async () => { if (Auth.ok) { if (await confirmBox('Đăng xuất', `Đăng xuất tài khoản <b>${U.esc(Auth.user)}</b> trên máy này?`, 'Đăng xuất')) { Auth.logout(); toast('Đã đăng xuất – chế độ chỉ xem.'); } } else askLogin(); };
  sp.after(bd); sp.parentNode.insertBefore(ad, sp);
}

/* =====================================================================
   4. TRANG ADMIN – theo dõi ảnh bằng chứng & tiến độ
   ===================================================================== */
const DEF_EV = [{ id: 'done', label: 'Ảnh xác nhận hoàn thành', min: 1 }];
const evOf = t => (Array.isArray(t.evidence) && t.evidence.length ? t.evidence : DEF_EV);
const prOf = (t, id) => ((t.proofs || {})[id] || []);
function evStat(t) { let h = 0, n = 0; for (const e of evOf(t)) { const k = Math.max(1, e.min || 1); n += k; h += Math.min(k, prOf(t, e.id).length); } return { h, n }; }
function stOf(t, r) { if (t.progress >= 100) return ['done', 'Hoàn thành']; const now = Date.now(); if (now >= r.end) return ['late', 'Trễ']; if (now >= r.start || t.progress > 0) return ['run', 'Đang làm']; return ['todo', 'Chưa bắt đầu']; }
const thumb = fid => 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(fid) + '&sz=w200';

const Admin = {
  planId: null, f: { st: '', ca: '', date: '', q: '' },
  async open() {
    if (!Auth.ok && !(await askLogin('Trang Admin cần đăng nhập.'))) { if (location.hash === '#admin') history.replaceState(null, '', location.pathname); return; }
    document.body.classList.remove('op-mode'); $('#opView')?.classList.add('hidden');
    document.body.classList.add('admin-mode'); $('#adView').classList.remove('hidden');
    if (!this.planId) this.planId = Store.state.activePlanId;
    if (location.hash !== '#admin') history.replaceState(null, '', '#admin');
    this.render();
  },
  close() {
    document.body.classList.remove('admin-mode'); $('#adView').classList.add('hidden');
    history.replaceState(null, '', location.pathname + location.search); App.render();
  },
  render() {
    if (!document.body.classList.contains('admin-mode')) return;
    const plans = Store.state.plans;
    let p = plans.find(x => x.id === this.planId) || plans[0]; this.planId = p.id;
    const res = Scheduler.schedule(p), f = this.f, now = Date.now();
    const all = p.tasks.slice().sort((a, b) => res.R.get(a.id).start - res.R.get(b.id).start || a.order - b.order);
    const rows = all.filter(t => {
      const r = res.R.get(t.id), st = stOf(t, r)[0];
      if (f.st === 'need' ? !(st !== 'done' && evStat(t).h > 0) : f.st && st !== f.st) return false;
      if (f.ca && U.shiftOf(r.start) !== +f.ca) return false;
      if (f.date && U.toLocalISO(r.start).slice(0, 10) !== f.date && U.toLocalISO(r.end - 1).slice(0, 10) !== f.date) return false;
      if (f.q && !U.norm(t.taskName + ' ' + t.process + ' ' + t.assignee).includes(U.norm(f.q))) return false;
      return true;
    });
    const cnt = k => all.filter(t => stOf(t, res.R.get(t.id))[0] === k).length;
    let eh = 0, en = 0; all.forEach(t => { const s = evStat(t); eh += s.h; en += s.n; });
    const dur = all.reduce((s, t) => s + (t.durationHours || 0), 0), prog = dur ? all.reduce((s, t) => s + (t.durationHours || 0) * Math.min(100, t.progress || 0), 0) / dur : 0;
    const critOpen = all.filter(t => res.R.get(t.id).critical && t.progress < 100).length;

    /* tiến độ theo process */
    const byP = new Map();
    for (const t of all) { if (!byP.has(t.process)) byP.set(t.process, { d: 0, n: 0, h: 0, w: 0 }); const o = byP.get(t.process); o.n++; if (t.progress >= 100) o.d++; o.h += (t.durationHours || 0) * (t.progress || 0); o.w += t.durationHours || 0; }

    /* ảnh mới nhất */
    const feed = [];
    for (const t of all) for (const e of evOf(t)) for (const x of prOf(t, e.id)) feed.push({ t, e, x });
    feed.sort((a, b) => b.x.at - a.x.at);

    $('#adView').innerHTML = `
      <div class="ad-h"><b>🛡 Admin – theo dõi Shutdown</b>
        <select id="adPlan">${plans.map(x => `<option value="${U.esc(x.id)}" ${x.id === p.id ? 'selected' : ''}>${U.esc(x.name)}</option>`).join('')}</select>
        <button class="btn sm" id="adOp">📱 Ca trực</button><button class="btn sm" id="adBack">Planner</button></div>
      <div class="ad-kpis">
        <div class="ad-k"><span>Tiến độ tổng</span><b>${U.fmtNum(prog, 0)}%</b><div class="ad-bar"><div style="width:${prog}%;background:linear-gradient(90deg,#30d158,#34c7ff)"></div></div></div>
        <div class="ad-k"><span>Đã đóng</span><b style="color:#16a34a">${cnt('done')}/${all.length}</b><small>task</small></div>
        <div class="ad-k"><span>Đang làm</span><b style="color:#2563eb">${cnt('run')}</b><small>task</small></div>
        <div class="ad-k"><span>Trễ</span><b style="color:${cnt('late') ? '#dc2626' : 'inherit'}">${cnt('late')}</b><small>quá giờ kết thúc, chưa đóng</small></div>
        <div class="ad-k"><span>Ảnh bằng chứng</span><b>${eh}/${en}</b><small>${en ? Math.round(100 * eh / en) : 0}% yêu cầu đã có ảnh</small></div>
        <div class="ad-k"><span>Critical task chưa xong</span><b style="color:${critOpen ? '#991b1b' : 'inherit'}">${critOpen}</b><small>trễ là trễ cả Shutdown</small></div>
        <div class="ad-k"><span>Kết thúc dự kiến</span><b style="font-size:16px">${all.length ? U.fmtDM(res.windowEnd) : '–'}</b><small>${res.windowEnd > res.targetEnd + MS_MIN ? '⚠ vượt mục tiêu' : 'trong mục tiêu'}</small></div>
      </div>
      <div class="ad-grid">
        <div>
          <div class="ad-card">
            <h4>Danh sách task <span class="muted small" style="font-weight:400">· ${rows.length}/${all.length}</span></h4>
            <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">
              <input id="adQ" placeholder="Tìm task / người / process" value="${U.esc(f.q)}" style="flex:1;min-width:150px">
              <select id="adSt"><option value="">Mọi trạng thái</option>${[['todo', 'Chưa bắt đầu'], ['run', 'Đang làm'], ['late', 'Trễ'], ['done', 'Hoàn thành'], ['need', 'Có ảnh – chưa đóng']].map(([k, v]) => `<option value="${k}" ${f.st === k ? 'selected' : ''}>${v}</option>`).join('')}</select>
              <select id="adCa"><option value="">Mọi ca</option>${[1, 2, 3].map(n => `<option value="${n}" ${+f.ca === n ? 'selected' : ''}>Ca ${n}</option>`).join('')}</select>
              <input type="date" id="adDate" value="${f.date}"><button class="btn sm" id="adClr">Xóa lọc</button>
            </div>
            ${rows.length ? rows.map(t => {
              const r = res.R.get(t.id), [st, stL] = stOf(t, r), s = evStat(t);
              return `<div class="ad-task">
                <div><div class="ad-tn">#${t.order} ${U.esc(t.taskName)} ${r.critical ? '<span style="color:#991b1b;font-size:11px">● găng</span>' : ''}</div>
                  <div class="ad-tm">${U.esc(t.process)} · Ca ${U.shiftOf(r.start)} · ${U.fmtDM(r.start)} → ${U.fmtDM(r.end)} · 👤 ${U.esc(t.assignee || 'Chưa phân công')}
                  ${t.doneBy ? `<br>✅ Đóng bởi <b>${U.esc(t.doneBy)}</b> lúc ${U.fmtDM(t.doneAt)}` : ''}
                  ${t.proofFolder ? ` · <a href="${U.esc(t.proofFolder)}" target="_blank" rel="noopener">📁 Thư mục ảnh</a>` : ''}</div></div>
                <div style="text-align:right"><span class="ad-st ${st}">${stL}</span><div class="ad-tm" style="margin-top:4px">📷 ${s.h}/${s.n} · ${t.progress || 0}%</div></div>
                <div class="ad-ev">${evOf(t).map(e => { const pr = prOf(t, e.id), ok = pr.length >= Math.max(1, e.min || 1);
                  return `<span class="lbl ${ok ? 'ok' : ''}">${ok ? '✓' : '○'} ${U.esc(e.label)} ${pr.length}/${Math.max(1, e.min || 1)}</span>` +
                    pr.map(x => `<a class="ad-th" href="${U.esc(x.url)}" target="_blank" rel="noopener" title="${U.esc(x.by)} · ${U.fmtDM(x.at)}"><img loading="lazy" src="${thumb(x.fid)}" alt=""><small>${U.esc(x.by)}</small></a>`).join(''); }).join('')}</div>
              </div>`; }).join('') : '<div class="ad-empty">Không có task khớp bộ lọc.</div>'}
          </div>
        </div>
        <div>
          <div class="ad-card"><h4>Tiến độ theo process</h4>
            ${[...byP].map(([k, o]) => { const pc = o.w ? o.h / o.w : 0; return `<div class="ad-proc"><span>${U.esc(k)}</span><div class="ad-bar"><div style="width:${pc}%;background:${processColor(p, k)}"></div></div><span class="muted">${o.d}/${o.n} · ${Math.round(pc)}%</span></div>`; }).join('') || '<div class="ad-empty">Chưa có task.</div>'}
          </div>
          <div class="ad-card"><h4>Ảnh mới cập nhật <span class="muted small" style="font-weight:400">· ${feed.length} ảnh</span></h4>
            ${feed.slice(0, 40).map(({ t, e, x }) => `<div class="ad-feed"><a class="ad-th" href="${U.esc(x.url)}" target="_blank" rel="noopener"><img loading="lazy" src="${thumb(x.fid)}" alt=""></a>
              <div><b>${U.esc(x.by)}</b> · ${U.fmtDM(x.at)}${x.ca ? ' · Ca ' + x.ca : ''}<br>#${t.order} ${U.esc(t.taskName)}<br><span class="muted">${U.esc(e.label)}</span></div></div>`).join('') || '<div class="ad-empty">Chưa có ảnh nào được upload.</div>'}
          </div>
          <div class="muted small" style="text-align:center">Tự cập nhật khi operator upload · ${new Date(now).toLocaleTimeString('vi-VN')}</div>
        </div>
      </div>`;
  },
};
window.AdminView = Admin;

function installAdmin() {
  const v = document.createElement('div'); v.id = 'adView'; v.className = 'hidden'; document.body.appendChild(v);
  v.addEventListener('click', e => {
    if (e.target.closest('#adBack')) return Admin.close();
    if (e.target.closest('#adOp')) { Admin.close(); window.OperatorView && OperatorView.open(); return; }
    if (e.target.closest('#adClr')) { Admin.f = { st: '', ca: '', date: '', q: '' }; Admin.render(); }
  });
  v.addEventListener('change', e => {
    const id = e.target.id;
    if (id === 'adPlan') Admin.planId = e.target.value;
    if (id === 'adSt') Admin.f.st = e.target.value;
    if (id === 'adCa') Admin.f.ca = e.target.value;
    if (id === 'adDate') Admin.f.date = e.target.value;
    Admin.render();
  });
  let qT; v.addEventListener('input', e => { if (e.target.id === 'adQ') { clearTimeout(qT); qT = setTimeout(() => { Admin.f.q = e.target.value; Admin.render(); const q = $('#adQ'); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }, 300); } });
  const _r = App.render.bind(App);
  App.render = function () { _r(); if (document.activeElement?.id !== 'adQ') Admin.render(); };
  setInterval(() => Admin.render(), 60000);
  window.addEventListener('hashchange', () => { if (location.hash === '#admin') Admin.open(); });
}

/* =====================================================================
   5. KHỞI ĐỘNG – chạy SAU tất cả module khác (LDC, Ca trực, Supabase)
   ===================================================================== */
document.addEventListener('DOMContentLoaded', () => setTimeout(() => {
  Auth.load(); guard(); installUI(); installAdmin(); apply();
  if (START_HASH === '#admin') Admin.open();
}, 0));
})();
</script>

<script>
(function () {
'use strict';
try {
/* =====================================================================
   0. CẤU HÌNH + DANH MỤC MẶC ĐỊNH (bị ghi đè bởi sheet LISTS của file upload)
   ===================================================================== */
const TEMPLATE_URL = './Mau_Work_Request.xlsx';
const TEMPLATE_ALT = ['./Mau_Work_Request.xlsx', './Mau_Work_Request_final.xlsx', './Mau_Work_Request_v3.xlsx'];
async function downloadTemplate() {

    } catch (e) { }
  }
  if (location.protocol === 'file:') { const a = document.createElement('a'); a.href = TEMPLATE_URL; a.download = 'Mau_Work_Request.xlsx'; a.click(); WR.dlDone = true; WR.render(); return; }
  toast('Không tìm thấy file Mau_Work_Request.xlsx trên GitHub – hãy upload file này vào cùng thư mục với index.html.', 'err');
}
const DEF = {
  modes: ['Mode 0', 'Mode 1', 'Mode 2', 'Mode 3', 'Mode 4'],
  ptw: ['Không', 'Trên cao', 'Tia lửa / Công việc nóng', 'Điện nguy cơ cao', 'Không gian kín', 'Mode 4', 'Thiết bị nâng', 'Đào đất', 'Phá dỡ'],
  packs: { 'Cơ bản': ['Mũ', 'Kính', 'Giày', 'Găng tay'], 'Chịu nhiệt': ['Mũ', 'Kính', 'Giày', 'Găng tay', 'Găng chịu nhiệt', 'Áo dài tay'],
    'Hóa chất / CIP': ['Mũ', 'Kính', 'Giày', 'Găng tay', 'Găng hóa chất', 'Mặt nạ', 'Tạp dề', 'Ủng'], 'Trên cao': ['Mũ', 'Kính', 'Giày', 'Găng tay', 'Dây an toàn toàn thân'],
    'Không gian kín': ['Mũ', 'Kính', 'Giày', 'Găng tay', 'Máy đo khí', 'Mặt nạ'], 'Tiếng ồn': ['Nút tai / chụp tai'] },
  yn: ['Có', 'Không'], kinds: ['Bắt buộc', 'Bổ sung'], n: ['1', '2', '3', '4', '5'],
};
const WR = { data: null, planId: null, onlyMiss: false, prioDraft: null, form: { name: '', start: '', target: 48 }, pendingSeq: null };
window.WorkRequest = WR;

const N = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[đĐ]/g, 'd').toLowerCase().replace(/\s+/g, ' ').trim();
const YES = v => ['co', 'yes', 'x', 'true', '1'].includes(N(v));
const isNo = v => ['khong', 'no', 'false', '0', '—', '-', ''].includes(N(v));
const esc = s => U.esc(s ?? '');
const plans = () => Store.state.plans;
const findP = id => plans().find(p => p.id === id);
const opName = () => SafeStore.get('op.name') || '';
const slug = s => N(s).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const ptwOf = s => (s && YES(s.need) && s.ptw && !isNo(s.ptw)) ? s.ptw : '';
const lotoOn = s => !!s && YES(s.need) && !!(String(s.wiLoto || '').trim() || String(s.lotoPts || '').trim());
/* "Khí nén: HV của regulator; Điện: CB quạt MCC" → [{energy, point}] */
function parsePts(str) {
  return String(str || '').split(/[;\n]+/).map(x => x.trim()).filter(Boolean).map((x, i) => {
    const k = x.indexOf(':'); return k > 0 ? { stt: i + 1, energy: x.slice(0, k).trim(), point: x.slice(k + 1).trim() } : { stt: i + 1, energy: '', point: x };
  });
}

/* =====================================================================
   1. ĐỌC FILE (dò theo TÊN CỘT – đổi vị trí cột vẫn đọc đúng)
   ===================================================================== */
const HDR = [
  ['branch', h => h === 'nhanh'], ['process', h => h === 'process'], ['equip', h => h.startsWith('thiet bi')],
  ['name', h => h.startsWith('ten cong viec')], ['desc', h => h.startsWith('mo ta')], ['kind', h => h.startsWith('loai cong viec')],
  ['dur', h => h.startsWith('thoi luong')], ['people', h => h.startsWith('so nguoi')],
  ['phCheck', h => h.startsWith('anh checklist')], ['phPtw', h => h.startsWith('anh giay phep')], ['phDone', h => h.startsWith('anh hoan thanh')],
  ['need', h => h.startsWith('can yeu cau an toan')], ['mode', h => h.startsWith('mode')],
  ['wiLoto', h => h === 'wi loto' || h.includes('huong dan loto')], ['lotoPts', h => h.startsWith('diem khoa')],
  ['ptw', h => h.startsWith('giay phep lam viec')], ['risk', h => h.startsWith('phieu tien doan')], ['ppe', h => h.startsWith('bo ppe')],
];
const clean = h => N(String(h).split('\n')[0]).replace(/\s*\*$/, '').replace(/\s*\(.*\)$/, '').trim();
function aoaOf(wb, name) {
  const n = wb.SheetNames.find(x => N(x) === N(name));
  return n ? XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: false, defval: '' }) : null;
}
function parseLists(A) {
  const out = { ptw: DEF.ptw.slice(), packs: { ...DEF.packs } };
  if (!A || !A.length) return out;
  const H = (A[0] || []).map(x => String(x).trim()), col = n => { const i = H.indexOf(n); return i < 0 ? [] : A.slice(1).map(r => String(r[i] ?? '').trim()).filter(v => v && v !== '—'); };
  if (col('L_PTW').length) out.ptw = col('L_PTW');
  const pk = col('PPE_PACKS');
  if (pk.length) {
    const packs = {};
    pk.forEach(x => { const k = x.indexOf('='); if (k > 0) packs[x.slice(0, k).trim()] = x.slice(k + 1).split(/[,;+]+/).map(s => s.trim()).filter(Boolean); });
    const base = packs['Cơ bản'] || [];
    Object.keys(packs).forEach(k => { packs[k] = [...new Set(packs[k].flatMap(s => N(s) === 'co ban' && k !== 'Cơ bản' ? base : [s]))]; });
    if (Object.keys(packs).length) out.packs = packs;
  }
  return out;
}
function parseWB(wb, fileName) {
  const T = aoaOf(wb, 'WORK REQUEST') || XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: false, defval: '' });
  const hi = T.findIndex(r => (r || []).some(c => clean(c).startsWith('ten cong viec')));
  if (hi < 0) throw new Error('Không tìm thấy dòng tiêu đề có cột "Tên công việc".');
  const col = {};
  T[hi].forEach((c, i) => { const h = clean(c); for (const [k, f] of HDR) if (col[k] === undefined && f(h)) { col[k] = i; break; } });
  /* thông tin đầu file (nếu có): Tên kế hoạch / Bắt đầu Shutdown */
  const meta = {};
  T.slice(0, hi).forEach(r => (r || []).forEach((c, i) => {
    const h = N(c), next = () => (r.slice(i + 1).find(v => String(v).trim()) || '').toString().trim();
    if (h.startsWith('ten ke hoach')) meta.name = next();
    if (h.startsWith('bat dau shutdown')) meta.start = next();
  }));
  const rows = [];
  for (let r = hi + 1; r < T.length; r++) {
    const R = T[r] || [], g = k => col[k] === undefined ? '' : String(R[col[k]] ?? '').trim();
    const name = g('name'); if (!name) continue;
    const kn = N(g('kind'));
    rows.push({
      line: r + 1, branch: g('branch'), process: g('process'), equip: g('equip'), name, desc: g('desc'),
      kind: kn.startsWith('bo sung') ? 'extra' : kn.startsWith('bat buoc') ? 'mandatory' : '',
      dur: U.num(String(g('dur')).replace(',', '.'), 0), people: Math.round(U.num(g('people'), 0)),
      photos: { check: g('phCheck'), ptw: g('phPtw'), done: g('phDone') },
      safety: { need: g('need'), mode: g('mode'), wiLoto: g('wiLoto'), lotoPts: g('lotoPts'), ptw: g('ptw'), risk: g('risk'), ppe: g('ppe') },
    });
  }
  const missingCols = [['name', 'Tên công việc'], ['process', 'Process'], ['dur', 'Thời lượng'], ['need', 'Cần yêu cầu an toàn?'], ['phDone', 'Ảnh hoàn thành task']]
    .filter(([k]) => col[k] === undefined).map(x => x[1]);
  return { fileName, rows, meta, lists: parseLists(aoaOf(wb, 'LISTS')), missingCols };
}
function metaStart(s) {
  const m = /^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})(?:\s+(\d{1,2}):(\d{2}))?/.exec(String(s || '').trim());
  if (!m) return '';
  const p = n => String(n).padStart(2, '0');
  return `${m[3]}-${p(m[2])}-${p(m[1])}T${p(m[4] || 6)}:${p(m[5] || 0)}`;
}

/* =====================================================================
   2. KIỂM TRA + TỰ SINH YÊU CẦU ẢNH
   ===================================================================== */
function issuesOf(row) {
  const e = [], w = [], s = row.safety || {}, ph = row.photos || {};
  if (!row.branch) e.push('Thiếu Nhánh');
  if (!row.process) e.push('Thiếu Process');
  if (!row.kind) e.push('Thiếu Loại công việc');
  if (!(row.dur > 0)) e.push('Thiếu Thời lượng');
  if (!(row.people >= 1)) e.push('Thiếu Số người');
  if (!(+ph.done >= 1)) e.push('Thiếu số Ảnh hoàn thành task');
  if (!s.need) e.push('Chưa chọn "Cần yêu cầu an toàn?"');
  else if (YES(s.need)) {
    [['mode', 'Mode can thiệp'], ['ptw', 'Giấy phép làm việc'], ['risk', 'Phiếu tiên đoán rủi ro'], ['ppe', 'Bộ PPE']].forEach(([k, l]) => { if (!s[k] || s[k] === '—') e.push('Thiếu ' + l); });
    const m = N(s.mode);
    if (m === 'mode 4' && N(s.ptw) !== 'mode 4') e.push('Mode 4 bắt buộc có giấy phép "Mode 4"');
    if ((m === 'mode 3' || m === 'mode 4') && !lotoOn(s)) w.push(`${s.mode} thường phải LOTO – chưa có WI LOTO / điểm khóa`);
    if (s.wiLoto && !String(s.lotoPts || '').trim()) w.push('Có WI LOTO nhưng chưa ghi điểm khóa – operator chụp 1 ảnh LOTO chung');
    if (lotoOn(s) && !row.equip) w.push('Có LOTO nên ghi Thiết bị / Khu vực');
    if (ptwOf(s) && !YES(ph.ptw)) w.push('Có giấy phép – hệ thống tự thêm ảnh giấy phép');
  }

}
function evidenceFor(row) {
  const s = row.safety || {}, ph = row.photos || {}, pre = [], end = [], used = new Set();
  const add = (arr, id, label, min = 1) => { if (used.has(id)) return; used.add(id); arr.push({ id, label, min }); };
  const safe = YES(s.need), ptw = ptwOf(s);
  if (safe && lotoOn(s)) {
    const pts = parsePts(s.lotoPts);
    if (pts.length) pts.forEach(p => add(pre, 'pre:loto' + p.stt, `🟡 Chuẩn bị · LOTO điểm ${p.stt}: ${[p.energy, p.point].filter(Boolean).join(' – ')}`));
    else add(pre, 'pre:loto', '🟡 Chuẩn bị · Ảnh khóa + thẻ LOTO theo ' + (s.wiLoto || 'WI LOTO'));
    add(pre, 'pre:zero', '🟡 Chuẩn bị · Kiểm tra zero energy (thử khởi động / đồng hồ = 0)');
  }
  if (YES(ph.ptw) || ptw) add(pre, 'pre:ptw', `🟡 Chuẩn bị · Ảnh giấy phép làm việc${ptw ? ' "' + ptw + '"' : ''} đã ký duyệt`);
  if (safe && YES(s.risk)) add(pre, 'pre:risk', '🟡 Chuẩn bị · Ảnh phiếu tiên đoán rủi ro');
  if (YES(ph.check)) add(end, 'end:check', '🟢 Kết thúc · Ảnh checklist đã điền');
  const n = Math.min(5, Math.max(1, Math.round(+ph.done || 1)));
  for (let i = 1; i <= n; i++) add(end, 'end:done' + i, `🟢 Kết thúc · Ảnh hoàn thành task ${i}`);
  if (safe && lotoOn(s)) add(end, 'end:loto', '🟢 Kết thúc · Tháo LOTO, che chắn đã lắp lại');
  if (ptw) add(end, 'end:ptw', `🟢 Kết thúc · Giấy phép "${ptw}" đã ký đóng`);
  return [...pre, ...end];
}
function ppeItems(s, lists) {
  if (!s || !YES(s.need) || !s.ppe || isNo(s.ppe)) return [];
  const packs = (lists && lists.packs) || DEF.packs;
  return (packs[s.ppe] || [s.ppe]).map(x => x.charAt(0).toUpperCase() + x.slice(1));
}
function wrOf(row, lists, old) {
  return { kind: row.kind, equip: row.equip, desc: row.desc, line: row.line, photos: { ...(row.photos || {}) }, safety: { ...(row.safety || {}) },
    points: parsePts((row.safety || {}).lotoPts), ppeItems: ppeItems(row.safety, lists), issues: issuesOf(row),
    seqSet: old ? old.seqSet : false, prio: old ? old.prio : null };
}
const rowOf = t => ({ branch: t.branch, process: t.process, equip: t.wr.equip, name: t.taskName, desc: t.wr.desc, kind: t.wr.kind,
  dur: t.durationHours, people: t.peopleRequired, photos: t.wr.photos || {}, safety: t.wr.safety || {}, line: t.wr.line });
function flags(t) {
  const w = t.wr; if (!w) return [];
  const out = [];
  (w.issues && w.issues.e || []).forEach(m => out.push({ lvl: 'e', msg: m, short: 'Thiếu thông tin' }));
  if (!w.seqSet) out.push({ lvl: 'w', msg: 'Chưa sắp thứ tự thực hiện', short: 'Chưa sắp thứ tự' });
  if (w.kind === 'extra' && w.prio == null) out.push({ lvl: 'w', msg: 'Việc bổ sung chưa xếp ưu tiên', short: 'Chưa xếp ưu tiên' });
  (w.issues && w.issues.w || []).forEach(m => out.push({ lvl: 'i', msg: m, short: 'Lưu ý' }));
  return out;
}
function planStats(p) {
  const s = { e: 0, seq: 0, prio: 0, info: 0, tasks: 0 };
  for (const t of p.tasks) {
    if (!t.wr) continue; s.tasks++;
    if ((t.wr.issues && t.wr.issues.e || []).length) s.e++;
    if (!t.wr.seqSet) s.seq++;
    if (t.wr.kind === 'extra' && t.wr.prio == null) s.prio++;
    if ((t.wr.issues && t.wr.issues.w || []).length) s.info++;
  }
  return s;
}

/* =====================================================================
   3. GIỮ DỮ LIỆU KHI LƯU / ĐỒNG BỘ + HIGHLIGHT GANTT
   ===================================================================== */
const _nt = normalizeTask;
normalizeTask = function (t) {
  const x = _nt(t);
  if (t) for (const k of ['wr', 'wrChecks', 'startedAt', 'startedBy']) if (t[k] !== undefined && x[k] === undefined) x[k] = t[k];
  if (WR.pendingSeq && x.id === WR.pendingSeq && x.wr) x.wr = { ...x.wr, seqSet: true };
  return x;
};
if (typeof Store.sanitize === 'function') {
  const _san = Store.sanitize.bind(Store);
  Store.sanitize = function (s) {
    const out = _san(s);
    try { (s && s.plans || []).forEach(src => { const d = out.plans.find(x => x.id === src.id); if (d) { if (src.wr && !d.wr) d.wr = src.wr; if (src.uploadUrl && !d.uploadUrl) d.uploadUrl = src.uploadUrl; } }); } catch (e) { }
    return out;
  };
}
const _dSave = Drawer.save;
Drawer.save = function (...a) { WR.pendingSeq = App.drawerTaskId; try { return _dSave.apply(this, a); } finally { WR.pendingSeq = null; } };
const _tr = Gantt.taskRow;
Gantt.taskRow = function (t, g, p) {
  let h = _tr.call(this, t, g, p);
  const f = flags(t).filter(x => x.lvl !== 'i'); if (!f.length) return h;
  const lvl = f.some(x => x.lvl === 'e') ? 'wr-err' : 'wr-miss';
  const chip = `<span class="wr-chip ${lvl}" title="${esc(f.map(x => x.msg).join(' · '))}">⚠ ${esc(f[0].short)}${f.length > 1 ? ' +' + (f.length - 1) : ''}</span>`;
  return h.replace('class="grow ', `class="grow ${lvl} `).replace(/(<span class="c-name"[^>]*>)/, '$1' + chip);

/* =====================================================================
   4. THAO TÁC KẾ HOẠCH
   ===================================================================== */
function commitTask(planId, taskId, label, fn) {
  Store.commit(label, () => { const p = findP(planId), t = p && p.tasks.find(x => x.id === taskId); if (!t) return false; fn(t, p); });
}
function needLogin() { if (window.Auth && !Auth.ok) { const b = $('#auBadge'); if (b) b.click(); else toast('Cần đăng nhập để thao tác.', 'warn'); return true; } return false; }

function createPlan() {
  const d = WR.data; if (!d || !d.rows.length) return;
  if (needLogin()) return;
  const name = WR.form.name.trim() || d.meta.name || d.fileName.replace(/\.\w+$/, '');
  const start = WR.form.start; if (!start) { toast('Chọn giờ bắt đầu Shutdown.', 'warn'); return; }
  let newId = null;
  Store.commit('Tạo kế hoạch từ Work Request', () => {
    const plan = makePlan({ name, start: start.slice(0, 16), targetHours: U.num(WR.form.target, 48) || 48 });
    plan.wr = { status: 'draft', fileName: d.fileName, importedAt: Date.now(), lists: d.lists };
    const tmp = { tasks: [] }; let order = 0;
    for (const r of d.rows) {
      const ev = evidenceFor(r), hrs = r.dur > 0 ? r.dur : 1;
      const t = normalizeTask({ id: nextTaskId(tmp), order: ++order, branch: r.branch || 'Chung', process: r.process || 'Chung', taskName: r.name,
        durationHours: hrs, standardHours: hrs, quantity: 1, peopleRequired: Math.max(1, r.people || 1),
        assignee: '', owner: '', executionMode: 'sequential', lagHours: 0, notes: r.desc, method: '', progress: 0, evidence: ev });
      t.wr = wrOf(r, d.lists); t.evidence = ev;
      if (t.wr.ppeItems.length && 'ppe' in t) t.ppe = t.wr.ppeItems.slice();
      tmp.tasks.push(t);
    }
    plan.tasks = tmp.tasks;
    Store.state.plans.push(plan); Store.state.activePlanId = plan.id; newId = plan.id;
    try { const res = Scheduler.schedule(plan); if (plan.targetHours < res.kpi.windowHours) plan.targetHours = Math.ceil(res.kpi.windowHours); } catch (e) { }
  });
  if (!newId || !findP(newId)) return;
  WR.planId = newId; WR.data = null; WR.prioDraft = null; WR.form = { name: '', start: '', target: 48 };
  toast(`Đã tạo kế hoạch nháp "${name}" – sắp thứ tự & xếp ưu tiên bên dưới.`, 'ok');
  WR.render();
  if (typeof LDC !== 'undefined' && LDC.data) setTimeout(() => LDC.review(newId), 300);
}
function applySeq(planId, taskId, v) {
  commitTask(planId, taskId, 'Sắp thứ tự task', t => {
    if (v === 'start') { t.executionMode = 'parallel'; t.dependencyIds = []; }
    else if (v.startsWith('after:')) { t.executionMode = 'after_dependency'; t.dependencyIds = [v.slice(6)]; }
    else { t.executionMode = 'sequential'; t.dependencyIds = []; }
    t.wr = { ...t.wr, seqSet: true };
  });
