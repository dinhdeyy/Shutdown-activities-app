    $('#btnFilter').onclick = () => { ui().filtersOpen = !ui().filtersOpen; Store.save(); if (this.view !== 'gantt') this.switchView('gantt'); else $('#filterBar').classList.toggle('hidden', !ui().filtersOpen); };
    $('#tabGantt').onclick = () => this.switchView('gantt');
    $('#tabDash').onclick = () => this.switchView('dash');
    const dd = (btn, menu) => { $(btn).onclick = e => { e.stopPropagation(); $$('.dd-menu').forEach(m => m !== $(menu) && m.classList.add('hidden')); $(menu).classList.toggle('hidden'); }; };
    dd('#btnExport', '#menuExport'); dd('#btnMore', '#menuMore');
    document.addEventListener('click', () => $$('.dd-menu').forEach(m => m.classList.add('hidden')));
    $$('#menuExport [data-exp]').forEach(b => b.onclick = () => IO.export(b.dataset.exp));
    $$('#menuMore [data-more]').forEach(b => b.onclick = () => Panels.more(b.dataset.more));
    $('#planName').onchange = e => { const v = e.target.value.trim() || 'Kế hoạch Shutdown'; Store.commit('Đổi tên kế hoạch', p => { p.name = v; }); };
    $('#planStart').onchange = e => this.changePlanStart(e.target.value);
    $('#btnDayMinus').onclick = () => this.shiftPlanDays(-1);
    $('#btnDayPlus').onclick = () => this.shiftPlanDays(1);
    $('#planTarget').onchange = e => { const v = U.num(e.target.value, 0); if (v <= 0) { toast('Mục tiêu phải > 0', 'err'); this.renderPlanBar(); return; } Store.commit('Đổi mục tiêu', p => { p.targetHours = v; }); };
    let qT; $('#fSearch').oninput = e => { clearTimeout(qT); qT = setTimeout(() => { this.filters.q = e.target.value; this.renderMain(); }, 150); };
    const fmap = { '#fBranch': 'branch', '#fProcess': 'process', '#fOwner': 'owner', '#fStatus': 'status', '#fShift': 'shift', '#fFrom': 'from', '#fTo': 'to' };
    for (const [s, k] of Object.entries(fmap)) $(s).onchange = e => { this.filters[k] = e.target.value; this.renderMain(); };
    $('#fCrit').onchange = e => { this.filters.crit = e.target.checked; this.renderMain(); };
    $('#fWarn').onchange = e => { this.filters.warn = e.target.checked; this.renderMain(); };
    $('#btnClearFilter').onclick = () => { this.clearFilters(); this.renderMain(); };
    document.addEventListener('keydown', e => {
      const inField = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName);
      const k = e.key.toLowerCase();
      if ((e.ctrlKey || e.metaKey) && k === 'z' && !e.shiftKey && !inField) { e.preventDefault(); Store.doUndo(); }
      else if ((e.ctrlKey || e.metaKey) && (k === 'y' || (k === 'z' && e.shiftKey)) && !inField) { e.preventDefault(); Store.doRedo(); }
      else if (e.key === 'Escape') { if ($('#modalRoot').innerHTML) closeModal(); else Drawer.close(); }
      else if (!inField && k === 'n' && !e.ctrlKey && !e.metaKey && this.view === 'gantt') { e.preventDefault(); Drawer.openNew(); }
      else if (!inField && e.key === 'Delete' && this.selectedId && this.view === 'gantt') Actions.deleteTask(this.selectedId);
    });
    Gantt.bind();
  },

  /** ĐỔI NGÀY: chỉ đổi plan.start. Mốc task lưu tương đối → cả lịch dịch theo, thời lượng giữ nguyên */
  changePlanStart(iso) {
    if (!isFinite(U.parseLocalISO(iso))) { toast('Ngày giờ không hợp lệ', 'err'); this.renderPlanBar(); return; }
    const old = Store.plan().start; if (iso === old) return;
    Store.commit('Đổi ngày bắt đầu', p => { p.start = iso; });
    toast(`Đã dời kế hoạch sang ${U.fmtDT(U.parseLocalISO(iso))}. Thời lượng các task giữ nguyên.`, 'ok');
    this.scrollToStart();
  },
  shiftPlanDays(n) { const d = new Date(U.parseLocalISO(Store.plan().start)); d.setDate(d.getDate() + n); this.changePlanStart(U.toLocalISO(d.getTime())); },
};

/* =====================================================================
   8. ACTIONS – THAO TÁC TASK
   ===================================================================== */
const Actions = {
  async deleteTask(id) {
    const p = Store.plan(), t = p.tasks.find(x => x.id === id); if (!t) return;
    const deps = p.tasks.filter(x => x.dependencyIds.includes(id));
    if (!(await confirmBox('Xóa task', `Xóa task <b>${U.esc(t.taskName)}</b>?${deps.length ? `<br><br>${deps.length} task đang chạy sau task này sẽ được gỡ liên kết.` : ''}`, 'Xóa', true))) return;
    Store.commit('Xóa task ' + t.taskName, p => { p.tasks = p.tasks.filter(x => x.id !== id); p.tasks.forEach(x => x.dependencyIds = x.dependencyIds.filter(d => d !== id)); });
    if (App.drawerTaskId === id) Drawer.close();
    if (App.selectedId === id) App.selectedId = null;
    toast('Đã xóa task (Ctrl+Z để hoàn tác)');
  },
  duplicateTask(id) {
    const p = Store.plan(), t = p.tasks.find(x => x.id === id); if (!t) return;
    const nid = nextTaskId(p);
    Store.commit('Sao chép task', p => { p.tasks.push(normalizeTask({ ...U.clone(t), id: nid, taskName: t.taskName + ' (bản sao)', order: t.order + 0.5, progress: 0, locked: false })); Actions.renumber(p); });
    App.selectTask(nid, true);
  },
  moveTask(id, dir) {
    const p = Store.plan(), t = p.tasks.find(x => x.id === id); if (!t) return;
    const same = p.tasks.filter(x => x.process === t.process && x.branch === t.branch).sort((a, b) => a.order - b.order);
    const o = same[same.indexOf(t) + dir]; if (!o) return;
    const test = { ...p, tasks: p.tasks.map(x => x.id === t.id ? { ...x, order: o.order } : x.id === o.id ? { ...x, order: t.order } : x) };
    if (Scheduler.topo(test.tasks, Scheduler.buildGraph(test)).inCycle.length) { toast('Không đổi được thứ tự: sẽ tạo phụ thuộc vòng tròn.', 'err'); return; }
    Store.commit('Đổi thứ tự task', p => { const a = p.tasks.find(x => x.id === t.id), b = p.tasks.find(x => x.id === o.id); [a.order, b.order] = [b.order, a.order]; });
  },
  renumber(p, byStart = false) {
    const list = p.tasks.slice();
    if (byStart) { const r = Scheduler.schedule(p).R; list.sort((a, b) => r.get(a.id).start - r.get(b.id).start || a.order - b.order); }
    else list.sort((a, b) => a.order - b.order);
    list.forEach((t, i) => t.order = i + 1);
  },
};

/* =====================================================================
   9. GANTT
   ===================================================================== */
const Gantt = {
  rows: [],
  computeGeo() {
    const res = App.res, z = Store.ui().zoom || 2, colW = ZOOM_COLW[z], pxH = colW / z;
    const a = Math.min(res.windowStart, res.P), b = Math.max(res.windowEnd, res.targetEnd || res.windowEnd, res.P + MS_H);
    const da = new Date(a); let rs;
    if (z >= 24) rs = new Date(da.getFullYear(), da.getMonth(), da.getDate()).getTime();
    else { const h = da.getHours(); rs = new Date(da.getFullYear(), da.getMonth(), da.getDate(), h >= 22 ? 22 : h >= 14 ? 14 : h >= 6 ? 6 : -2).getTime(); }
    const colMs = z * MS_H, ncol = Math.ceil(Math.max(b - rs, MS_H) / colMs) + (z >= 24 ? 1 : Math.max(2, Math.ceil(8 / z)));
    const left = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--left-w')) || 500;
    return { z, colW, pxH, rs, re: rs + ncol * colMs, W: ncol * colW, ncol, colMs, left, x: t => (t - rs) / MS_H * pxH, t: x => rs + x / pxH * MS_H };
  },
  /** Dòng: Nhánh → Process → Task (lọc + thu gọn) */
  buildRows() {
    const p = Store.plan(), ui = Store.ui();
    const vis = p.tasks.filter(t => App.passFilter(t)), branches = new Map();
    for (const t of p.tasks.slice().sort((a, b) => a.order - b.order)) { if (!branches.has(t.branch)) branches.set(t.branch, new Map()); const bm = branches.get(t.branch); if (!bm.has(t.process)) bm.set(t.process, []); }
    for (const t of vis) branches.get(t.branch).get(t.process).push(t);
    const rows = [];
    for (const [b, procs] of branches) {
      const all = [...procs.values()].flat(); if (!all.length) continue;
      const bKey = 'B|' + b; rows.push({ type: 'branch', key: bKey, branch: b, tasks: all });
      if (ui.collapsed[bKey]) continue;
      for (const [pr, list] of procs) {
        if (!list.length) continue;
        const pKey = 'P|' + b + '|' + pr; rows.push({ type: 'proc', key: pKey, branch: b, process: pr, tasks: list });
        if (ui.collapsed[pKey]) continue;
        for (const t of list.slice().sort((a, c) => a.order - c.order)) rows.push({ type: 'task', key: t.id, task: t });
      }
    }
    this.rows = rows; return { rows, visCount: vis.length, total: p.tasks.length };
  },
  render() {
    const p = Store.plan(), res = App.res, g = App.geo = this.computeGeo(), ui = Store.ui();
    const { rows, visCount, total } = this.buildRows();
    $('#filterCount').textContent = `Hiển thị ${visCount}/${total} task`;
    $('#legend').innerHTML = Object.values(STATUS).map(s => `<span><span class="dot" style="background:${s.color}"></span>${s.label}</span>`).join('') +
      '<span>Viền đỏ = Critical task</span><span>Viền cam = có cảnh báo</span><span>Kéo thanh để dời giờ · kéo mép phải để đổi thời lượng · bấm vào task để sửa</span>';
    const H = Math.max(rows.length * ROW_H, 200), parts = [];
    // Header: ngày / ca / giờ
    const hd = [], hs = [], ht = [];
    for (let d0 = new Date(new Date(g.rs).setHours(0, 0, 0, 0)).getTime(); d0 < g.re;) {
      const d1 = new Date(d0); d1.setDate(d1.getDate() + 1); const a = Math.max(d0, g.rs), b = Math.min(d1.getTime(), g.re);
      if (b > a) hd.push(`<div class="hcell hdate" style="left:${g.x(a)}px;width:${g.x(b) - g.x(a)}px">${U.fmtDate(d0)}</div>`);
      d0 = d1.getTime();
    }
    for (let t = g.rs; t < g.re;) { const nb = Math.min(U.nextShiftBoundary(t), g.re), s = U.shiftOf(t), w = g.x(nb) - g.x(t); hs.push(`<div class="hcell hshift s${s}" style="left:${g.x(t)}px;width:${w}px" title="Ca ${s}: ${['06:00–14:00', '14:00–22:00', '22:00–06:00'][s - 1]}">${w > 34 ? 'Ca ' + s : s}</div>`); t = nb; }
    for (let i = 0; i < g.ncol; i++) { const t = g.rs + i * g.colMs; ht.push(`<div class="hcell htime" style="left:${i * g.colW}px;width:${g.colW}px">${g.z >= 24 ? U.fmtDate(t).slice(3, 8) : U.fmtHM(t)}</div>`); }
    parts.push(`<div class="ghead" style="width:${g.left + g.W}px;height:${HEAD_H}px">
      <div class="ghead-left" style="height:${HEAD_H}px"><span style="flex:1">Task</span><span class="c-who">Người thực hiện</span><span class="c-dur">Giờ</span><span class="c-start">Bắt đầu</span></div>
      <div class="ghead-right" style="width:${g.W}px;height:${HEAD_H}px"><div class="hrow" style="top:0;height:22px">${hd.join('')}</div><div class="hrow" style="top:22px;height:22px">${hs.join('')}</div><div class="hrow" style="top:44px;height:22px">${ht.join('')}</div></div></div>`);
    // Nền
    const bg = [];
    for (let t = g.rs; t < g.re;) { const nb = Math.min(U.nextShiftBoundary(t), g.re); bg.push(`<div class="band s${U.shiftOf(t)}" style="left:${g.x(t)}px;width:${g.x(nb) - g.x(t)}px"></div>`); t = nb; }
    for (let i = 0; i <= g.ncol; i++) { const d = new Date(g.rs + i * g.colMs); bg.push(`<div class="vline${d.getHours() === 0 && d.getMinutes() === 0 ? ' day' : ''}" style="left:${i * g.colW}px"></div>`); }
    bg.push(`<div class="winline" style="left:${g.x(res.P)}px" title="Bắt đầu Shutdown ${U.fmtDT(res.P)}"></div>`);
    if (p.targetHours > 0) bg.push(`<div class="winline target" style="left:${g.x(res.targetEnd)}px" title="Mục tiêu kết thúc ${U.fmtDT(res.targetEnd)}"></div>`);
    const now = Date.now(); if (now >= g.rs && now <= g.re) bg.push(`<div class="nowline" style="left:${g.x(now)}px" title="Hiện tại ${U.fmtDT(now)}"></div>`);
    // Dòng
    const rowHtml = [], yOf = new Map();
    rows.forEach((r, i) => {
      if (r.type === 'task') { yOf.set(r.task.id, i * ROW_H + ROW_H / 2); rowHtml.push(this.taskRow(r.task, g, p)); return; }
      const col = r.type === 'proc' ? processColor(p, r.process) : '#334155';
      let s = Infinity, e = -Infinity; for (const t of r.tasks) { const x = res.R.get(t.id); s = Math.min(s, x.start); e = Math.max(e, x.end); }
      const collapsed = !!ui.collapsed[r.key];
      const name = r.type === 'branch' ? r.branch : r.process;
      rowHtml.push(`<div class="grow g-${r.type}">
        <div class="gleft" data-toggle="${U.esc(r.key)}" style="padding-left:${r.type === 'proc' ? 22 : 10}px;${r.type === 'proc' ? `box-shadow:inset 4px 0 0 ${col}` : ''}">
          <span class="tw">${collapsed ? '▶' : '▼'}</span><span class="c-name">${U.esc(name)} <span class="c-sub">· ${r.tasks.length} task</span></span>
          <span class="c-dur">${U.fmtDur((e - s) / MS_H, true)}</span><span class="c-start">${U.fmtDM(s)}</span></div>
        <div class="gright"><div class="bar sum" style="left:${g.x(s)}px;width:${Math.max(2, g.x(e) - g.x(s))}px;background:${col}"></div></div></div>`);
    });
    // Mũi tên phụ thuộc
    const paths = [];
    for (const t of p.tasks) {
      if (!yOf.has(t.id)) continue;
      for (const d of t.dependencyIds) {
        if (!yOf.has(d)) continue;
        const a = res.R.get(d), b = res.R.get(t.id), x1 = g.x(a.end), y1 = yOf.get(d), x2 = g.x(b.start), y2 = yOf.get(t.id);
        const crit = res.critEdges.has(d + '>' + t.id), hl = App.selectedId && (App.selectedId === d || App.selectedId === t.id);
        const path = x2 - x1 >= 14 ? `M${x1},${y1} H${x1 + 7} V${y2} H${x2 - 1}` : `M${x1},${y1} h7 V${y2 > y1 ? y2 - ROW_H / 2 : y2 + ROW_H / 2} H${x2 - 9} V${y2} H${x2 - 1}`;
        paths.push(`<path d="${path}" class="${crit ? 'crit' : ''} ${hl ? 'hl' : ''}" marker-end="url(#${crit ? 'arC' : hl ? 'arH' : 'arN'})"/>`);
      }
    }
    const empty = !rows.length ? `<div class="empty-state" style="position:absolute;left:${g.left}px;top:40px;width:600px">${p.tasks.length ? 'Không có task nào khớp bộ lọc.' : 'Kế hoạch chưa có task. Bấm <b>+ Thêm task</b> hoặc <b>Import Excel</b>.'}</div>` : '';
    const mk = (id, c) => `<marker id="${id}" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="${c}"/></marker>`;
    parts.push(`<div class="gbody" style="width:${g.left + g.W}px;height:${H}px">
      <div class="gbg" style="left:${g.left}px;width:${g.W}px;height:${H}px">${bg.join('')}</div>${rowHtml.join('')}
      <svg id="depsvg" style="left:${g.left}px" width="${g.W}" height="${H}"><defs>${mk('arN', '#94a3b8')}${mk('arC', '#991b1b')}${mk('arH', '#2563eb')}</defs>${paths.join('')}</svg>${empty}</div>`);
    const c = $('#gcanvas'); c.style.width = (g.left + g.W) + 'px'; c.innerHTML = parts.join('');
  },
  /** 1 dòng task: trạng thái · STT · tên · người thực hiện · giờ · bắt đầu */
  taskRow(t, g, p) {
    const r = App.res.R.get(t.id), st = STATUS[r.status], fill = processColor(p, t.process);
    const x = g.x(r.start), w = Math.max(3, g.x(r.end) - x);
    const who = t.assignee || '';
    const bar = t.durationHours > 0 ? `<div class="bar ${r.critical ? 'crit' : ''} ${r.warn && !r.critical ? 'warn' : ''} ${t.locked ? 'locked' : ''}" data-id="${U.esc(t.id)}" style="left:${x}px;width:${w}px;background:${fill}">
        <div class="prog" style="width:${t.progress}%"></div><span class="lbl">${w > 70 ? U.esc(t.taskName) : ''}</span>${t.locked ? '' : '<div class="handle"></div>'}</div>` : '';
    const msX = t.durationHours > 0 ? g.x(r.end) : x;
    const ms = t.milestone ? `<div class="ms" data-id="${U.esc(t.id)}" style="left:${msX - 6}px"></div>` : '';
    const outTxt = [w > 70 ? '' : t.taskName, who || t.owner].filter(Boolean).join(' · ');
    return `<div class="grow ${App.selectedId === t.id ? 'sel' : ''}" data-id="${U.esc(t.id)}">
      <div class="gleft" data-open="${U.esc(t.id)}" style="padding-left:36px" title="${U.esc(t.taskName)}">
        <span class="stdot" style="background:${st.color}" title="${st.label}"></span><span class="c-stt">${t.order}</span>
        <span class="c-name" style="${r.warn ? 'color:#b45309' : ''}">${U.esc(t.taskName)}</span>
        <span class="c-who ${who ? '' : 'empty'}">${who ? U.esc(who) : 'Chưa phân công'}</span>
        <span class="c-dur">${U.fmtDur(t.durationHours, true)}</span><span class="c-start">${U.fmtDM(r.start)}</span></div>
      <div class="gright">${bar}${ms}<div class="outlbl" style="left:${(t.milestone ? msX + 10 : x + w) + 6}px">${U.esc(outTxt)}</div></div></div>`;
  },
  bind() {
    const c = $('#gcanvas');
    c.addEventListener('click', e => {
      if (Drag.justDragged) { Drag.justDragged = false; return; }
      const tg = e.target.closest('[data-toggle]');
      if (tg) { const k = tg.dataset.toggle, ui = Store.ui(); if (ui.collapsed[k]) delete ui.collapsed[k]; else ui.collapsed[k] = true; Store.save(); Gantt.render(); return; }
      const op = e.target.closest('[data-open]') || e.target.closest('.ms[data-id]');
      if (op) { App.selectedId = op.dataset.open || op.dataset.id; Gantt.render(); Drawer.open(App.selectedId); }
    });
    c.addEventListener('pointerdown', e => Drag.start(e));
    c.addEventListener('mousemove', e => { if (Drag.active) return; const b = e.target.closest('.bar[data-id], .ms[data-id]'); if (b) Tip.show(b.dataset.id, e); else Tip.hide(); });
    c.addEventListener('mouseleave', () => Tip.hide());
  },
};

/* ---------- Kéo thả ---------- */
const Drag = {
  active: null, justDragged: false,
  start(e) {
    const bar = e.target.closest('.bar[data-id]'); if (!bar || e.button !== 0) return;
    const id = bar.dataset.id, t = Store.plan().tasks.find(x => x.id === id), r = App.res.R.get(id);
    if (t.locked) { toast('Task đang khóa – mở khóa trong phần Thiết lập nâng cao.', 'warn'); return; }
    this.active = { id, t, r, mode: e.target.classList.contains('handle') ? 'resize' : 'move', x0: e.clientX, left0: parseFloat(bar.style.left), bar, moved: false, dh: 0 };
    try { bar.setPointerCapture(e.pointerId); } catch (err) { }
    bar.onpointermove = ev => this.move(ev); bar.onpointerup = () => this.end(); bar.onpointercancel = () => this.cancel();
    Tip.hide(); e.preventDefault();
  },
  move(e) {
    const d = this.active; if (!d) return;
    const dx = e.clientX - d.x0; if (Math.abs(dx) > 3) d.moved = true; if (!d.moved) return;
    const g = App.geo, snap = SNAP[g.z];
    d.dh = Math.round(dx / g.pxH / snap) * snap; d.bar.classList.add('dragging');
    if (d.mode === 'move') {
      d.bar.style.left = (d.left0 + d.dh * g.pxH) + 'px';
      const s = d.r.start + d.dh * MS_H; Tip.text(`<b>${U.esc(d.t.taskName)}</b><br>${U.fmtDT(s)} → ${U.fmtDT(s + d.t.durationHours * MS_H)}<br>Thời lượng giữ nguyên: ${U.fmtDur(d.t.durationHours)}`, e);
    } else {
      d.newDur = Math.max(snap, d.t.durationHours + d.dh);
      d.bar.style.width = Math.max(3, d.newDur * g.pxH) + 'px';
      Tip.text(`<b>${U.esc(d.t.taskName)}</b><br>Thời lượng mới: ${U.fmtDur(d.newDur)}<br>Kết thúc: ${U.fmtDT(d.r.start + d.newDur * MS_H)}`, e);
    }
  },
  end() {
    const d = this.active; this.active = null; Tip.hide(); if (!d) return;
    d.bar.onpointermove = d.bar.onpointerup = d.bar.onpointercancel = null;
    this.justDragged = true; setTimeout(() => this.justDragged = false, 0);
    if (!d.moved) { App.selectedId = d.id; Gantt.render(); Drawer.open(d.id); return; }
    if (d.dh === 0 && d.mode === 'move') { Gantt.render(); return; }
    const P = App.res.P;
    if (d.mode === 'move') {
      const want = d.r.start + d.dh * MS_H;
      Store.commit('Kéo task ' + d.t.taskName, p => {
        const t = p.tasks.find(x => x.id === d.id);
        if (t.executionMode === 'fixed') t.constraintOffsetHours = (want - P) / MS_H;
        else if (want <= d.r.required) { t.constraintType = 'ASAP'; t.constraintOffsetHours = null; }
        else { t.constraintType = 'SNET'; t.constraintOffsetHours = (want - P) / MS_H; }
      });
      const nr = App.res.R.get(d.id);
      if (nr.start > want + MS_MIN) toast(`Không thể bắt đầu trước ${U.fmtDT(nr.start)} vì phải chờ task trước.`, 'warn');
      else toast(`Đã dời "${d.t.taskName}" → ${U.fmtDT(nr.start)}. Các task sau được cập nhật.`, 'ok');
    } else {
      if (!(d.newDur > 0)) { Gantt.render(); return; }
      Store.commit('Đổi thời lượng ' + d.t.taskName, p => { p.tasks.find(x => x.id === d.id).durationHours = d.newDur; });
      toast(`Thời lượng "${d.t.taskName}" = ${U.fmtDur(d.newDur)}`, 'ok');
    }
  },
  cancel() { this.active = null; Tip.hide(); Gantt.render(); },
};

/* ---------- Tooltip ---------- */
const Tip = {
  show(id, e) {
    const p = Store.plan(), t = p.tasks.find(x => x.id === id); if (!t) return;
    const r = App.res.R.get(id), byId = new Map(p.tasks.map(x => [x.id, x]));
    const crossMidnight = new Date(r.start).toDateString() !== new Date(r.end).toDateString();
    const rows = [
      ['Process', `${U.esc(t.process)} · ${U.esc(t.branch)}`],
      ['Thời gian', `${U.fmtDM(r.start)} → ${U.fmtDM(r.end)}${crossMidnight ? ' (qua đêm)' : ''}`],
      ['Thời lượng', U.fmtDur(t.durationHours)],
      ['Người thực hiện', U.esc(t.assignee || 'Chưa phân công')],
      ['Đội phụ trách', U.esc(t.owner || '–')],
    ];
    if (t.dependencyIds.length) rows.push(['Chạy sau', t.dependencyIds.map(d => U.esc(byId.get(d)?.taskName || d)).join(', ')]);
    rows.push(['Trạng thái', STATUS[r.status].label + (t.progress ? ` · ${t.progress}%` : '') + (r.critical ? ' · <b style="color:#fca5a5">Critical task</b>' : '')]);
    if (t.notes) rows.push(['Ghi chú', U.esc(t.notes)]);
    const warn = r.issues.filter(i => i.level !== 'info').map(i => U.esc(i.msg)).join('<br>');
    this.text(`<b style="font-size:13px">${U.esc(t.taskName)}</b><table>${rows.map(([a, b]) => `<tr><td>${a}</td><td>${b}</td></tr>`).join('')}</table>${warn ? `<div style="margin-top:6px;color:#fbbf24">${warn}</div>` : ''}`, e);
  },
  text(html, e) {
    const el = $('#tip'); el.innerHTML = html; el.classList.remove('hidden');
    const w = el.offsetWidth, h = el.offsetHeight;
    let x = e.clientX + 14, y = e.clientY + 14;
    if (x + w > innerWidth - 8) x = e.clientX - w - 14; if (y + h > innerHeight - 8) y = Math.max(8, innerHeight - h - 8);
    el.style.left = x + 'px'; el.style.top = y + 'px';
  },
  hide() { $('#tip').classList.add('hidden'); },
};

/* =====================================================================
   10. PANEL SỬA TASK – phần chính gọn, phần ít dùng nằm trong "Thiết lập nâng cao"
   ===================================================================== */
const Drawer = {
  open(id) { const t = Store.plan().tasks.find(x => x.id === id); if (!t) return; App.drawerTaskId = id; App.drawerIsNew = false; this.render(U.clone(t), false); },
  openNew() {
    const p = Store.plan(), sel = p.tasks.find(x => x.id === App.selectedId) || p.tasks[p.tasks.length - 1];
    const t = makeTask({ id: nextTaskId(p), order: p.tasks.reduce((m, t) => Math.max(m, t.order), 0) + 1, branch: sel?.branch || 'Nhánh Hạt', process: sel?.process || 'EXT', owner: sel?.owner || '' });
    App.drawerTaskId = t.id; App.drawerIsNew = true; this.render(t, true);
    setTimeout(() => $('#d_name')?.focus(), 30);
  },
  close() { App.drawerTaskId = null; App.drawerIsNew = false; $('#drawer').classList.add('hidden'); $('#drawer').innerHTML = ''; },

  render(t, isNew) {
    const p = Store.plan(), P = U.parseLocalISO(p.start), r = isNew ? null : App.res.R.get(t.id);
    const opts = arr => [...new Set(arr.filter(Boolean))].map(v => `<option value="${U.esc(v)}">`).join('');
    const people = p.tasks.flatMap(x => U.splitOwners(x.assignee)), teams = p.tasks.flatMap(x => [x.owner, ...U.splitOwners(x.owner)]);
    const useMin = t.durationHours > 0 && t.durationHours < 1, lagMin = t.lagHours && Math.abs(t.lagHours) < 1;
    const offIso = t.constraintOffsetHours !== null ? U.toLocalISO(P + t.constraintOffsetHours * MS_H) : (r ? U.toLocalISO(r.start) : p.start);
    const el = $('#drawer'); el.classList.remove('hidden');
    el.innerHTML = `
      <div class="drawer-h"><h3>${isNew ? 'Thêm task mới' : 'Sửa task'}</h3><button class="x" id="d_x" title="Đóng (Esc)">×</button></div>
      <div class="drawer-b">
        <div class="fg">
          <label class="fl full"><span>Tên task</span><input id="d_name" value="${U.esc(t.taskName)}" placeholder="VD: Check list + CIP Clarifier"></label>
          <label class="fl full"><span>Người thực hiện</span><input id="d_assignee" list="dl_people" value="${U.esc(t.assignee)}" placeholder="Nhập tên, nhiều người nối bằng dấu +"><datalist id="dl_people">${opts(people)}</datalist></label>
          <label class="fl"><span>Process</span><input id="d_process" list="dl_proc" value="${U.esc(t.process)}"><datalist id="dl_proc">${opts([...PROCESS_DEFAULT, ...p.tasks.map(x => x.process)])}</datalist></label>
          <label class="fl"><span>Đội phụ trách</span><input id="d_owner" list="dl_owner" value="${U.esc(t.owner)}" placeholder="VD: OP EXT"><datalist id="dl_owner">${opts(teams)}</datalist></label>
          <label class="fl"><span>Thời lượng</span><div class="inline"><input id="d_dur" type="number" min="0" step="any" value="${useMin ? +(t.durationHours * 60).toFixed(4) : +t.durationHours.toFixed(6)}"><select id="d_durU"><option value="h" ${useMin ? '' : 'selected'}>giờ</option><option value="m" ${useMin ? 'selected' : ''}>phút</option></select></div></label>
          <label class="fl"><span>Tiến độ (%)</span><input id="d_prog" type="number" min="0" max="100" step="10" value="${t.progress}"></label>
          <div class="fl full"><span>Chạy sau task <span class="muted" style="font-weight:400">(chỉ bắt đầu khi các task được chọn xong)</span></span>
            <input id="d_depq" placeholder="Lọc…" style="margin-bottom:4px"><div class="deplist" id="d_deps"></div></div>
          <label class="fl full"><span>Ghi chú</span><textarea id="d_notes" rows="2">${U.esc(t.notes)}</textarea></label>
          <div class="full calc" id="d_calc"></div>
        </div>
        <details class="adv"><summary>Thiết lập nâng cao</summary>
          <div class="fg">
            <label class="fl"><span>Nhánh</span><input id="d_branch" list="dl_branch" value="${U.esc(t.branch)}"><datalist id="dl_branch">${opts([...BRANCHES_DEFAULT, ...p.tasks.map(x => x.branch)])}</datalist></label>
            <label class="fl"><span>STT (thứ tự)</span><input id="d_order" type="number" step="any" value="${t.order}"></label>
            <label class="fl"><span>Cách thực hiện</span><select id="d_mode">${Object.entries(EXEC_MODES).map(([k, v]) => `<option value="${k}" ${k === t.executionMode ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
            <label class="fl"><span>Chờ thêm sau task trước</span><div class="inline"><input id="d_lag" type="number" step="any" value="${lagMin ? +(t.lagHours * 60).toFixed(4) : +t.lagHours}"><select id="d_lagU"><option value="h" ${lagMin ? '' : 'selected'}>giờ</option><option value="m" ${lagMin ? 'selected' : ''}>phút</option></select></div></label>
            <div class="fl full" id="d_fixedBox"><span>Thời điểm cố định</span><input id="d_fixed" type="datetime-local" value="${offIso}"></div>
            <div class="fl full" id="d_snetBox"><span>Ràng buộc bắt đầu</span><div class="inline"><select id="d_cons" style="flex:0 0 180px"><option value="ASAP" ${t.constraintType !== 'SNET' ? 'selected' : ''}>Sớm nhất có thể</option><option value="SNET" ${t.constraintType === 'SNET' ? 'selected' : ''}>Không sớm hơn</option></select><input id="d_snet" type="datetime-local" value="${offIso}"></div></div>
            <label class="fl"><span>Định mức (giờ)</span><input id="d_std" type="number" min="0" step="any" value="${+t.standardHours.toFixed(6)}"></label>

            <label class="fl"><span>Số người</span><input id="d_people" type="number" min="0" step="1" value="${t.peopleRequired}"></label>
            <div class="fl"><span>&nbsp;</span><label class="chk"><input type="checkbox" id="d_ms" ${t.milestone ? 'checked' : ''}> Milestone</label></div>
            <label class="chk full"><input type="checkbox" id="d_lock" ${t.locked ? 'checked' : ''}> Khóa – không cho tự động di chuyển</label>
            <label class="fl full"><span>Chi tiết cách làm</span><textarea id="d_method" rows="2">${U.esc(t.method)}</textarea></label>
            ${isNew ? '' : '<div class="full inline" style="flex:0"><button class="btn" type="button" id="d_up">Lên trên</button><button class="btn" type="button" id="d_down">Xuống dưới</button></div>'}
          </div>
        </details>
        <div class="err-msg" id="d_err"></div>
      </div>
      <div class="drawer-f">
        <button class="btn primary" id="d_save">Lưu</button>
        ${isNew ? '' : '<button class="btn" id="d_dup">Sao chép</button><button class="btn danger" id="d_del">Xóa</button>'}
        <span style="flex:1"></span><button class="btn" id="d_cancel">Đóng</button>
      </div>`;
    this.renderDeps(t, isNew); this.refreshCalc();
    const sync = () => {
      const mode = $('#d_mode').value, locked = $('#d_lock').checked;
      $('#d_fixedBox').classList.toggle('hidden', mode !== 'fixed'); $('#d_snetBox').classList.toggle('hidden', mode === 'fixed');
      $('#d_snet').disabled = $('#d_cons').value !== 'SNET' || locked; $('#d_cons').disabled = locked;
    };
    sync(); ['#d_mode', '#d_cons', '#d_lock'].forEach(s => $(s).addEventListener('change', sync));
    $('#d_x').onclick = $('#d_cancel').onclick = () => this.close();
    $('#d_save').onclick = () => this.save();
    if (!isNew) { $('#d_dup').onclick = () => Actions.duplicateTask(t.id); $('#d_del').onclick = () => Actions.deleteTask(t.id); $('#d_up').onclick = () => Actions.moveTask(t.id, -1); $('#d_down').onclick = () => Actions.moveTask(t.id, 1); }
    $('#d_depq').oninput = e => { const q = U.norm(e.target.value); $$('#d_deps label').forEach(l => l.classList.toggle('hidden', q && !U.norm(l.textContent).includes(q))); };
    el.onkeydown = e => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); this.save(); } };
  },
  renderDeps(t, isNew) {
    const p = Store.plan(), blocked = isNew ? new Set() : Scheduler.descendants(p, t.id);
    const list = p.tasks.filter(x => x.id !== t.id).sort((a, b) => a.order - b.order);
    $('#d_deps').innerHTML = list.length ? list.map(x => {
      const dis = blocked.has(x.id), on = t.dependencyIds.includes(x.id);
      return `<label class="${dis && !on ? 'dis' : ''}" title="${dis ? 'Không chọn được: sẽ tạo vòng lặp phụ thuộc' : ''}"><input type="checkbox" value="${U.esc(x.id)}" ${on ? 'checked' : ''} ${dis && !on ? 'disabled' : ''}><span class="pr">${U.esc(x.process)}</span><span>${U.esc(x.taskName)}</span></label>`;
    }).join('') : '<div class="muted small" style="padding:6px">Chưa có task khác.</div>';
  },
  refreshCalc() {
    const box = $('#d_calc'); if (!box) return;
    if (App.drawerIsNew) { box.innerHTML = '<span class="muted">Giờ bắt đầu/kết thúc sẽ được tính tự động sau khi lưu.</span>'; return; }
    const r = App.res.R.get(App.drawerTaskId); if (!r) return;
    const t = Store.plan().tasks.find(x => x.id === App.drawerTaskId);
    const drv = { plan: 'đầu kế hoạch', dep: 'chờ task trước', chain: 'chờ task trước cùng process', snet: 'mốc đã kéo', fixed: t.locked ? 'đã khóa' : 'cố định' }[r.driver];
    box.innerHTML = `<b>${U.fmtDT(r.start)} → ${U.fmtDT(r.end)}</b> <span class="muted">(${drv})</span><br>
      ${r.critical ? '<span style="color:var(--st-crit);font-weight:600">Nằm trên Critical task – trễ task này sẽ trễ cả Shutdown</span>' : `<span class="muted">Có thể trễ tối đa ${U.fmtDur(r.slackH)} mà không ảnh hưởng tổng thời gian</span>`}
      ${r.issues.filter(i => i.level !== 'info').map(i => `<br><span style="color:#b45309">${U.esc(i.msg)}</span>`).join('')}`;
  },
  save() {
    const p = Store.plan(), P = U.parseLocalISO(p.start), isNew = App.drawerIsNew, id = App.drawerTaskId;
    const old = isNew ? null : p.tasks.find(x => x.id === id);
    const err = m => { $('#d_err').textContent = m; return false; };
    const name = $('#d_name').value.trim(); if (!name) return err('Vui lòng nhập tên task.');
    const durRaw = U.num($('#d_dur').value, NaN), dur = $('#d_durU').value === 'm' ? durRaw / 60 : durRaw, ms = $('#d_ms').checked;
    if (!isFinite(dur) || dur < 0 || (dur === 0 && !ms)) return err('Thời lượng phải lớn hơn 0.');
    const lagRaw = U.num($('#d_lag').value, 0), lag = $('#d_lagU').value === 'm' ? lagRaw / 60 : lagRaw;
    const mode = $('#d_mode').value, locked = $('#d_lock').checked;
    let cType = 'ASAP', cOff = null;
    if (mode === 'fixed') { const f = U.parseLocalISO($('#d_fixed').value); if (!isFinite(f)) return err('Chế độ cố định: hãy nhập thời điểm bắt đầu.'); cType = 'FIXED'; cOff = (f - P) / MS_H; }
    else if ($('#d_cons').value === 'SNET') { const s = U.parseLocalISO($('#d_snet').value); if (!isFinite(s)) return err('Hãy nhập mốc "không sớm hơn".'); cType = 'SNET'; cOff = (s - P) / MS_H; }
    const draft = normalizeTask({
      ...(old || {}), id, taskName: name, assignee: $('#d_assignee').value, branch: $('#d_branch').value.trim() || 'Chung', process: $('#d_process').value.trim() || 'Chung',
      durationHours: dur, standardHours: U.num($('#d_std').value, dur), quantity: U.num($('#d_qty').value, 1), peopleRequired: U.num($('#d_people').value, 1),
      owner: $('#d_owner').value, executionMode: mode, order: U.num($('#d_order').value, old ? old.order : 1), dependencyIds: $$('#d_deps input:checked').map(i => i.value), lagHours: lag,
      constraintType: cType, constraintOffsetHours: cOff, milestone: ms, locked, progress: U.num($('#d_prog').value, 0), method: $('#d_method').value, notes: $('#d_notes').value,
    });
    if (locked && mode !== 'fixed') {
      if (!(old && old.locked)) { const r = old ? App.res.R.get(id) : null; draft.constraintType = 'SNET'; draft.constraintOffsetHours = r ? (r.start - P) / MS_H : (cOff ?? 0); }
      else { draft.constraintOffsetHours = old.constraintOffsetHours; draft.constraintType = 'SNET'; }
    }
    const test = { ...p, tasks: isNew ? [...p.tasks, draft] : p.tasks.map(x => x.id === id ? draft : x) };
    const g = Scheduler.buildGraph(test), tp = Scheduler.topo(test.tasks, g);
    if (tp.inCycle.includes(id)) return err('Không lưu được – phụ thuộc vòng tròn: ' + Scheduler.findCycle(g, tp.inCycle).map(c => test.tasks.find(x => x.id === c)?.taskName || c).join(' → '));
    Store.commit((isNew ? 'Thêm task ' : 'Sửa task ') + name, p => { if (isNew) p.tasks.push(draft); else p.tasks[p.tasks.findIndex(x => x.id === id)] = draft; });
    App.selectedId = id; App.drawerIsNew = false;
    toast((isNew ? 'Đã thêm ' : 'Đã lưu ') + name, 'ok');
    this.close();
  },
};

          <dt>Tổng thời gian</dt><dd>${U.fmtDur(k.windowHours)}</dd><dt>Số task</dt><dd>${k.taskCount} task · ${k.assignedCount} đã có người</dd>

      Store.commit('Xóa kế hoạch', () => { s.plans = s.plans.filter(p => p.id !== pl.id); if (s.activePlanId === pl.id) s.activePlanId = s.plans[0].id; });
