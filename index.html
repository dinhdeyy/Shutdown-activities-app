  /** Bước 1: tên + ngày giờ bắt đầu + nguồn task. Bước 2: danh sách task có giờ tính sẵn, thêm/bớt/sửa */
  wizard(copyFromId) {
    const s = Store.state, tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate() + 1);
    const date = U.toLocalISO(tomorrow.getTime()).slice(0, 10);
    this.w = {
      name: copyFromId ? s.plans.find(p => p.id === copyFromId).name + ' (bản sao)' : 'Shutdown ' + date.split('-').reverse().join('/'),
      date, time: '06:00', target: copyFromId ? s.plans.find(p => p.id === copyFromId).targetHours : 32, src: copyFromId || 'template', tasks: null,
    };
    this.step1();
  },
  step1() {
    const s = Store.state, w = this.w;
    const m = openModal(`<div class="modal-h"><h3>Tạo kế hoạch Shutdown mới</h3><button class="x" data-close>×</button></div>
      <div class="modal-b"><div class="steps"><span class="on">1. Thời gian bắt đầu</span><span>2. Danh sách task</span></div>
        <div class="fg">
          <label class="fl full"><span>Tên kế hoạch</span><input id="w_name" value="${U.esc(w.name)}"></label>
          <label class="fl"><span>Ngày bắt đầu</span><input id="w_date" type="date" value="${w.date}"></label>
          <label class="fl"><span>Giờ bắt đầu</span><input id="w_time" type="time" value="${w.time}"></label>
          <label class="fl"><span>Mục tiêu tổng thời gian (giờ)</span><input id="w_target" type="number" min="1" step="0.5" value="${w.target}"></label>
          <label class="fl"><span>Lấy task từ</span><select id="w_src">
            <option value="template" ${w.src === 'template' ? 'selected' : ''}>Bộ task mẫu (14 task)</option>
            ${s.plans.map(p => `<option value="${U.esc(p.id)}" ${w.src === p.id ? 'selected' : ''}>Kế hoạch: ${U.esc(p.name)} (${p.tasks.length} task)</option>`).join('')}
            <option value="empty" ${w.src === 'empty' ? 'selected' : ''}>Trống – tự thêm task</option></select></label>
        </div><div class="err-msg" id="w_err"></div></div>
      <div class="modal-f"><button class="btn" data-close>Hủy</button><button class="btn primary" id="w_next">Tiếp: xem danh sách task</button></div>`, 'sm');
    $('#w_next', m).onclick = () => {
      const srcChanged = w.src !== $('#w_src').value;
      const typed = $('#w_name').value.trim(), autoName = d => 'Shutdown ' + d.split('-').reverse().join('/');
      w.name = !typed || typed === autoName(w.date) ? autoName($('#w_date').value || w.date) : typed;
      Object.assign(w, { date: $('#w_date').value, time: $('#w_time').value, target: U.num($('#w_target').value, 0), src: $('#w_src').value });
      if (!isFinite(U.parseLocalISO(w.date + 'T' + w.time))) { $('#w_err').textContent = 'Hãy chọn ngày và giờ bắt đầu.'; return; }
      if (!(w.target > 0)) { $('#w_err').textContent = 'Mục tiêu phải lớn hơn 0.'; return; }
      if (!w.tasks || srcChanged) {
        if (w.src === 'template') w.tasks = templateTasks();
        else if (w.src === 'empty') w.tasks = [];
        else w.tasks = U.clone(s.plans.find(p => p.id === w.src).tasks).map(t => { t.progress = 0; if (t.constraintType === 'SNET' && !t.locked) { t.constraintType = 'ASAP'; t.constraintOffsetHours = null; } return normalizeTask(t); });
      }
      this.step2();
    };
  },
  step2() {
    const w = this.w, start = w.date + 'T' + w.time;
    const procs = [...new Set([...PROCESS_DEFAULT, ...w.tasks.map(t => t.process)])];
    const m = openModal(`<div class="modal-h"><h3>${U.esc(w.name)}</h3><button class="x" data-close>×</button></div>
      <div class="modal-b"><div class="steps"><span>1. Thời gian bắt đầu</span><span class="on">2. Danh sách task</span></div>
        <div class="sumline" id="w_sum"></div>
        <p class="small muted" style="margin:0 0 8px">Giờ bắt đầu/kết thúc tự tính theo thời lượng và thứ tự chuẩn. Có thể sửa tên, thời lượng, người thực hiện; thêm hoặc bỏ task.</p>
        <datalist id="w_procs">${procs.map(p => `<option value="${U.esc(p)}">`).join('')}</datalist>
        <div class="prev-wrap"><table class="tbl"><thead><tr><th style="width:34px">#</th><th style="width:120px">Process</th><th>Task</th><th style="width:90px">Giờ</th><th style="width:190px">Người thực hiện</th><th style="width:105px">Bắt đầu</th><th style="width:105px">Kết thúc</th><th style="width:40px"></th></tr></thead>
        <tbody id="w_rows"></tbody></table></div>
        <button class="btn" id="w_add" style="margin-top:10px">+ Thêm task</button>
        <div class="err-msg" id="w_err"></div></div>
      <div class="modal-f"><button class="btn" id="w_back">Quay lại</button><span style="flex:1"></span><button class="btn" data-close>Hủy</button><button class="btn primary" id="w_ok">Tạo kế hoạch</button></div>`);
    const rowsEl = $('#w_rows', m);
    const drawRows = () => {
      rowsEl.innerHTML = w.tasks.map((t, i) => `<tr data-i="${i}">
        <td class="muted">${i + 1}</td>
        <td><input data-f="process" list="w_procs" value="${U.esc(t.process)}"></td>
        <td><input data-f="taskName" value="${U.esc(t.taskName)}" placeholder="Tên task"></td>
        <td><input data-f="durationHours" type="number" min="0" step="0.25" value="${+t.durationHours.toFixed(4)}"></td>
        <td><input data-f="assignee" value="${U.esc(t.assignee)}" placeholder="Tên người"></td>
        <td class="nowrap" data-s></td><td class="nowrap" data-e></td>
        <td><button class="btn icon" data-del title="Bỏ task này">✕</button></td></tr>`).join('') || '<tr><td colspan="8" class="muted" style="text-align:center;padding:20px">Chưa có task – bấm “+ Thêm task”.</td></tr>';
      calc();
    };
    /** Tính lại giờ bằng chính engine lập lịch (process chạy song song, không cộng dồn) */
    const calc = () => {
      const r = Scheduler.schedule(makePlan({ start, targetHours: w.target, tasks: w.tasks }));
      $$('tr[data-i]', rowsEl).forEach(tr => { const t = w.tasks[+tr.dataset.i], x = r.R.get(t.id); $('[data-s]', tr).textContent = x ? U.fmtDM(x.start) : ''; $('[data-e]', tr).textContent = x ? U.fmtDM(x.end) : ''; });
      const over = w.tasks.length && r.kpi.windowHours > w.target;
      $('#w_sum', m).innerHTML = `<div><span>Bắt đầu</span><b>${U.fmtDT(U.parseLocalISO(start))}</b></div><div><span>Kết thúc dự kiến</span><b>${w.tasks.length ? U.fmtDT(r.windowEnd) : '–'}</b></div>
        <div><span>Tổng thời gian</span><b style="color:${over ? 'var(--st-late)' : 'inherit'}">${U.fmtDur(r.kpi.windowHours)}</b></div><div><span>Mục tiêu</span><b>${U.fmtNum(w.target)} giờ</b></div><div><span>Số task</span><b>${w.tasks.length}</b></div>`;
    };
    rowsEl.addEventListener('input', e => {
      const f = e.target.dataset.f; if (!f) return;
      const t = w.tasks[+e.target.closest('tr').dataset.i];
      t[f] = f === 'durationHours' ? U.num(e.target.value, 0) : e.target.value;
      if (f === 'durationHours' || f === 'process') calc();
    });
    rowsEl.addEventListener('click', e => {
      if (!e.target.closest('[data-del]')) return;
      const t = w.tasks.splice(+e.target.closest('tr').dataset.i, 1)[0];
      w.tasks.forEach(x => x.dependencyIds = x.dependencyIds.filter(d => d !== t.id));
      drawRows();
    });
    $('#w_add', m).onclick = () => {
      const last = w.tasks[w.tasks.length - 1];
      w.tasks.push(normalizeTask({ id: nextTaskId({ tasks: w.tasks }), order: w.tasks.reduce((a, t) => Math.max(a, t.order), 0) + 1, branch: last?.branch || 'Nhánh Hạt', process: last?.process || 'EXT', owner: last?.owner || '', durationHours: 1, standardHours: 1 }));
      drawRows(); $$('input[data-f="taskName"]', rowsEl).pop()?.focus();
    };
    $('#w_back', m).onclick = () => this.step1();
    $('#w_ok', m).onclick = () => {
      const bad = w.tasks.findIndex(t => !String(t.taskName).trim() || !(t.durationHours > 0));
      if (bad >= 0) { $('#w_err', m).textContent = `Dòng ${bad + 1}: cần có tên task và thời lượng > 0.`; return; }
      const np = makePlan({ name: w.name, start, targetHours: w.target, tasks: w.tasks.map(normalizeTask), resourceCapacity: { 'Nhà thầu': 3 } });
      Actions.renumber(np);
      Store.commit('Tạo kế hoạch ' + w.name, () => { Store.state.plans.push(np); Store.state.activePlanId = np.id; });
      closeModal(); App.openPlan(np.id); toast(`Đã tạo "${w.name}" với ${np.tasks.length} task`, 'ok');
    };
    drawRows();
  },
};

/* =====================================================================
   12. PANELS – AUTO SCHEDULE, CẢNH BÁO, NGUỒN LỰC, MENU
   ===================================================================== */
const Panels = {
  autoSchedule() {
    const m = openModal(`<div class="modal-h"><h3>Tự động sắp lịch</h3><button class="x" data-close>×</button></div>
      <div class="modal-b"><p style="margin-top:0">Xếp lại toàn bộ task: các process chạy song song, task có phụ thuộc chờ task trước xong, tính đường găng.</p>
        <label class="chk"><input type="checkbox" id="as_reset" checked> Bỏ các mốc đã kéo tay, xếp sớm nhất có thể (task cố định / khóa giữ nguyên)</label><br>
        <label class="chk"><input type="checkbox" id="as_level"> Tự dời task khi một người/đội bị trùng giờ</label></div>
      <div class="modal-f"><button class="btn" data-close>Hủy</button><button class="btn primary" id="as_ok">Chạy</button></div>`, 'sm');
    $('#as_ok', m).onclick = () => {
      const reset = $('#as_reset').checked, level = $('#as_level').checked, pre = Scheduler.schedule(Store.plan());
      if (pre.issues.some(i => i.level === 'error')) { closeModal(); this.warnings('Cần sửa lỗi dữ liệu trước khi sắp lịch'); return; }
      const before = pre.kpi.windowHours; let moved = [];
      Store.commit('Tự động sắp lịch', p => {
        if (reset) p.tasks.forEach(t => { if (t.constraintType === 'SNET' && !t.locked && t.executionMode !== 'fixed') { t.constraintType = 'ASAP'; t.constraintOffsetHours = null; } });
        if (level) { const lv = Scheduler.levelResources(p); moved = lv.moved; p.tasks = lv.plan.tasks; }
      });
      closeModal();
      const k = App.res.kpi;
      toast(`Đã sắp lịch: ${U.fmtDur(before, true)} → ${U.fmtDur(k.windowHours, true)}${level ? ` · dời ${moved.length} task` : ''} · còn ${k.conflictCount} xung đột`, k.conflictCount ? 'warn' : 'ok');
      App.scrollToStart();
    };
  },
  warnings(title) {
    const res = App.res, byId = new Map(Store.plan().tasks.map(t => [t.id, t])), ord = { error: 0, warn: 1, info: 2 };
    const list = res.issues.slice().sort((a, b) => ord[a.level] - ord[b.level]);
    const html = list.length ? list.map((is, i) => `<div class="warn-item ${is.level === 'error' ? 'error' : is.level === 'info' ? 'info' : ''}">
        <div class="wt">${U.esc(is.msg)}${is.suggestionText ? `<div class="small" style="margin-top:3px;color:var(--accent)">${U.esc(is.suggestionText)}</div>` : ''}
          <div class="small muted" style="margin-top:3px">${(is.taskIds || []).map(id => `<b data-goto="${U.esc(id)}">${U.esc(byId.get(id)?.taskName || id)}</b>`).join(' · ')}</div></div>
        ${is.suggestion ? `<button class="btn" data-apply="${i}">Áp dụng</button>` : ''}</div>`).join('')
      : '<div class="empty-state">Không có cảnh báo – dữ liệu hợp lệ, không ai bị trùng giờ.</div>';
    const m = openModal(`<div class="modal-h"><h3>${U.esc(title || 'Cảnh báo & kiểm tra dữ liệu')} (${list.length})</h3><button class="x" data-close>×</button></div>
      <div class="modal-b">${html}</div>
      <div class="modal-f">${res.conflicts.some(c => c.suggestion) ? '<button class="btn" id="w_level">Tự dời tất cả task bị trùng</button>' : ''}<button class="btn" data-close>Đóng</button></div>`);
    $$('[data-goto]', m).forEach(b => b.onclick = () => { closeModal(); App.selectTask(b.dataset.goto, true); });
    $$('[data-apply]', m).forEach(b => b.onclick = () => {
      const is = list[+b.dataset.apply];
      Store.commit('Áp dụng đề xuất dời task', p => { const t = p.tasks.find(x => x.id === is.suggestion.taskId); t.constraintType = 'SNET'; t.constraintOffsetHours = (is.suggestion.toMs - res.P) / MS_H; });
      toast('Đã dời task theo đề xuất', 'ok'); this.warnings(title);
    });
    const lb = $('#w_level', m); if (lb) lb.onclick = () => { closeModal(); this.level(); };
  },
  level() {
    let info;
    Store.commit('Cân bằng nguồn lực', p => { info = Scheduler.levelResources(p); if (!info.moved.length) return false; p.tasks = info.plan.tasks; });
    if (!info.moved.length) { toast('Không có xung đột nào để tự xử lý.', 'warn'); return; }
    toast(`Đã dời ${info.moved.length} task. Còn ${info.remaining} xung đột.`, info.remaining ? 'warn' : 'ok');
  },
  capacity() {
    const p = Store.plan(), names = [...new Map(p.tasks.flatMap(t => Scheduler.resourcesOf(t)).map(o => [U.norm(o), o])).values()].sort((a, b) => a.localeCompare(b, 'vi'));
    const cap = p.resourceCapacity || {}, get = n => { for (const k in cap) if (U.norm(k) === U.norm(n)) return cap[k]; return 1; };
    const m = openModal(`<div class="modal-h"><h3>Năng lực người / đội</h3><button class="x" data-close>×</button></div>
      <div class="modal-b"><p class="muted small" style="margin-top:0">Số task được làm cùng lúc (mặc định 1). Kiểm tra trùng giờ dùng <b>Người thực hiện</b>; task chưa có người thì dùng <b>Đội phụ trách</b>.</p>
      ${names.length ? `<table class="tbl"><thead><tr><th>Người / đội</th><th>Task cùng lúc</th><th>Số task</th></tr></thead><tbody>
      ${names.map(n => `<tr><td>${U.esc(n)}</td><td><input type="number" min="1" step="1" data-cap="${U.esc(n)}" value="${get(n)}" style="width:80px"></td><td>${p.tasks.filter(t => Scheduler.resourcesOf(t).some(o => U.norm(o) === U.norm(n))).length}</td></tr>`).join('')}</tbody></table>` : '<p>Chưa có người/đội nào.</p>'}</div>
      <div class="modal-f"><button class="btn" data-close>Hủy</button><button class="btn primary" id="cap_ok">Lưu</button></div>`, 'sm');
    $('#cap_ok', m).onclick = () => { const nc = {}; $$('[data-cap]', m).forEach(i => { const v = Math.max(1, Math.round(U.num(i.value, 1))); if (v !== 1) nc[i.dataset.cap] = v; }); Store.commit('Cập nhật năng lực', p => { p.resourceCapacity = nc; }); closeModal(); };
  },
  async more(cmd) {
    const s = Store.state;
    if (cmd === 'warnings') this.warnings();
    else if (cmd === 'level') this.level();
    else if (cmd === 'capacity') this.capacity();
    else if (cmd === 'renumber') { Store.commit('Đánh lại STT', p => Actions.renumber(p, true)); toast('Đã đánh lại STT theo giờ bắt đầu', 'ok'); }
    else if (cmd === 'dark') { s.ui.dark = document.body.classList.toggle('dark'); Store.save(); App.renderMain(); }
    else if (cmd === 'restore-json') $('#fileJson').click();
    else if (cmd === 'save-app') Persist.saveApp();
    else if (cmd === 'copy-data') Persist.copyData();
    else if (cmd === 'paste-data') Persist.pasteData();
    else if (cmd === 'sample') {
      if (!(await confirmBox('Khôi phục kế hoạch mẫu', 'Thêm lại kế hoạch mẫu 14 task? Các kế hoạch khác giữ nguyên.'))) return;
      Store.commit('Khôi phục kế hoạch mẫu', () => { const sp = samplePlan(); s.plans = s.plans.filter(p => p.id !== sp.id); s.plans.unshift(sp); s.activePlanId = sp.id; });
      App.openPlan('PLAN-SAMPLE');
    }
    else if (cmd === 'stress') { const sp = IO.stressPlan(300); Store.commit('Tạo kế hoạch kiểm thử', () => { s.plans.push(sp); s.activePlanId = sp.id; }); App.openPlan(sp.id); }
    else if (cmd === 'clear') {
      if (!(await confirmBox('Xóa toàn bộ dữ liệu', 'Xóa <b>tất cả kế hoạch</b>? Nên Export JSON backup trước.', 'Xóa hết', true))) return;
      Store.commit('Xóa toàn bộ dữ liệu', () => { const np = makePlan({ name: 'Kế hoạch Shutdown mới', start: defaultSampleStart() }); s.plans = [np]; s.activePlanId = np.id; });
      App.switchView('home'); toast('Đã xóa dữ liệu.', 'ok');
    }
  },
};

/* =====================================================================
   13. DASHBOARD
   ===================================================================== */
const Dash = {
  hbar(items, unit) {
    if (!items.length) return '<div class="muted">Chưa có dữ liệu</div>';
    const max = Math.max(...items.map(i => i.value), 1), rowH = 26, W = 560, L = 130, Rr = 130;
    return `<svg viewBox="0 0 ${W} ${items.length * rowH + 6}" width="100%">${items.map((it, i) => {
      const w = (W - L - Rr) * it.value / max, y = i * rowH + 4;
      return `<text x="${L - 8}" y="${y + 15}" text-anchor="end" font-size="12">${U.esc(it.label)}</text><rect x="${L}" y="${y + 3}" width="${Math.max(1, w)}" height="${rowH - 10}" rx="3" fill="${it.color}"/><text x="${L + w + 6}" y="${y + 15}" font-size="11.5">${U.fmtNum(it.value)} ${unit}</text>`;
    }).join('')}</svg>`;
  },
  render() {
    const p = Store.plan(), res = App.res, k = res.kpi, el = $('#viewDash');
    const over = p.targetHours > 0 && k.windowHours > p.targetHours + 1e-6;
    const card = (l, v, s = '') => `<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div>${s ? `<div class="s">${s}</div>` : ''}</div>`;
    const kp = [
      card('Tổng số task', k.taskCount, `${k.assignedCount} task đã có người thực hiện`),
      card('Số process', k.processCount),
      card('Bắt đầu', k.taskCount ? U.fmtDT(k.start) : '–'),
      card('Kết thúc dự kiến', k.taskCount ? U.fmtDT(k.end) : '–'),
      card('Tổng thời gian Shutdown', `<span style="color:${over ? 'var(--st-late)' : 'inherit'}">${U.fmtDur(k.windowHours, true)}</span>`, `Mục tiêu ${U.fmtNum(p.targetHours)}h · nếu làm nối tiếp: ${U.fmtDur(k.sumDuration, true)}`),
      card('Tổng giờ công', U.fmtNum(k.manHours) + ' h', 'thời lượng × số người'),
      card('Task song song nhiều nhất', k.maxParallel, k.maxParallelAt ? 'lúc ' + U.fmtDM(k.maxParallelAt) : ''),
      card('Xung đột người/đội', k.conflictCount),
      card('Task đường găng', k.criticalCount),
      card('Tiến độ', U.fmtNum(k.progress, 0) + '%', `<div class="progress-bar"><div style="width:${k.progress}%"></div></div>`),
    ].join('');
    const procMap = new Map(); for (const t of p.tasks) procMap.set(t.process, (procMap.get(t.process) || 0) + t.durationHours);
    const procItems = [...procMap].sort((a, b) => b[1] - a[1]).map(([pr, v]) => ({ label: pr, value: v, color: processColor(p, pr) }));
    const brMap = new Map(); for (const t of p.tasks) brMap.set(t.branch, (brMap.get(t.branch) || 0) + t.durationHours * t.peopleRequired);
    const brItems = [...brMap].map(([b, v], i) => ({ label: b, value: v, color: ['#0f2a4a', '#0e7490', '#7c3aed', '#b45309'][i % 4] }));
    const span = Math.max(k.windowHours, 1), bh = span <= 36 ? 1 : span <= 96 ? 2 : span <= 240 ? 4 : 8, buckets = [];
    if (k.taskCount) for (let t = res.windowStart; t < res.windowEnd; t += bh * MS_H) { const e = t + bh * MS_H; let n = 0; for (const x of res.R.values()) if (x.start < e && x.end > t) n++; buckets.push({ t, n }); }
    const maxB = Math.max(1, ...buckets.map(b => b.n)), CW = 760, CH = 170, bw = buckets.length ? (CW - 40) / buckets.length : 0, every = Math.max(1, Math.ceil(buckets.length / 16));
    const SC = ['#f59e0b', '#2563eb', '#475569'];
    const colChart = buckets.length ? `<svg viewBox="0 0 ${CW} ${CH + 34}" width="100%"><line class="ax" x1="34" y1="${CH}" x2="${CW}" y2="${CH}"/>
      ${[0, .5, 1].map(f => `<text x="28" y="${CH - f * (CH - 12) + 4}" font-size="10" text-anchor="end">${Math.round(maxB * f)}</text>`).join('')}
      ${buckets.map((b, i) => { const h = (CH - 12) * b.n / maxB, x = 36 + i * bw; return `<rect x="${x}" y="${CH - h}" width="${Math.max(1, bw - 2)}" height="${h}" fill="${SC[U.shiftOf(b.t) - 1]}" rx="2"><title>${U.fmtDM(b.t)}: ${b.n} task</title></rect>${i % every === 0 ? `<text x="${x}" y="${CH + 13}" font-size="9.5">${U.fmtHM(b.t)}</text>${new Date(b.t).getHours() < bh || i === 0 ? `<text x="${x}" y="${CH + 26}" font-size="9.5" font-weight="700">${U.fmtDate(b.t).slice(3, 8)}</text>` : ''}` : ''}`; }).join('')}</svg>
      <div class="small muted">Mỗi cột ${bh} giờ · màu theo ca: <span style="color:${SC[0]}">■</span> Ca 1 <span style="color:${SC[1]}">■</span> Ca 2 <span style="color:${SC[2]}">■</span> Ca 3</div>` : '<div class="muted">Chưa có dữ liệu</div>';
    const sh = [0, 0, 0]; for (const t of p.tasks) { const r = res.R.get(t.id); U.shiftHours(r.start, r.end).forEach((h, i) => sh[i] += h); }
    const shItems = sh.map((h, i) => ({ label: ['Ca 1 (06–14)', 'Ca 2 (14–22)', 'Ca 3 (22–06)'][i], value: h, color: SC[i] }));
    const crit = p.tasks.filter(t => res.R.get(t.id).critical).sort((a, b) => res.R.get(a.id).start - res.R.get(b.id).start);
    el.innerHTML = `<h3 style="margin:0 0 12px">${U.esc(p.name)}</h3><div class="kpis">${kp}</div>
      <div class="charts">
        <div class="card"><h4>Tổng giờ theo Process</h4>${this.hbar(procItems, 'h')}</div>
        <div class="card"><h4>Tổng giờ công theo Nhánh</h4>${this.hbar(brItems, 'giờ công')}</div>
        <div class="card" style="grid-column:1/-1"><h4>Số task đang chạy theo khung giờ</h4>${colChart}</div>
        <div class="card"><h4>Giờ làm việc theo ca</h4>${this.hbar(shItems, 'h')}</div>
        <div class="card"><h4>Đường găng (${crit.length} task)</h4><div style="max-height:260px;overflow:auto"><table class="tbl"><thead><tr><th>Process</th><th>Task</th><th>Người thực hiện</th><th>Thời gian</th></tr></thead><tbody>
          ${crit.map(t => { const r = res.R.get(t.id); return `<tr><td>${U.esc(t.process)}</td><td><a href="#" data-goto="${U.esc(t.id)}">${U.esc(t.taskName)}</a></td><td>${U.esc(t.assignee || '–')}</td><td class="nowrap">${U.fmtDM(r.start)} → ${U.fmtHM(r.end)}</td></tr>`; }).join('')}</tbody></table></div></div>
      </div>`;
    $$('[data-goto]', el).forEach(a => a.onclick = e => { e.preventDefault(); App.selectTask(a.dataset.goto, true); });
  },
};

/* =====================================================================
   14. PERSIST – CÁC CÁCH LƯU KHI TRÌNH DUYỆT CHẶN BỘ NHỚ
   1) Tải app kèm dữ liệu: tạo file HTML mới có nhúng sẵn dữ liệu → lần sau mở file đó là có lại kế hoạch.
   2) Sao chép / Dán dữ liệu dạng chữ: dùng được cả khi khung xem trước chặn tải file.
   ===================================================================== */
const Persist = {
  dataJson() { Store.flush(); return JSON.stringify({ app: 'shutdown-planner', version: 1, savedAt: Date.now(), activePlanId: Store.state.activePlanId, plans: Store.state.plans, ui: Store.state.ui }); },
  buildAppHtml() {
    const json = this.dataJson().replace(/</g, '\\u003c');   // an toàn khi nhúng trong thẻ <script>
    return __APP_SRC__
      .replace(/<script[^>]*data-dyn="1"[^>]*><\/script>/g, '')
      .replace(/(<script id="spData" type="application\/json">)[\s\S]*?(<\/script>)/, (m, a, b) => a + json + b);
  },
  saveApp() {
    const name = 'Shutdown_Planner_' + safeName(Store.plan().name) + '_' + stamp() + '.html';
    download(name, new Blob([this.buildAppHtml()], { type: 'text/html;charset=utf-8' }));
    Store.dirty = false;
    toast('Đã tạo file "' + name + '". Lần sau mở file này là có lại dữ liệu. Nếu không thấy file tải về, dùng "Sao chép dữ liệu".', 'ok');
  },
  copyData() {
    const m = openModal(`<div class="modal-h"><h3>Sao chép dữ liệu</h3><button class="x" data-close>×</button></div>
      <div class="modal-b"><p style="margin-top:0">Bấm <b>Sao chép</b>, rồi dán (Ctrl+V) vào Notepad, OneNote, Teams chat hoặc email cho chính mình để cất giữ.
        Lần sau mở app → bấm <b>Dán dữ liệu</b> → dán lại đoạn này.</p>
        <textarea id="cp_txt" readonly style="width:100%;height:260px;font-family:Consolas,monospace;font-size:11px">${U.esc(this.dataJson())}</textarea></div>
      <div class="modal-f"><span class="muted small" id="cp_msg" style="flex:1"></span><button class="btn" data-close>Đóng</button><button class="btn primary" id="cp_btn">Sao chép</button></div>`);
    const ta = $('#cp_txt', m); setTimeout(() => { ta.focus(); ta.select(); }, 30);
    $('#cp_btn', m).onclick = async () => {
      ta.focus(); ta.select(); let ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { }
      if (!ok) { try { await navigator.clipboard.writeText(ta.value); ok = true; } catch (e) { } }
      $('#cp_msg', m).textContent = ok ? 'Đã sao chép – dán vào Notepad/OneNote để cất giữ.' : 'Trình duyệt chặn sao chép tự động – đoạn chữ đã được bôi đen, hãy bấm Ctrl+C.';
      if (ok) Store.dirty = false;
    };
  },
  pasteData() {
    const m = openModal(`<div class="modal-h"><h3>Dán dữ liệu</h3><button class="x" data-close>×</button></div>
      <div class="modal-b"><p style="margin-top:0">Dán (Ctrl+V) đoạn dữ liệu đã sao chép trước đó vào ô dưới, rồi bấm <b>Khôi phục</b>.</p>
        <textarea id="ps_txt" style="width:100%;height:240px;font-family:Consolas,monospace;font-size:11px" placeholder='{"app":"shutdown-planner", ...}'></textarea>
        <div class="err-msg" id="ps_err"></div></div>
      <div class="modal-f"><button class="btn" data-close>Hủy</button><button class="btn primary" id="ps_ok">Khôi phục</button></div>`);
    setTimeout(() => $('#ps_txt', m).focus(), 30);
    $('#ps_ok', m).onclick = () => {
      const d = Persist.parseAny($('#ps_txt', m).value);
      if (!d) { $('#ps_err', m).textContent = 'Không đọc được dữ liệu – hãy dán đúng đoạn chữ đã sao chép (bắt đầu bằng {"app":"shutdown-planner"...).'; return; }
      Persist.apply(d); closeModal();
    };
  },
  /** Đọc dữ liệu từ: JSON backup, đoạn chữ đã sao chép, hoặc file HTML app kèm dữ liệu */
  parseAny(txt) {
    txt = String(txt || '').trim(); if (!txt) return null;
    const m = /<script id="spData" type="application\/json">([\s\S]*?)<\/script>/.exec(txt);
    if (m) txt = m[1].trim();
    try { const d = JSON.parse(txt); return d && Array.isArray(d.plans) && d.plans.length ? d : null; } catch (e) { return null; }
  },
  apply(d) {
    const clean = Store.sanitize({ plans: d.plans, activePlanId: d.activePlanId, ui: Store.state.ui });
    Store.commit('Khôi phục dữ liệu', () => { Store.state.plans = clean.plans; Store.state.activePlanId = clean.activePlanId; });
    Store.dirty = false; App.switchView('home');
    toast(`Đã khôi phục ${clean.plans.length} kế hoạch.`, 'ok');
  },
};

/* =====================================================================
   14. IO – IMPORT (XEM TRƯỚC), EXPORT EXCEL/CSV/JSON, IN PDF
   ===================================================================== */
const COLS = {   // tên cột chấp nhận (đã bỏ dấu, chữ thường)
  stt: ['stt', 'no', 'no.', '#', 'thu tu'],
  id: ['id', 'ma task', 'task id'],
  branch: ['nhanh', 'nhanh san xuat', 'branch'],
  process: ['process', 'cong doan', 'line', 'khu vuc'],
  task: ['task', 'ten task', 'cong viec', 'noi dung', 'task name', 'ten cong viec'],
  start: ['bat dau', 'thoi diem bat dau', 'ngay bat dau', 'start', 'start time'],
  end: ['ket thuc', 'thoi diem ket thuc', 'ngay ket thuc', 'end', 'end time'],
  duration: ['khung ke hoach (gio)', 'khung ke hoach', 'thoi luong ke hoach (gio)', 'thoi luong (gio)', 'thoi luong', 'duration', 'gio'],
  durationMin: ['thoi luong (phut)', 'total time(min)', 'total time (min)', 'phut'],
  standard: ['dinh muc (gio)', 'dinh muc', 'dinh muc thuc hien (gio)', 'standard'],
  quantity: ['so luong', 'sl', 'qty', 'quantity'],
  people: ['so nguoi', 'people', 'nhan su'],
  assignee: ['nguoi thuc hien', 'ten nguoi thuc hien', 'ho ten', 'nhan vien', 'assignee'],
  owner: ['owner', 'doi phu trach', 'nguoi/doi phu trach', 'nguoi phu trach', 'phu trach', 'doi'],
  method: ['cach thuc hien', 'phuong thuc', 'mode'],
  deps: ['task phu thuoc', 'phu thuoc', 'chay sau', 'tien nhiem', 'dependency', 'predecessor'],
  lag: ['do tre (gio)', 'do tre', 'lag'],
  notes: ['ghi chu', 'note', 'notes'],
  progress: ['tien do (%)', 'tien do', 'progress'],
};
const EXPORT_HEAD = ['STT', 'ID', 'Nhánh', 'Process', 'Task', 'Bắt đầu', 'Kết thúc', 'Khung kế hoạch (giờ)', 'Định mức (giờ)', 'Số lượng', 'Số người', 'Người thực hiện', 'Owner', 'Cách thực hiện', 'Task phụ thuộc', 'Độ trễ (giờ)', 'Ghi chú', 'Tiến độ (%)', 'Đường găng', 'Cảnh báo'];

const IO = {
  needXLSX() { if (window.XLSX) return true; toast('Chưa tải được SheetJS (cần Internet). Hãy dùng CSV/JSON.', 'err'); return false; },
  async importFile(file) {
    try {
      let sheets;
      if (/\.csv$/i.test(file.name)) sheets = [{ name: file.name, aoa: this.parseCSV((await file.text()).replace(/^\uFEFF/, '')) }];
      else {
        if (!this.needXLSX()) return;
        const wb = XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: false });
        sheets = wb.SheetNames.map(n => ({ name: n, aoa: XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: '' }) }));
      }
      sheets.forEach(s => s.head = this.findHeader(s.aoa));
      const best = sheets.filter(s => s.head).sort((a, b) => b.head.score - a.head.score)[0];
      if (!best) { toast('Không tìm thấy dòng tiêu đề có cột "Task" trong file.', 'err'); return; }
      this.preview(file.name, sheets, best.name);
    } catch (e) { console.error(e); toast('Lỗi đọc file: ' + e.message, 'err'); }
  },
  parseCSV(txt) {
    const first = txt.split(/\r?\n/)[0] || '', delim = (first.match(/;/g) || []).length > (first.match(/,/g) || []).length ? ';' : (first.includes('\t') ? '\t' : ',');
    const rows = []; let row = [], cur = '', q = false;
    for (let i = 0; i < txt.length; i++) {
      const c = txt[i];
      if (q) { if (c === '"') { if (txt[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
      else if (c === '"') q = true;
      else if (c === delim) { row.push(cur); cur = ''; }
      else if (c === '\n' || c === '\r') { if (c === '\r' && txt[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
      else cur += c;
    }
    if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
    return rows;
  },
  findHeader(aoa) {
    let best = null;
    for (let r = 0; r < Math.min(40, aoa.length); r++) {
      const map = {}; let score = 0; const cells = aoa[r] || [];
      cells.forEach((cell, c) => { const h = U.norm(cell); if (!h) return; for (const [k, names] of Object.entries(COLS)) { if (map[k] !== undefined) continue; if (names.includes(h)) { map[k] = c; score += 2; return; } } });
      cells.forEach((cell, c) => { const h = U.norm(cell); if (!h || Object.values(map).includes(c)) return; for (const [k, names] of Object.entries(COLS)) { if (map[k] !== undefined) continue; if (names.some(n => n.length > 3 && h.startsWith(n))) { map[k] = c; score += 1; return; } } });
      if (map.task !== undefined && score >= 6 && (!best || score > best.score)) best = { row: r, map, score };
    }
    return best;
  },
  /** Quy tắc: có "Khung kế hoạch" → ưu tiên duration & tính lại Kết thúc; không có → Kết thúc − Bắt đầu */
  analyze(sheet) {
    const { aoa, head } = sheet, m = head.map, out = [], get = (row, k) => m[k] === undefined ? '' : row[m[k]];
    let lastB = '', lastP = '';
    for (let r = head.row + 1; r < aoa.length; r++) {
      const row = aoa[r] || [], name = String(get(row, 'task') ?? '').replace(/\s+/g, ' ').trim();
      const bIn = String(get(row, 'branch') || '').trim(), pIn = String(get(row, 'process') || '').trim();
      if (bIn) lastB = bIn; if (pIn) lastP = pIn;
      if (!name) continue;
      const it = { line: r + 1, stt: get(row, 'stt'), idIn: String(get(row, 'id') || '').trim(), branch: bIn || lastB || 'Chung', process: pIn || lastP || 'Chung', name, errors: [], notes: [] };
      const sRaw = get(row, 'start'), eRaw = get(row, 'end');
      it.start = U.parseVNDate(sRaw); it.end = U.parseVNDate(eRaw);
      if (sRaw !== '' && it.start === null) it.errors.push(`Không đọc được "Bắt đầu" (${sRaw}) – dùng dd/mm/yyyy HH:mm`);
      const dur = U.num(get(row, 'duration'), NaN), durMin = U.num(get(row, 'durationMin'), NaN), std = U.num(get(row, 'standard'), NaN);
      if (dur > 0) { it.dur = dur; if (it.start !== null && it.end !== null && Math.abs((it.end - it.start) / MS_H - dur) > 1 / 60) it.notes.push(`Bắt đầu–Kết thúc = ${U.fmtDur((it.end - it.start) / MS_H)} ≠ ${U.fmtDur(dur)} → dùng thời lượng`); }
      else if (durMin > 0) it.dur = durMin / 60;
      else if (it.start !== null && it.end !== null) { if (it.end <= it.start) it.errors.push('Kết thúc phải lớn hơn Bắt đầu'); else it.dur = (it.end - it.start) / MS_H; }
      else if (std > 0) { it.dur = std; it.notes.push('Không có thời lượng – dùng Định mức'); }
      if (!(it.dur > 0) && !it.errors.length) it.errors.push('Thiếu thời lượng');
      it.std = std > 0 ? std : it.dur;
      it.qty = U.num(get(row, 'quantity'), 1) || 1; it.people = U.num(get(row, 'people'), 1) || 1;
      it.assignee = String(get(row, 'assignee') || '').trim(); it.owner = String(get(row, 'owner') || '').trim();
      it.methodRaw = String(get(row, 'method') || '').trim();
      const mm = U.norm(it.methodRaw);
      it.mode = /co dinh|fixed/.test(mm) ? 'fixed' : /song song|parallel|dong thoi/.test(mm) ? 'parallel' : /sau task|phu thuoc|after/.test(mm) ? 'after_dependency' : 'sequential';
      it.depsRaw = String(get(row, 'deps') ?? '').trim(); it.lag = U.num(get(row, 'lag'), 0);
      it.notesTxt = String(get(row, 'notes') || '').trim(); it.progress = U.num(String(get(row, 'progress')).replace('%', ''), 0);
      out.push(it);
    }
    return out;
  },
  preview(fileName, sheets, sheetName) {
    const sheet = sheets.find(s => s.name === sheetName), items = sheet.head ? this.analyze(sheet) : [];
    const ok = items.filter(i => !i.errors.length), bad = items.length - ok.length;
    const earliest = ok.reduce((m, i) => i.start !== null ? Math.min(m, i.start) : m, Infinity);
    const m = openModal(`<div class="modal-h"><h3>Xem trước dữ liệu – ${U.esc(fileName)}</h3><button class="x" data-close>×</button></div>
      <div class="modal-b">
        <div class="opt-grid">
          <label class="fl"><span>Sheet</span><select id="im_sheet">${sheets.map(s => `<option ${s.name === sheetName ? 'selected' : ''} ${s.head ? '' : 'disabled'}>${U.esc(s.name)}</option>`).join('')}</select></label>
          <label class="fl"><span>Cách nhập</span><select id="im_mode"><option value="new">Tạo kế hoạch mới từ file</option><option value="replace">Thay toàn bộ task của kế hoạch đang mở</option><option value="append">Thêm vào kế hoạch đang mở</option></select></label>
          <label class="chk"><input type="checkbox" id="im_keep" checked> Giữ giờ “Bắt đầu” trong file</label>
          <label class="chk"><input type="checkbox" id="im_setstart" ${isFinite(earliest) ? 'checked' : 'disabled'}> Bắt đầu kế hoạch = ${isFinite(earliest) ? U.fmtDT(earliest) : 'giờ sớm nhất trong file'}</label>
        </div>
        <p style="margin:0 0 8px"><b>${items.length}</b> task · <span style="color:var(--st-done)">${ok.length} hợp lệ</span>${bad ? ` · <span style="color:var(--st-late)">${bad} lỗi (bỏ qua)</span>` : ''}</p>
        <div class="prev-wrap"><table class="tbl"><thead><tr><th>Dòng</th><th>Process</th><th>Task</th><th>Bắt đầu</th><th>Kết thúc</th><th>Thời lượng</th><th>Người thực hiện</th><th>Đội</th><th>Phụ thuộc</th><th>Ghi chú</th></tr></thead><tbody>
        ${items.slice(0, 600).map(i => `<tr class="${i.errors.length ? 'bad' : i.notes.length ? 'warnrow' : ''}"><td>${i.line}</td><td>${U.esc(i.process)}</td><td>${U.esc(i.name)}</td>
          <td class="nowrap">${i.start !== null ? U.fmtDM(i.start) : '–'}</td><td class="nowrap">${i.start !== null && i.dur > 0 ? U.fmtDM(i.start + i.dur * MS_H) : '–'}</td><td class="nowrap">${i.dur > 0 ? U.fmtDur(i.dur) : '–'}</td>
          <td>${U.esc(i.assignee)}</td><td>${U.esc(i.owner)}</td><td>${U.esc(i.depsRaw)}</td><td class="small">${[...i.errors, ...i.notes].map(U.esc).join('<br>')}</td></tr>`).join('')}
        </tbody></table></div></div>
      <div class="modal-f"><button class="btn" id="im_tpl">Tải file Excel mẫu</button><span style="flex:1"></span><button class="btn" data-close>Hủy</button><button class="btn primary" id="im_ok" ${ok.length ? '' : 'disabled'}>Import ${ok.length} task</button></div>`);
    $('#im_sheet', m).onchange = e => this.preview(fileName, sheets, e.target.value);
    $('#im_tpl', m).onclick = () => this.template();
    $('#im_ok', m).onclick = () => this.doImport(ok, { mode: $('#im_mode').value, keep: $('#im_keep').checked, setStart: $('#im_setstart').checked && isFinite(earliest), earliest, fileName });
  },
  doImport(items, o) {
    const s = Store.state;
    Store.commit('Import ' + o.fileName, cur => {
      let plan = cur;
      if (o.mode === 'new') { plan = makePlan({ name: o.fileName.replace(/\.\w+$/, ''), start: cur.start, targetHours: cur.targetHours }); s.plans.push(plan); s.activePlanId = plan.id; }
      if (o.mode !== 'append' && o.setStart) plan.start = U.toLocalISO(o.earliest);
      const P = U.parseLocalISO(plan.start), base = o.mode === 'append' ? plan.tasks.slice() : [];
      let maxOrder = base.reduce((m, t) => Math.max(m, t.order), 0);
      const tmp = { tasks: base }, bySTT = new Map(), byIdIn = new Map(), created = [], used = new Set(base.map(t => t.id));
      for (const it of items) {
        const id = it.idIn && !used.has(it.idIn) && o.mode !== 'append' ? it.idIn : nextTaskId(tmp); used.add(id);
        const t = normalizeTask({ id, order: ++maxOrder, branch: it.branch, process: it.process, taskName: it.name, durationHours: it.dur, standardHours: it.std, quantity: it.qty, peopleRequired: it.people,
          assignee: it.assignee, owner: it.owner, executionMode: it.mode, lagHours: it.lag, notes: it.notesTxt, method: it.methodRaw, progress: it.progress });
        if (o.keep && it.start !== null) { if (t.executionMode === 'fixed') t.constraintOffsetHours = (it.start - P) / MS_H; else { t.constraintType = 'SNET'; t.constraintOffsetHours = (it.start - P) / MS_H; } }
        tmp.tasks.push(t); created.push({ t, it });
        if (String(it.stt).trim() !== '') bySTT.set(String(it.stt).trim().replace(/\.0+$/, ''), id);
        if (it.idIn) byIdIn.set(it.idIn, id);
      }
      let unresolved = 0;
      for (const { t, it } of created) {
        if (!it.depsRaw) continue;
        t.dependencyIds = String(it.depsRaw).split(/[,;\s]+/).filter(Boolean).map(k => byIdIn.get(k) || bySTT.get(k.replace(/\.0+$/, '')) || base.find(b => b.id === k)?.id).filter(x => { if (!x) unresolved++; return x && x !== t.id; });
      }
      plan.tasks = tmp.tasks;
      for (let guard = 0; guard < 200; guard++) {
        const g = Scheduler.buildGraph(plan), tp = Scheduler.topo(plan.tasks, g); if (!tp.inCycle.length) break;
        const cyc = Scheduler.findCycle(g, tp.inCycle), v = plan.tasks.find(x => x.id === cyc[cyc.length - 1]), n = v.dependencyIds.length;
        v.dependencyIds = v.dependencyIds.filter(d => !cyc.includes(d)); if (v.dependencyIds.length === n) v.executionMode = 'parallel';
      }
      if (unresolved) toast(`${unresolved} mã phụ thuộc không tìm thấy – đã bỏ qua.`, 'warn');
      if (o.mode !== 'append' && plan.tasks.length) { const r = Scheduler.schedule(plan); if (plan.targetHours < r.kpi.windowHours) plan.targetHours = Math.ceil(r.kpi.windowHours); }
    });
    closeModal(); App.openPlan(Store.state.activePlanId);
    toast(`Đã import ${items.length} task.`, 'ok');
  },
  tableRows(plan, res, asText) {
    const list = plan.tasks.slice().sort((a, b) => a.order - b.order), sttOf = new Map(list.map(t => [t.id, t.order]));
    return list.map(t => {
      const r = res.R.get(t.id), dt = ms => asText ? U.fmtDT(ms) : U.msToExcelSerial(ms);
      return [t.order, t.id, t.branch, t.process, t.taskName, dt(r.start), dt(r.end), +t.durationHours.toFixed(6), +t.standardHours.toFixed(6), t.quantity, t.peopleRequired, t.assignee, t.owner,
        EXEC_MODES[t.executionMode], t.dependencyIds.map(d => sttOf.get(d)).filter(x => x !== undefined).join(', '), t.lagHours || 0, t.notes, t.progress, r.critical ? 'Có' : '', r.issues.filter(i => i.level !== 'info').map(i => i.msg).join(' | ')];
    });
  },
  fmtCols(ws, cols, z, fromRow) {
    const rg = XLSX.utils.decode_range(ws['!ref']);
    for (let R = fromRow; R <= rg.e.r; R++) for (const C of cols) { const a = XLSX.utils.encode_cell({ r: R, c: C }); if (ws[a] && typeof ws[a].v === 'number') { ws[a].t = 'n'; ws[a].z = z; } }
  },
  export(kind) {
    const p = Store.plan(), res = App.res, base = safeName(p.name) + '_' + stamp();
    if (kind === 'json') {
      Store.flush();
      download(base + '_backup.json', new Blob([JSON.stringify({ app: 'shutdown-planner', version: 1, exportedAt: new Date().toISOString(), activePlanId: Store.state.activePlanId, plans: Store.state.plans }, null, 1)], { type: 'application/json' }));
      toast('Đã xuất JSON backup', 'ok'); return;
    }
    if (kind === 'csv') {
      const csv = [EXPORT_HEAD, ...this.tableRows(p, res, true)].map(r => r.map(v => { const s = String(v ?? ''); return /[",\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(',')).join('\r\n');
      download(base + '.csv', new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' })); toast('Đã xuất CSV', 'ok'); return;
    }
    if (kind === 'print') {
      if (App.view !== 'gantt') App.switchView('gantt');
      const old = document.title; document.title = p.name;
      setTimeout(() => { try { window.print(); } catch (e) { toast('Trình duyệt chặn in – hãy mở file bằng Edge/Chrome.', 'err'); } document.title = old; }, 150);
      return;
    }
    if (!this.needXLSX()) return;
    try {
      const wb = XLSX.utils.book_new();
      if (kind === 'xlsx-list') {
        const ws = XLSX.utils.aoa_to_sheet([EXPORT_HEAD, ...this.tableRows(p, res, false)]);
        this.fmtCols(ws, [5, 6], 'dd/mm/yyyy hh:mm', 1);
        ws['!cols'] = [6, 10, 12, 12, 44, 17, 17, 10, 10, 8, 8, 22, 18, 22, 12, 9, 30, 9, 9, 50].map(w => ({ wch: w }));
        XLSX.utils.book_append_sheet(wb, ws, 'Danh sách task');
        XLSX.writeFile(wb, base + '_DanhSachTask.xlsx'); toast('Đã xuất Excel danh sách task', 'ok');
      } else if (kind === 'xlsx-timeline') {
        const head = ['STT', 'Nhánh', 'Process', 'Task', 'Bắt đầu', 'Kết thúc', 'Khung kế hoạch (giờ)', 'Người thực hiện', 'Owner', 'Task phụ thuộc', 'Ghi chú'];
        const tasks = p.tasks.slice().sort((a, b) => res.R.get(a.id).start - res.R.get(b.id).start || a.order - b.order), sttOf = new Map(p.tasks.map(t => [t.id, t.order]));
        const title = [[`TIMELINE SHUTDOWN – ${p.name}`], [`${U.fmtDT(res.windowStart)} → ${U.fmtDT(res.windowEnd)} · ${U.fmtDur(res.kpi.windowHours)} · ${p.tasks.length} task`], []];
        const ws1 = XLSX.utils.aoa_to_sheet([...title, head, ...tasks.map(t => { const r = res.R.get(t.id); return [t.order, t.branch, t.process, t.taskName, U.msToExcelSerial(r.start), U.msToExcelSerial(r.end), +t.durationHours.toFixed(6), t.assignee, t.owner, t.dependencyIds.map(d => sttOf.get(d)).join(', '), t.notes]; })]);
        this.fmtCols(ws1, [4, 5], 'dd/mm/yyyy hh:mm', title.length + 1);
        ws1['!cols'] = [6, 12, 12, 46, 17, 17, 10, 22, 18, 12, 30].map(w => ({ wch: w }));
        XLSX.utils.book_append_sheet(wb, ws1, 'Timeline Chi Tiết');
        const z = Store.ui().zoom, bh = z >= 24 ? 4 : Math.max(1, z), a0 = new Date(res.windowStart); a0.setMinutes(0, 0, 0);
        const s0 = a0.getTime() - (a0.getHours() % bh) * MS_H, buckets = []; for (let t = s0; t < res.windowEnd; t += bh * MS_H) buckets.push(t);
        const grid = tasks.map(t => { const r = res.R.get(t.id); return [t.process, t.taskName, t.assignee, U.fmtDT(r.start), U.fmtDT(r.end), ...buckets.map(b => r.start < b + bh * MS_H && r.end > b ? '■' : '')]; });
        const ws2 = XLSX.utils.aoa_to_sheet([[`GANTT – mỗi ô = ${bh} giờ`], ['', '', '', '', 'Ngày', ...buckets.map(t => U.fmtDate(t))], ['', '', '', '', 'Ca', ...buckets.map(t => 'Ca ' + U.shiftOf(t))], ['Process', 'Task', 'Người thực hiện', 'Bắt đầu', 'Kết thúc', ...buckets.map(t => U.fmtHM(t))], ...grid]);
        ws2['!cols'] = [{ wch: 12 }, { wch: 40 }, { wch: 18 }, { wch: 16 }, { wch: 16 }, ...buckets.map(() => ({ wch: 5.5 }))];
        XLSX.utils.book_append_sheet(wb, ws2, 'Gantt');
        XLSX.writeFile(wb, base + '_Timeline.xlsx'); toast('Đã xuất Excel timeline', 'ok');
      }
    } catch (e) { toast('Không xuất được Excel: ' + e.message, 'err'); }
  },
  template() {
    const sp = samplePlan(), r = Scheduler.schedule(sp);
    const head = ['STT', 'Nhánh', 'Process', 'Task', 'Bắt đầu', 'Kết thúc', 'Khung kế hoạch (giờ)', 'Định mức (giờ)', 'Số lượng', 'Số người', 'Người thực hiện', 'Owner', 'Cách thực hiện', 'Task phụ thuộc', 'Ghi chú'];
    const rows = sp.tasks.map(t => { const x = r.R.get(t.id); return [t.order, t.branch, t.process, t.taskName, U.fmtDT(x.start), U.fmtDT(x.end), t.durationHours, t.standardHours, t.quantity, t.peopleRequired, '', t.owner, EXEC_MODES[t.executionMode], t.dependencyIds.map(d => +d.slice(5)).join(', '), t.notes]; });
    if (window.XLSX) { const wb = XLSX.utils.book_new(), ws = XLSX.utils.aoa_to_sheet([head, ...rows]); ws['!cols'] = [6, 12, 12, 40, 17, 17, 10, 10, 8, 8, 20, 18, 22, 12, 40].map(w => ({ wch: w })); XLSX.utils.book_append_sheet(wb, ws, 'Import'); XLSX.writeFile(wb, 'Mau_Import_Shutdown.xlsx'); }
    else download('Mau_Import_Shutdown.csv', new Blob(['\uFEFF' + [head, ...rows].map(r => r.map(v => /[",\n]/.test(String(v)) ? '"' + String(v).replace(/"/g, '""') + '"' : v).join(',')).join('\r\n')], { type: 'text/csv;charset=utf-8' }));
  },
  /** Mở file backup: chấp nhận .json, file HTML "app kèm dữ liệu", hoặc .txt chứa đoạn đã sao chép */
  async restoreJson(file) {
    try {
      const d = Persist.parseAny(await file.text());
      if (!d) throw new Error('File không chứa dữ liệu kế hoạch.');
      if (!(await confirmBox('Khôi phục dữ liệu', `File có <b>${d.plans.length}</b> kế hoạch. Thay toàn bộ dữ liệu hiện tại?`, 'Khôi phục'))) return;
      Persist.apply(d);
    } catch (e) { toast('Không khôi phục được: ' + e.message, 'err'); }
  },
  stressPlan(n) {
    const procs = [['Nhánh Hạt', 'EXT'], ['Nhánh Hạt', 'IDR'], ['Nhánh Hạt', 'FDR'], ['Nhánh Hạt', 'REIN'], ['Nhánh Hạt', 'DGC Filling'], ['Nhánh Hạt', 'GCH'], ['Nhánh Dịch', 'ADS'], ['Nhánh Dịch', 'REG'], ['Nhánh Dịch', 'EVAP 1'], ['Nhánh Dịch', 'EVAP 2'], ['Nhánh Dịch', 'RO'], ['Nhánh Dịch', 'NSD']];
    const acts = ['Check line', 'CIP', 'LOTO', 'Tháo', 'Vệ sinh', 'Kiểm tra', 'Lắp', 'Leak test', 'Release line'];
    const objs = ['manifold', 'feed tank', 'inter line', 'hopper', 'STRV', 'heater', 'deck', 'filter', 'sàn 0m', 'sàn 6m', 'sàn 12m', 'cyclone', 'bagfilter', 'nozzle', 'băng tải'];
    const durs = [0.5, 0.75, 1, 1.5, 2, 2.5, 3, 4];
    const plan = makePlan({ name: `Kiểm thử ${n} task`, start: defaultSampleStart(), targetHours: 72 });
    const per = Math.ceil(n / procs.length); let k = 0;
    procs.forEach(([b, pr], pi) => {
      for (let i = 0; i < per && k < n; i++) {
        k++; const par = i % 6 === 5;
        plan.tasks.push(normalizeTask({ id: 'TASK-' + String(k).padStart(3, '0'), order: k, branch: b, process: pr, taskName: `${acts[(i + pi) % acts.length]} ${objs[(i * 7 + pi) % objs.length]} ${pr} #${i + 1}`,
          durationHours: durs[(i * 3 + pi) % durs.length], owner: par ? 'Nhà thầu ' + pr : 'OP ' + pr, peopleRequired: 1 + (i % 3),
          executionMode: par ? 'after_dependency' : 'sequential', dependencyIds: par ? ['TASK-' + String(k - 1).padStart(3, '0')] : [], quantity: par ? 4 : 1 }));
      }
    });
    return plan;
  },
};

<script>
(function () {
'use strict';

/* =====================================================================
   A. DANH MỤC PPE
   Hiện dùng danh mục mặc định. Khi bạn mô tả SharePoint list PPE,
   chỉ cần gọi: window.setPPECatalog([{ id, icon, label }, ...])
   ===================================================================== */
const PPE_SOURCE = { name: 'Danh mục mặc định', sharepointListUrl: '' };
let PPE_CATALOG = [
  { id: 'helmet',  icon: '⛑️', label: 'Mũ bảo hộ' },
  { id: 'glasses', icon: '🥽', label: 'Kính bảo hộ' },
  { id: 'gloves',  icon: '🧤', label: 'Găng tay' },
  { id: 'heat',    icon: '🔥', label: 'Bảo hộ chịu nhiệt' },
  { id: 'chem',    icon: '🧪', label: 'Bảo hộ hóa chất' },
  { id: 'boots',   icon: '🥾', label: 'Giày bảo hộ' },
  { id: 'ear',     icon: '🎧', label: 'Nút / chụp tai' },
  { id: 'mask',    icon: '😷', label: 'Khẩu trang / mặt nạ' },
  { id: 'harness', icon: '🪢', label: 'Dây an toàn trên cao' },
  { id: 'loto',    icon: '🔒', label: 'Khóa LOTO cá nhân' },
  { id: 'vest',    icon: '🦺', label: 'Áo phản quang' },
];
let PPE_MAP = new Map(PPE_CATALOG.map(p => [p.id, p]));
const ppeInfo = v => PPE_MAP.get(v) || { id: v, icon: '🛡️', label: v };
window.setPPECatalog = function (list, sourceName) {
  if (!Array.isArray(list) || !list.length) return;
  PPE_CATALOG = list.map(x => ({ id: String(x.id ?? x.label), icon: x.icon || '🛡️', label: String(x.label ?? x.id) }));
  PPE_MAP = new Map(PPE_CATALOG.map(p => [p.id, p]));
  if (sourceName) PPE_SOURCE.name = sourceName;
  if (window.App && App.res) App.renderMain();
};

const Ext = { pending: null, ppeSel: [], meta: new Map(), byId: new Map(), chainFollow: true };
window.ShutdownExt = Ext;

/* =====================================================================
   B. MODEL – thêm trường ppe (mảng) và priority (task ưu tiên)
   ===================================================================== */
const _norm = normalizeTask;
normalizeTask = function (t) {
  const x = _norm(t);
  if (Ext.pending && x.id === Ext.pending.id) Object.assign(x, Ext.pending.vals);
  x.ppe = Array.isArray(x.ppe) ? [...new Set(x.ppe.map(String).filter(Boolean))] : [];
  x.priority = !!x.priority;
  return x;
};

/* =====================================================================
   C. DANH SÁCH DẠNG CÂY – task "chạy sau" 1 task cùng process
      hiện thành NHÁNH CON ngay dưới task đó
   ===================================================================== */
function treeOrder(list) {
  const ids = new Set(list.map(t => t.id)), byId = new Map(list.map(t => [t.id, t]));
  const parentOf = new Map(), kids = new Map();
  for (const t of list) {
    let par = null;
    for (const d of t.dependencyIds) if (ids.has(d) && d !== t.id && (!par || byId.get(d).order > byId.get(par).order)) par = d;
    if (par) { parentOf.set(t.id, par); if (!kids.has(par)) kids.set(par, []); kids.get(par).push(t); }
  }
  const out = [], seen = new Set();
  const walk = (t, depth, isLast, trail) => {
    if (seen.has(t.id)) return; seen.add(t.id);
    const ch = (kids.get(t.id) || []).slice().sort((a, b) => a.order - b.order);
    out.push({ t, depth, isLast, trail, hasKids: ch.length > 0, kidCount: ch.length, parent: parentOf.get(t.id) || null });
    const nextTrail = depth === 0 ? [] : [...trail, !isLast];
    ch.forEach((c, i) => walk(c, depth + 1, i === ch.length - 1, nextTrail));
  };
  list.filter(t => !parentOf.has(t.id)).sort((a, b) => a.order - b.order).forEach(r => walk(r, 0, true, []));
  list.slice().sort((a, b) => a.order - b.order).forEach(t => { if (!seen.has(t.id)) walk(t, 0, true, []); });
  return out;
}

Gantt.buildRows = function () {
  const p = Store.plan(), ui = Store.ui();
  Ext.meta = new Map(); Ext.byId = new Map(p.tasks.map(t => [t.id, t]));
  const vis = p.tasks.filter(t => App.passFilter(t)), branches = new Map();
  for (const t of p.tasks.slice().sort((a, b) => a.order - b.order)) {
    if (!branches.has(t.branch)) branches.set(t.branch, new Map());
    const bm = branches.get(t.branch); if (!bm.has(t.process)) bm.set(t.process, []);
  }
  for (const t of vis) branches.get(t.branch).get(t.process).push(t);
  const rows = [];
  for (const [b, procs] of branches) {
    const all = [...procs.values()].flat(); if (!all.length) continue;
    const bKey = 'B|' + b; rows.push({ type: 'branch', key: bKey, branch: b, tasks: all });
    if (ui.collapsed[bKey]) continue;
    for (const [pr, list] of procs) {
      if (!list.length) continue;
      const pKey = 'P|' + b + '|' + pr; rows.push({ type: 'proc', key: pKey, branch: b, process: pr, tasks: list });
      if (ui.collapsed[pKey]) continue;
      for (const n of treeOrder(list)) { Ext.meta.set(n.t.id, n); rows.push({ type: 'task', key: n.t.id, task: n.t }); }
    }
  }
  this.rows = rows;
  return { rows, visCount: vis.length, total: p.tasks.length };
};

Gantt.taskRow = function (t, g, p) {
  const r = App.res.R.get(t.id), st = STATUS[r.status], fill = processColor(p, t.process);
  const x = g.x(r.start), w = Math.max(3, g.x(r.end) - x), who = t.assignee || '';
  const m = Ext.meta.get(t.id) || { depth: 0, isLast: true, trail: [], hasKids: false, kidCount: 0, parent: null };
  const pri = t.priority || m.hasKids, id = U.esc(t.id);
  const bar = t.durationHours > 0 ? `<div class="bar ${r.critical ? 'crit' : ''} ${r.warn && !r.critical ? 'warn' : ''} ${t.locked ? 'locked' : ''} ${pri ? 'pri' : ''}" data-id="${id}" style="left:${x}px;width:${w}px;background:${fill};--c:${fill}">
      <div class="prog" style="width:${t.progress}%"></div><span class="lbl">${w > 70 ? (pri ? '⚑ ' : '') + U.esc(t.taskName) : ''}</span>${t.locked ? '' : '<div class="handle"></div>'}</div>` : '';
  const msX = t.durationHours > 0 ? g.x(r.end) : x;
  const ms = t.milestone ? `<div class="ms" data-id="${id}" style="left:${msX - 6}px"></div>` : '';
  const outTxt = [w > 70 ? '' : t.taskName, who || t.owner].filter(Boolean).join(' · ');
  // cây nhánh
  const D = Math.min(m.depth, 6), step = 16; let tree = '';
  if (D > 0) {
    let lines = '';
    m.trail.slice(0, D - 1).forEach((on, k) => { if (on) lines += `<b style="left:${k * step + 7}px"></b>`; });
    lines += `<i style="left:${(D - 1) * step + 7}px"></i>`;
    if (!m.isLast) lines += `<b style="left:${(D - 1) * step + 7}px"></b>`;
    tree = `<span class="tree" style="width:${D * step + 4}px;--c:${fill}">${lines}</span>`;
  }
  // chip ưu tiên + phụ thuộc ngoài nhánh
  const ext = t.dependencyIds.filter(d => d !== m.parent).map(d => Ext.byId.get(d)).filter(Boolean);
  let chips = '';
  if (pri) chips += `<span class="chip pri" title="Task ưu tiên – dời task này thì cả nhánh phía sau dời theo">⚑ Ưu tiên${m.kidCount ? ' · ' + m.kidCount + ' nhánh' : ''}</span>`;
  if (ext.length) chips += `<span class="chip" title="Chạy sau: ${U.esc(ext.map(e => e.taskName + ' (' + e.process + ')').join(', '))}">↳ sau #${ext.map(e => e.order).join(', #')}</span>`;
  // PPE
  const pp = t.ppe || [];
  const ppeHtml = `<span class="c-ppe" title="${U.esc(pp.map(v => ppeInfo(v).label).join(', ') || 'Chưa chọn PPE')}">${pp.length ? pp.slice(0, 4).map(v => `<span>${ppeInfo(v).icon}</span>`).join('') + (pp.length > 4 ? `<em>+${pp.length - 4}</em>` : '') : '<span class="ppe-empty">—</span>'}</span>`;
  return `<div class="grow ${App.selectedId === t.id ? 'sel' : ''} ${pri ? 'is-pri' : ''}" data-id="${id}">
    <div class="gleft" data-open="${id}" style="padding-left:36px" title="${U.esc(t.taskName)}">
      <button class="addchild" data-addchild="${id}" title="Thêm task chạy SAU task này (nhánh con)">＋</button>
      <span class="stdot" style="background:${st.color}" title="${st.label}"></span><span class="c-stt">${t.order}</span>${tree}
      <span class="c-name" style="${r.warn ? 'color:#b45309' : ''}"><span class="nm">${U.esc(t.taskName)}</span>${chips}</span>
      ${ppeHtml}
      <span class="c-who ${who ? '' : 'empty'}">${who ? U.esc(who) : 'Chưa phân công'}</span>
      <span class="c-dur">${U.fmtDur(t.durationHours, true)}</span><span class="c-start">${U.fmtDM(r.start)}</span></div>
    <div class="gright">${bar}${ms}<div class="outlbl" style="left:${(t.milestone ? msX + 10 : x + w) + 6}px">${U.esc(outTxt)}</div></div></div>`;
};

/* Vẽ lại Gantt có hiệu ứng: thanh task trượt mượt tới vị trí mới (FLIP) */
const _gRender = Gantt.render.bind(Gantt);
Gantt.render = function () {
  const old = new Map(), oldRows = new Set();
  $$('#gcanvas .bar[data-id]').forEach(b => old.set(b.dataset.id, { l: parseFloat(b.style.left), w: parseFloat(b.style.width) }));
  $$('#gcanvas .grow[data-id]').forEach(r => oldRows.add(r.dataset.id));
  _gRender();
  const h = $('#gcanvas .ghead-left');
  if (h && !h.querySelector('.c-ppe')) { const s = document.createElement('span'); s.className = 'c-ppe'; s.textContent = 'PPE'; h.insertBefore(s, h.querySelector('.c-who')); }
  const lg = $('#legend');
  if (lg) lg.insertAdjacentHTML('beforeend', '<span>⚑ = task ưu tiên · └ = nhánh con · rê chuột vào dòng rồi bấm <b>＋</b> để thêm task chạy sau · kéo task ưu tiên → cả nhánh dời theo</span>');
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  if (old.size) $$('#gcanvas .bar[data-id]').forEach(b => {
    const o = old.get(b.dataset.id); if (!o) return;
    const nl = parseFloat(b.style.left), nw = parseFloat(b.style.width);
    if (Math.abs(o.l - nl) < 1 && Math.abs(o.w - nw) < 1) return;
    b.animate([{ transform: `translateX(${o.l - nl}px)`, width: o.w + 'px' }, { transform: 'translateX(0)', width: nw + 'px' }], { duration: 600, easing: 'cubic-bezier(.22,1.2,.36,1)' });
    b.classList.add('flash'); setTimeout(() => b.classList.remove('flash'), 800);
  });
  if (oldRows.size) $$('#gcanvas .grow[data-id]').forEach(r => {
    if (!oldRows.has(r.dataset.id)) r.animate([{ opacity: 0, transform: 'translateY(-6px)' }, { opacity: 1, transform: 'none' }], { duration: 420, easing: 'ease-out' });
  });
};

/* Nút ＋ trên dòng: thêm task con chạy sau task đó */
document.getElementById('gcanvas').addEventListener('click', e => {
  const b = e.target.closest('[data-addchild]'); if (!b) return;
  e.preventDefault(); e.stopImmediatePropagation(); e.stopPropagation();
  Ext.addChild(b.dataset.addchild);
}, true);
Ext.addChild = function (pid) {
  App.selectedId = pid;
  Drawer.openNew();
  const s = $('#x_after'); if (s) s.value = pid;
  const btn = $('#x_seq button[data-v="after"]'); if (btn) btn.click();
};

/* Tooltip có thêm PPE */
const _tipShow = Tip.show.bind(Tip);
Tip.show = function (id, e) {
  _tipShow(id, e);
  const t = Store.plan().tasks.find(x => x.id === id), tb = $('#tip table');
  if (t && tb && t.ppe && t.ppe.length) {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>PPE</td><td>${t.ppe.map(v => { const i = ppeInfo(v); return i.icon + ' ' + U.esc(i.label); }).join('<br>')}</td>`;
    tb.appendChild(tr);
  }
};

/* =====================================================================
   D. KÉO TASK → CẢ NHÁNH PHÍA SAU DỜI THEO
   ===================================================================== */
const _dStart = Drag.start.bind(Drag), _dMove = Drag.move.bind(Drag), _dEnd = Drag.end.bind(Drag);
Drag.start = function (e) {
  _dStart(e);
  const d = this.active; if (!d || d.mode !== 'move') return;
  d.desc = new Set([...Scheduler.descendants(Store.plan(), d.id)].filter(x => x !== d.id));
  d.chain = [...d.desc].map(id => ({ id, bar: $(`#gcanvas .bar[data-id="${CSS.escape(id)}"]`) })).filter(c => c.bar);
  d.chain.forEach(c => c.bar.classList.add('chain-hl'));
};
Drag.move = function (e) {
  _dMove(e);
  const d = this.active;
  if (d && d.chain && d.moved && d.mode === 'move') {
    const px = d.dh * App.geo.pxH;
    d.chain.forEach(c => c.bar.style.transform = `translateX(${px}px)`);
    if (d.desc.size) $('#tip').insertAdjacentHTML('beforeend', `<div style="margin-top:4px;color:#ffd60a">⤷ ${d.desc.size} task phía sau sẽ dời theo</div>`);
  }
};
Drag.end = function () {
  const d = this.active;
  if (d && d.chain) d.chain.forEach(c => { c.bar.style.transform = ''; c.bar.classList.remove('chain-hl'); });
  if (!d || d.mode !== 'move' || !d.moved || d.dh === 0 || !d.desc || !d.desc.size || !Ext.chainFollow) return _dEnd();
  this.active = null; Tip.hide();
  d.bar.onpointermove = d.bar.onpointerup = d.bar.onpointercancel = null;
  this.justDragged = true; setTimeout(() => this.justDragged = false, 0);
  const P = App.res.P, want = d.r.start + d.dh * MS_H, delta = d.dh;
  const before = new Map([...d.desc].map(id => [id, App.res.R.get(id)?.start]));
  Store.commit('Dời cả nhánh: ' + d.t.taskName, p => {
    const t = p.tasks.find(x => x.id === d.id);
    if (t.executionMode === 'fixed') t.constraintOffsetHours = (want - P) / MS_H;
    else if (want <= d.r.required) { t.constraintType = 'ASAP'; t.constraintOffsetHours = null; }
    else { t.constraintType = 'SNET'; t.constraintOffsetHours = (want - P) / MS_H; }
    for (const x of p.tasks) {
      if (!d.desc.has(x.id) || x.locked || x.executionMode === 'fixed') continue;
      if (x.constraintType === 'SNET' && x.constraintOffsetHours !== null) x.constraintOffsetHours += delta;
    }
  });
  const nr = App.res.R.get(d.id); let n = 0;
  for (const [id, s] of before) { const r = App.res.R.get(id); if (r && s !== undefined && Math.abs(r.start - s) >= MS_MIN) n++; }
  if (nr.start > want + MS_MIN) toast(`Không thể bắt đầu trước ${U.fmtDT(nr.start)} vì phải chờ task trước.`, 'warn');
  else toast(`Đã dời "${d.t.taskName}" → ${U.fmtDT(nr.start)} · ${n} task phía sau dời theo`, 'ok');
};

/* =====================================================================
   E. PANEL THÊM / SỬA TASK – hỏi trình tự rõ ràng + chọn PPE
   ===================================================================== */
const _dRender = Drawer.render.bind(Drawer);
Drawer.render = function (t, isNew) {
  _dRender(t, isNew);
  try { injectDrawer(t, isNew); } catch (err) { console.error(err); }
};
function injectDrawer(t, isNew) {
  const p = Store.plan(), body = $('#drawer .drawer-b'); if (!body) return;
  Ext.ppeSel = [...(t.ppe || [])];
  const blocked = isNew ? new Set() : Scheduler.descendants(p, t.id);
  const cands = p.tasks.filter(x => x.id !== t.id && !blocked.has(x.id)).sort((a, b) => a.order - b.order);
  const groups = new Map();
  cands.forEach(x => { const k = x.branch + ' · ' + x.process; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(x); });
  const deps = t.dependencyIds || [];
  const cur = t.executionMode === 'fixed' ? 'fixed' : (deps.length || t.executionMode === 'after_dependency') ? 'after' : t.executionMode === 'parallel' ? 'start' : 'seq';
  const curDep = deps[deps.length - 1] || '';

  const box = document.createElement('div'); box.className = 'xseq';
  box.innerHTML = `
    <div class="xs-h"><span class="xs-n">1</span> Task này bắt đầu khi nào?</div>
    <div class="segc" id="x_seq">
      <button type="button" data-v="seq"><b>≡</b><span>Nối tiếp</span><small>sau task trước trong cùng process</small></button>
      <button type="button" data-v="after"><b>⤷</b><span>Sau 1 task cụ thể</span><small>tạo nhánh con dưới task đó</small></button>
      <button type="button" data-v="start"><b>▶</b><span>Bắt đầu ngay</span><small>song song từ đầu Shutdown</small></button>
    </div>
    <div class="xs-after hidden" id="x_afterBox">
      <select id="x_after"><option value="">— Chọn task phải XONG trước —</option>${[...groups].map(([k, l]) => `<optgroup label="${U.esc(k)}">${l.map(x => `<option value="${U.esc(x.id)}" ${x.id === curDep ? 'selected' : ''}>#${x.order} · ${U.esc(x.taskName)}</option>`).join('')}</optgroup>`).join('')}</select>
      <div class="xs-flow" id="x_flow"></div>
    </div>
    <div class="xs-fixed hidden" id="x_fixedNote">Task đang ở chế độ <b>Cố định thời điểm</b> – chỉnh trong “Thiết lập nâng cao”.</div>
    <label class="xtog"><input type="checkbox" id="x_pri" ${t.priority ? 'checked' : ''}><span class="sw"></span><span>⚑ <b>Task ưu tiên</b> – dời task này thì cả nhánh phía sau dời theo</span></label>
    <div class="xs-h" style="margin-top:16px"><span class="xs-n">2</span> PPE cần dùng <span class="muted small" style="font-weight:400">· ${U.esc(PPE_SOURCE.name)}</span></div>
    <div class="ppegrid" id="x_ppe"></div>
    <div class="inline" style="margin-top:6px"><input id="x_ppeNew" placeholder="PPE khác… gõ rồi nhấn Enter"></div>`;
  body.insertBefore(box, body.firstChild);

  let mode = cur, lastAfter = curDep;
  const depBox = v => $(`#d_deps input[value="${CSS.escape(v)}"]`);
  const flow = () => {
    const el = $('#x_flow'); if (!el) return;
    const x = p.tasks.find(k => k.id === $('#x_after').value);
    if (mode !== 'after' || !x) { el.innerHTML = '<span class="muted">Chọn task phải hoàn thành trước – task này sẽ hiện thành nhánh con ngay dưới task đó.</span>'; return; }
    const r = App.res.R.get(x.id), lag = U.num($('#d_lag')?.value, 0) * ($('#d_lagU')?.value === 'm' ? 1 / 60 : 1);
    el.innerHTML = `<div class="fl-node" style="--c:${processColor(p, x.process)}">#${x.order} ${U.esc(x.taskName)}<small>${U.esc(x.process)} · xong lúc ${r ? U.fmtDM(r.end) : '–'}</small></div>
      <div class="fl-arrow">⤷</div>
      <div class="fl-node me">${U.esc($('#d_name').value || 'Task này')}<small>bắt đầu sớm nhất ${r ? U.fmtDM(r.end + lag * MS_H) : '–'}</small></div>`;
  };
  const applyAfter = () => {
    const v = $('#x_after').value;
    if (lastAfter && lastAfter !== v) { const o = depBox(lastAfter); if (o) o.checked = false; }
    if (v) {
      const i = depBox(v); if (i) i.checked = true;
      const par = p.tasks.find(k => k.id === v);
      if (isNew && par) { $('#d_process').value = par.process; $('#d_branch').value = par.branch; if (!$('#d_owner').value) $('#d_owner').value = par.owner; }
    }
    lastAfter = v; flow();
  };
  const setMode = v => {
    mode = v;
    $$('#x_seq button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
    $('#x_afterBox').classList.toggle('hidden', v !== 'after');
    $('#x_fixedNote').classList.toggle('hidden', v !== 'fixed');
    $('#x_seq').classList.toggle('hidden', v === 'fixed');
    if (v !== 'fixed') {
      const md = $('#d_mode');
      md.value = v === 'after' ? 'after_dependency' : v === 'start' ? 'parallel' : 'sequential';
      md.dispatchEvent(new Event('change'));
    }
    if (v === 'start') $$('#d_deps input').forEach(i => i.checked = false);
    if (v === 'seq' && lastAfter) { const o = depBox(lastAfter); if (o) o.checked = false; }
    if (v === 'after') applyAfter();
    flow();
  };
  $$('#x_seq button').forEach(b => b.onclick = () => setMode(b.dataset.v));
  $('#x_after').onchange = applyAfter;
  $('#d_name').addEventListener('input', flow);
  $('#d_mode').addEventListener('change', e => {
    const v = e.target.value, want = v === 'fixed' ? 'fixed' : v === 'parallel' ? 'start' : v === 'after_dependency' ? 'after' : 'seq';
    if (want !== mode) { mode = want; $$('#x_seq button').forEach(b => b.classList.toggle('on', b.dataset.v === want)); $('#x_afterBox').classList.toggle('hidden', want !== 'after'); $('#x_fixedNote').classList.toggle('hidden', want !== 'fixed'); $('#x_seq').classList.toggle('hidden', want === 'fixed'); flow(); }
  });

  const drawPPE = () => {
    const all = [...PPE_CATALOG, ...Ext.ppeSel.filter(v => !PPE_MAP.has(v)).map(v => ({ id: v, icon: '🛡️', label: v }))];
    $('#x_ppe').innerHTML = all.map(x => `<button type="button" class="ppe ${Ext.ppeSel.includes(x.id) ? 'on' : ''}" data-ppe="${U.esc(x.id)}" title="${U.esc(x.label)}"><span>${x.icon}</span><small>${U.esc(x.label)}</small></button>`).join('');
  };
  $('#x_ppe').onclick = e => {
    const b = e.target.closest('[data-ppe]'); if (!b) return;
    const v = b.dataset.ppe;
    Ext.ppeSel = Ext.ppeSel.includes(v) ? Ext.ppeSel.filter(x => x !== v) : [...Ext.ppeSel, v];
    b.classList.toggle('on');
    b.animate([{ transform: 'scale(.88)' }, { transform: 'scale(1.06)' }, { transform: 'scale(1)' }], { duration: 380, easing: 'cubic-bezier(.22,1.2,.36,1)' });
  };
  $('#x_ppeNew').onkeydown = e => {
    if (e.key !== 'Enter') return; e.preventDefault();
    const v = e.target.value.trim(); if (v && !Ext.ppeSel.includes(v)) { Ext.ppeSel.push(v); drawPPE(); }
    e.target.value = '';
  };
  drawPPE();
  setMode(cur);
}
const _dSave = Drawer.save.bind(Drawer);
Drawer.save = function () {
  Ext.pending = { id: App.drawerTaskId, vals: { ppe: [...Ext.ppeSel], priority: !!$('#x_pri')?.checked } };
  try { return _dSave(); } finally { Ext.pending = null; }
};

/* =====================================================================
   F. HIỆU ỨNG CHUYỂN MÀN HÌNH + XUẤT EXCEL CÓ CỘT PPE
   ===================================================================== */
const _sv = App.switchView.bind(App);
App.switchView = function (v) {
  const prev = this.view; _sv(v);
  if (prev === v) return;
  const el = $(v === 'home' ? '#viewHome' : v === 'gantt' ? '#viewGantt' : '#viewDash');
  if (el && el.animate) el.animate([{ opacity: 0, transform: 'translateY(10px) scale(.99)' }, { opacity: 1, transform: 'none' }], { duration: 440, easing: 'cubic-bezier(.2,.8,.2,1)' });
};
if (!EXPORT_HEAD.includes('PPE')) EXPORT_HEAD.push('PPE');
const _tRows = IO.tableRows.bind(IO);
IO.tableRows = function (plan, res, asText) {
  const byId = new Map(plan.tasks.map(t => [t.id, t]));
  return _tRows(plan, res, asText).map(r => [...r, (byId.get(r[1])?.ppe || []).map(v => ppeInfo(v).label).join(', ')]);
};
})();
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ===== KẾT NỐI SUPABASE ===== */
const SUPABASE_URL = "https://vetbxnrkfgxrgsnribwe.supabase.co";
const SUPABASE_KEY = "sb_publishable_RJdYFvL3wniwLQ9iOp11zg_AcBFeQ-n";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const CLIENT_ID = (typeof U !== 'undefined' && U.uid) ? U.uid() : ('c' + Date.now() + Math.random().toString(36).slice(2));
let lastCloudAt = 0, cloudTimer;

function cloudToast(msg, type) {
  if (typeof toast === 'function') toast(msg, type);
  else console.log(msg);
}

/* Nạp dữ liệu chung từ cloud */
async function cloudLoad() {
  const { data, error } = await sb
    .from('planner_state')
    .select('data')
    .eq('id', 1)
    .maybeSingle();

  if (error) {
    console.error('Supabase error:', error);
    cloudToast('Không kết nối được cloud: ' + error.message, 'err');
    return;
  }

  const d = data && data.data;
  if (d && Array.isArray(d.plans) && d.plans.length) applyCloud(d);
  else cloudSave(); // lần đầu: đẩy dữ liệu máy mình lên cloud
  console.log('Supabase connected');
}

/* Áp dữ liệu cloud vào app */
function applyCloud(d) {
  lastCloudAt = d.savedAt || 0;
  const clean = Store.sanitize({
    plans: d.plans,
    activePlanId: Store.state.activePlanId,
    ui: Store.state.ui
  });
  Store.state.plans = clean.plans;
  Store.state.activePlanId = clean.activePlanId;
  App.recompute();
  App.render();
}

/* Lưu lên cloud (gom thay đổi trong 0.8 giây) */
function cloudSave() {
  clearTimeout(cloudTimer);
  cloudTimer = setTimeout(async () => {
    const payload = { plans: Store.state.plans, savedAt: Date.now(), by: CLIENT_ID };
    lastCloudAt = payload.savedAt;
    const { error } = await sb
      .from('planner_state')
      .upsert({ id: 1, data: payload, updated_at: new Date().toISOString() });
    if (error) {
      console.error('Save error:', error);
      cloudToast('Lưu cloud lỗi: ' + error.message, 'err');
    }
  }, 800);
}

/* Mỗi lần app tự lưu -> lưu luôn lên cloud */
const _flush = Store.flush.bind(Store);
Store.flush = function () { _flush(); cloudSave(); };

/* Người khác sửa -> máy mình tự cập nhật */
sb.channel('planner')
  .on('postgres_changes',
      { event: '*', schema: 'public', table: 'planner_state' },
      p => {
        const d = p.new && p.new.data;
        if (!d || d.by === CLIENT_ID || (d.savedAt || 0) <= lastCloudAt) return;
        if (typeof Drag !== 'undefined' && Drag.active) return;
        applyCloud(d);
        cloudToast('Kế hoạch vừa được người khác cập nhật', 'ok');
      })
  .subscribe();

/* Chạy khi mở trang */
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', cloudLoad);
} else {
  cloudLoad();
}
</script>
