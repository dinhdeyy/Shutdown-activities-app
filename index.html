      ${WR.prioDraft.map((id, i) => { const t = p.tasks.find(x => x.id === id); return `<div class="wr-prio"><b>${i + 1}</b><span>#${t.order} ${esc(t.taskName)} <span class="muted small">· ${esc(t.process)} · ${U.fmtDur(t.durationHours)}</span>${t.wr.prio == null ? ' <span class="wr-pill w">chưa xếp</span>' : ''}</span>
        <button class="btn sm" data-up="${i}" ${i ? '' : 'disabled'}>▲</button><button class="btn sm" data-down="${i}" ${i < WR.prioDraft.length - 1 ? '' : 'disabled'}>▼</button></div>`; }).join('')}
      <div style="margin-top:8px"><button class="btn primary sm" data-wr="prio">Lưu thứ tự ưu tiên</button></div></section>` : ''}`;
}
WR.open = function () {
  onlyMode('wr-mode'); Drawer.close(); closeModal();
  document.body.classList.add('wr-mode'); $('#wrView').classList.remove('hidden');
  if (location.hash !== '#wr') history.replaceState(null, '', '#wr');
  if (!findP(WR.planId)) { const a = findP(Store.state.activePlanId); WR.planId = a && a.wr ? a.id : ((plans().filter(x => x.wr).slice(-1)[0] || {}).id || null); }
  WR.render();
};
WR.close = function () { document.body.classList.remove('wr-mode'); $('#wrView').classList.add('hidden'); history.replaceState(null, '', location.pathname + location.search); App.render(); };

function bindView(v) {
  v.addEventListener('click', async e => {
    if (e.target.closest('[data-dl]')) { WR.dlDone = true; setTimeout(() => WR.render(), 300); return; }
    const a = e.target.closest('[data-wr]');
    if (a) {
      const k = a.dataset.wr;
      if (k === 'back') return WR.close();
      if (k === 'dl') { e.preventDefault(); return downloadTemplate(); }
      if (k === 'login') { const b = $('#auBadge'); if (b) b.click(); return; }
      if (k === 'op') { WR.close(); return window.OperatorView && OperatorView.open(); }
      if (k === 'admin') { WR.close(); return window.AdminView && AdminView.open(); }
      if (k === 'clear') { WR.data = null; WR.form.start = ''; return WR.render(); }
      if (k === 'create') return createPlan();
      if (k === 'ldc') { if (await LDC.askUpload('Upload lịch đi ca (LDC)')) WR.render(); return; }
      if (needLogin()) return;
      if (k === 'acceptall') return acceptAll(WR.planId);
      if (k === 'pub') return publish(WR.planId, true);
      if (k === 'unpub') return publish(WR.planId, false);
      if (k === 'prio') return savePrio(WR.planId);
      if (k === 'open') { Store.state.activePlanId = WR.planId; WR.close(); App.openPlan(WR.planId); return; }
    }
    const ok = e.target.closest('[data-ok]'); if (ok) { if (!needLogin()) applySeq(WR.planId, ok.dataset.ok, 'seq'); return; }
    const ed = e.target.closest('[data-edit]'); if (ed) return editTask(WR.planId, ed.dataset.edit);
    const up = e.target.closest('[data-up]'), dn = e.target.closest('[data-down]');
    if (up || dn) { const i = +(up || dn).dataset[up ? 'up' : 'down'], j = up ? i - 1 : i + 1, l = WR.prioDraft; [l[i], l[j]] = [l[j], l[i]]; WR.render(); }
  });
  v.addEventListener('change', async e => {
    const id = e.target.id;
    if (id === 'wrFile') {
      const f = e.target.files[0]; if (!f) return;
      if (!window.XLSX) { toast('Chưa tải được thư viện Excel (SheetJS).', 'err'); return; }
      try { WR.data = parseWB(XLSX.read(await f.arrayBuffer(), { type: 'array' }), f.name); WR.form.start = ''; if (!WR.data.rows.length) toast('File không có dòng công việc nào.', 'warn'); }
      catch (err) { console.error(err); toast('Không đọc được file: ' + err.message, 'err'); WR.data = null; }
      return WR.render();
    }
    if (id === 'wrPlan') { WR.planId = e.target.value || null; WR.prioDraft = null; return WR.render(); }
    if (id === 'wrOnly') { WR.onlyMiss = e.target.checked; return WR.render(); }
    if (e.target.dataset.seq) { if (needLogin()) return WR.render(); if (e.target.value) applySeq(WR.planId, e.target.dataset.seq, e.target.value); }
  });
  v.addEventListener('input', e => {
    if (e.target.id === 'wrName') WR.form.name = e.target.value;
    if (e.target.id === 'wrStart') WR.form.start = e.target.value;
    if (e.target.id === 'wrTarget') WR.form.target = e.target.value;
  });
}

/* =====================================================================
   6. CA TRỰC: hiển thị yêu cầu, tick PPE, cổng "Chuẩn bị → Bắt đầu → Đóng"
   ===================================================================== */
const evOf = t => (Array.isArray(t.evidence) && t.evidence.length ? t.evidence : [{ id: 'done', label: 'Ảnh xác nhận hoàn thành', min: 1 }]);
const proofs = (t, id) => ((t.proofs || {})[id] || []);
const chk = (t, k, x) => { const c = t.wrChecks && t.wrChecks[k]; return x === undefined ? c || null : c && c[x] || null; };
function gate(t) {
  const pre = evOf(t).filter(e => String(e.id).startsWith('pre:')), ppe = [];
  let missing = 0;
  pre.forEach(e => missing += Math.max(0, Math.max(1, e.min || 1) - proofs(t, e.id).length));
  ppe.forEach(x => { if (!chk(t, 'ppe', x)) missing++; });
  return { has: !!(pre.length || ppe.length), missing, preOk: missing === 0, started: !!t.startedAt || t.progress >= 100 };
}
function decorate(s) {
  const b = s && document.body.contains(s.m) && $('#opSheetB', s.m); if (!b || b.querySelector('#wrOpBox')) return;
  const p = findP(s.planId), t = p && p.tasks.find(x => x.id === s.taskId); if (!t || !t.wr) return;
  const sf = t.wr.safety || {}, need = YES(sf.need), g = gate(t), pts = lotoOn(sf) ? (t.wr.points || []) : [];
  const box = document.createElement('div'); box.id = 'wrOpBox'; box.className = 'wr-opbox';
  box.innerHTML = `${t.wr.desc ? `<div class="wr-desc">📝 ${esc(t.wr.desc)}</div>` : ''}
    <div class="wr-tags">${tagsOf(rowOf(t))}</div>
    ${need && lotoOn(sf) ? `<div class="wr-sub">WI LOTO: <b>${esc(sf.wiLoto || '—')}</b></div>` : ''}
    ${pts.length ? `<table class="wr-pt"><tr><th>#</th><th>Năng lượng</th><th>Điểm khóa</th></tr>${pts.map(x => `<tr><td>${x.stt}</td><td>${esc(x.energy)}</td><td>${esc(x.point)}</td></tr>`).join('')}</table>` : ''}
    
    ${g.has ? `<div class="wr-gate ${g.started ? 'ok' : g.preOk ? 'ready' : ''}">${g.started ? `▶ Đã bắt đầu${t.startedAt ? ' lúc ' + U.fmtDM(t.startedAt) : ''}${t.startedBy ? ' – ' + esc(t.startedBy) : ''}`
      : g.preOk ? '<button type="button" class="op-close" data-wrstart>▶ Bắt đầu công việc</button>' : `🔒 Còn ${g.missing} ảnh chuẩn bị 🟡 – chụp đủ mới bấm “Bắt đầu” được.`}</div>` : ''}`;
  const info = b.querySelector('.op-info'); if (info) info.after(box); else b.prepend(box);
  if (g.has && !g.started) {
    $$('.op-req', b).forEach(r => { const i = r.querySelector('input[data-req]'); if (i && !String(i.dataset.req).startsWith('pre:')) { r.classList.add('wr-locked'); $$('input', r).forEach(x => x.disabled = true); } });
    const dn = $('#opDone', s.m); if (dn) { dn.disabled = true; dn.textContent = g.preOk ? '▶ Bấm "Bắt đầu công việc" trước' : '🔒 Hoàn tất bước chuẩn bị trước'; }
  }
  box.onclick = e => {
    const nm = opName(), pp = e.target.closest('[data-wrppe]'), stt = e.target.closest('[data-wrstart]');
    if (!pp && !stt) return;
    if (!nm) { toast('Nhập tên trước (nút 👤).', 'warn'); return; }
    if (pp) commitTask(s.planId, t.id, 'Tick PPE', tk => { const w = tk.wrChecks = { ...(tk.wrChecks || {}) }; w.ppe = { ...(w.ppe || {}) }; const x = pp.dataset.wrppe; if (w.ppe[x]) delete w.ppe[x]; else w.ppe[x] = { by: nm, at: Date.now() }; });
    if (stt) commitTask(s.planId, t.id, 'Bắt đầu công việc', tk => { if (!gate(tk).preOk) return false; tk.startedAt = Date.now(); tk.startedBy = nm; tk.progress = Math.max(tk.progress || 0, 10); });
  };
}
function installOp() {
  const O = window.OperatorView; if (!O) return;
  const _r = O.render;
  O.render = function (...a) {
    _r.apply(this, a);
    try {
      const p = findP(O.planId), v = $('#opView');
      if (p && p.wr && p.wr.status !== 'published' && v && !v.querySelector('.wr-opdraft')) {
        const d = document.createElement('div'); d.className = 'wr-opdraft'; d.textContent = '⚠ Kế hoạch đang NHÁP – chưa phát hành cho ca trực, nội dung có thể thay đổi.';
        const h = v.querySelector('.op-h'); h ? h.after(d) : v.prepend(d);
      }
    } catch (e) { console.warn(e); }
  };
  const _o = O.openTask;
  O.openTask = function (...a) {
    _o.apply(this, a);
    const s = O.sheet, b = s && $('#opSheetB', s.m); if (!b) return;
    new MutationObserver(() => decorate(O.sheet)).observe(b, { childList: true });
    decorate(s);
  };
}

/* =====================================================================
   7. ADMIN: thẻ "LOTO đang treo" + tình trạng Work Request
   ===================================================================== */
function installAdmin() {
  const A = window.AdminView; if (!A) return;
  const _r = A.render;
  A.render = function (...a) {
    _r.apply(this, a);
    try {
      const p = findP(A.planId), col = $('#adView .ad-grid > div:last-child'); if (!p || !p.wr || !col) return;
      const hang = p.tasks.filter(t => t.wr && lotoOn(t.wr.safety) && evOf(t).some(e => String(e.id).startsWith('pre:loto') && proofs(t, e.id).length) && !proofs(t, 'end:loto').length);
      const st = planStats(p), card = document.createElement('div'); card.className = 'ad-card';
      card.innerHTML = `<h4>🔒 LOTO đang treo <span class="muted small" style="font-weight:400">· ${hang.length} thiết bị</span></h4>
        ${hang.map(t => { const ps = evOf(t).filter(e => String(e.id).startsWith('pre:loto')).flatMap(e => proofs(t, e.id)).sort((x, y) => x.at - y.at)[0];
          return `<div class="wr-hang"><span><b>${esc(t.wr.equip || t.taskName)}</b><br><span class="muted">#${t.order} ${esc(t.taskName)}</span></span><span class="muted" style="text-align:right">${esc(ps ? ps.by : '')}<br>${ps ? U.fmtDM(ps.at) : ''}</span></div>`; }).join('') || '<div class="ad-empty">Không có LOTO nào đang treo.</div>'}
        <div class="small muted" style="margin-top:6px">Work Request: ${p.wr.status === 'published' ? '✓ đã phát hành' : 'nháp'}${st.e ? ` · ❌ ${st.e} thiếu thông tin` : ''}${st.seq ? ` · ⚠ ${st.seq} chưa sắp` : ''}</div>`;
      col.prepend(card);
    } catch (e) { console.warn(e); }
  };
}

/* =====================================================================
   8. CÀI ĐẶT
   ===================================================================== */
function topBtn() {
  const b = $('#wrTop'); if (!b) return;
  const p = findP(Store.state.activePlanId), st = p && p.wr ? planStats(p) : null, n = st ? st.e + st.seq + st.prio : 0;
  b.textContent = '📥 Work Request' + (n ? ' · ' + n + '⚠' : ''); b.classList.toggle('has', !!n);
}
const MODES = { 'op-mode': '#opView', 'admin-mode': '#adView', 'wr-mode': '#wrView' };
function onlyMode(keep) {
  for (const [cls, sel] of Object.entries(MODES)) {
    if (cls === keep) continue;
    document.body.classList.remove(cls);
    const el = $(sel); if (el) el.classList.add('hidden');
  }
}
function fixModes() {
  const wrap = (obj, fn, cls) => { if (!obj || !obj[fn]) return; const o = obj[fn]; obj[fn] = function (...a) { onlyMode(cls); return o.apply(this, a); }; };
  wrap(window.OperatorView, 'open', 'op-mode');
  wrap(window.AdminView, 'open', 'admin-mode');
  /* Mở Planner từ trang Ca trực / Admin: trả về đúng màn hình Planner */
  const back = (obj) => { if (!obj || !obj.close) return; const o = obj.close; obj.close = function (...a) { const r = o.apply(this, a); onlyMode(''); return r; }; };
  back(window.OperatorView); back(window.AdminView);
}
/* Trang chủ: "+ Tạo kế hoạch mới" đi theo luồng Work Request */
function fixHome() {
  const _hr = Home.render.bind(Home);
  Home.render = function () {
    _hr();
    const go = () => WR.open();
    ['#hNew', '#hNew2'].forEach(s => { const b = $(s); if (b) b.onclick = go; });
    const n2 = $('#hNew2'); if (n2) n2.innerHTML = '+ Tạo kế hoạch mới<span>Theo Work Request: tải form → điền yêu cầu → upload → sắp thứ tự → phát hành</span>';
    const h = $('#viewHome .home-h');
    if (h && !h.querySelector('#hTpl') && !(window.Auth && !Auth.ok)) {
      const b = document.createElement('button'); b.className = 'btn'; b.id = 'hTpl'; b.textContent = 'Tạo nhanh từ bộ task mẫu';
      b.onclick = () => Home.wizard(); h.appendChild(b);
    }
  };
}
function install() {
  const v = document.createElement('div'); v.id = 'wrView'; v.className = 'hidden'; document.body.appendChild(v); bindView(v);
  const sp = $('.topbar .spacer');
  if (sp) { const b = document.createElement('button'); b.className = 'tb-btn wr-top'; b.id = 'wrTop'; b.onclick = () => WR.open(); sp.parentNode.insertBefore(b, sp); }
  const _ar = App.render.bind(App);
  App.render = function () { _ar(); topBtn(); const ae = document.activeElement; if (!(ae && ae.closest && ae.closest('#wrView') && /INPUT|TEXTAREA/.test(ae.tagName))) WR.render(); };
  installOp(); installAdmin(); fixModes(); fixHome(); topBtn();
  if (App.view === 'home') Home.render();
  window.addEventListener('hashchange', () => { if (location.hash === '#wr') WR.open(); });
  if (location.hash === '#wr') WR.open();
  else if (location.hash === '#admin' && window.AdminView && document.body.classList.contains('admin-mode')) onlyMode('admin-mode');
}
WR._test = { parseWB, issuesOf, evidenceFor, ppeItems };
document.addEventListener('DOMContentLoaded', () => setTimeout(install, 30));
} catch (err) { console.error('[Work Request] lỗi gói:', err); }
})();

<script>
(function () {
'use strict';
function boot() {
try {
const WR = window.WorkRequest;
if (!WR || !WR._test) { console.warn('[WR v4] Chưa có module Work Request cũ.'); return; }
const { issuesOf, evidenceFor, ppeItems } = WR._test;
const esc = s => U.esc(s ?? '');
const N = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[đĐ]/g, 'd').toLowerCase().replace(/\s+/g, ' ').trim();
const YES = v => ['co', 'yes', 'x', 'true', '1'].includes(N(v));

/* ---------- tiện ích ---------- */
function parsePts(str) {
  return String(str || '').split(/[;\n]+/).map(x => x.trim()).filter(Boolean).map((x, i) => {
    const k = x.indexOf(':'); return k > 0 ? { stt: i + 1, energy: x.slice(0, k).trim(), point: x.slice(k + 1).trim() } : { stt: i + 1, energy: '', point: x };
  });
}
function metaStart(s) {
  const m = /^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})(?:\s+(\d{1,2}):(\d{2}))?/.exec(String(s || '').trim());
  if (!m) return '';
  const p = n => String(n).padStart(2, '0');
  return `${m[3]}-${p(m[2])}-${p(m[1])}T${p(m[4] || 6)}:${p(m[5] || 0)}`;
}
function defStart() { const d = new Date(); d.setDate(d.getDate() + 1); d.setHours(6, 0, 0, 0); return U.toLocalISO(d.getTime()).slice(0, 16); }
const ptwOf = s => (s && YES(s.need) && s.ptw && !isNo(s.ptw)) ? s.ptw : '';

function tags(r) {

  o.push(`<span class="ph">📷 ${esc(ph.done || 1)} ảnh HT</span>`);
  if (!YES(s.need)) o.push('<span style="background:rgba(120,120,128,.14);color:var(--muted)">Không YC an toàn</span>');
  else [s.mode, lotoOn(s) ? '🔒 ' + (s.wiLoto || 'LOTO') : '', ptwOf(s) ? '📄 ' + ptwOf(s) : '', YES(s.risk) ? '⚠ Tiên đoán RR' : '', s.ppe && !isNo(s.ppe) ? '🦺 ' + s.ppe : '']
    .filter(Boolean).forEach(x => o.push(`<span>${esc(x)}</span>`));
  return o.join('');
}
/** Nguồn task: 'file' (Work Request) | 'tpl' (bộ task mẫu) | null */
function source() {
  if (WR.data && WR.data.rows.length) return 'file';
  if (S.mode === 'auto' && S.useTpl) return 'tpl';
  return null;
}
const manual = () => S.mode === 'custom' && S.cfg.order === 'manual';

/* ---------- xếp thứ tự ---------- */
function buildOrder(rows) {
  const groups = new Map();
  rows.forEach((r, i) => { const k = r.process || 'Chung'; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(i); });
  const out = [];
  for (const [proc, list] of groups) {
    const sorted = manual()
      ? list.slice().sort((a, b) => RANK[priOf(rows[a], a)] - RANK[priOf(rows[b], b)] || a - b)
      : list.slice().sort((a, b) => (rows[a].kind === 'extra') - (rows[b].kind === 'extra') || a - b);
    sorted.forEach(i => {
      let seq = 'seq';
      if (manual()) seq = S.seq[i] || 'seq';
      else if (S.mode === 'custom' && S.cfg.extra === 'parallel' && rows[i].kind === 'extra') seq = 'start';
      out.push({ i, proc, seq });
    });
  }
  return out;
}
function hasCycle(rows) {
  const dep = i => { const v = S.seq[i] || ''; return v.startsWith('after:') ? +v.slice(6) : null; };
  for (let i = 0; i < rows.length; i++) { const seen = new Set([i]); let j = dep(i); while (j != null) { if (seen.has(j)) return true; seen.add(j); j = dep(j); } }
  return false;
}

<script>

/* Nạp dữ liệu chung từ cloud */
async function cloudLoad() {
  const { data, error } = await sb
    .from('planner_state')
    .select('data')
    .eq('id', 1)
    .maybeSingle();

  if (error) {
    console.error('Supabase error:', error);
    cloudToast('Không kết nối được cloud: ' + error.message, 'err');
    return;
  }

  const d = data && data.data;
  if (d && Array.isArray(d.plans) && d.plans.length) applyCloud(d);
  else cloudSave(); // lần đầu: đẩy dữ liệu máy mình lên cloud
  console.log('Supabase connected');
}

/* Áp dữ liệu cloud vào app */
function applyCloud(d) {
  lastCloudAt = d.savedAt || 0;
  const clean = Store.sanitize({
    plans: d.plans,
    activePlanId: Store.state.activePlanId,
    ui: Store.state.ui
  });
  Store.state.plans = clean.plans;
  Store.state.activePlanId = clean.activePlanId;
  App.recompute();
  App.render();
}

/* Lưu lên cloud (gom thay đổi trong 0.8 giây) */
function cloudSave() {
  clearTimeout(cloudTimer);

    const payload = { plans: Store.state.plans, savedAt: Date.now(), by: CLIENT_ID };
    lastCloudAt = payload.savedAt;
    const { error } = await sb
      .from('planner_state')
      .upsert({ id: 1, data: payload, updated_at: new Date().toISOString() });

/* Người khác sửa -> máy mình tự cập nhật */
sb.channel('planner')
  .on('postgres_changes',
      { event: '*', schema: 'public', table: 'planner_state' },
      p => {
        const d = p.new && p.new.data;

<script>
(function () {

const PHASES = ['1. Dừng máy & CIP đầu', '2. LOTO & tháo', '3. Vệ sinh / CIP', '4. Lắp line & Leak test', '5. Release & Startup'];
const N = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[đĐ]/g, 'd').toLowerCase().replace(/\s+/g, ' ').trim();
const YES = v => ['co', 'yes', 'x', 'true', '1'].includes(N(v));

/* ---- Bắt workbook vừa upload để đọc thêm 3 cột tím ---- */
let lastWB = null;
function wrapXLSX() {
  if (!window.XLSX || XLSX.__w5) return;
  const r = XLSX.read; XLSX.read = function (...a) { const wb = r.apply(this, a); lastWB = wb; return wb; }; XLSX.__w5 = true;
}
document.addEventListener('change', e => { if (e.target && e.target.id === 'wrFile') wrapXLSX(); }, true);
document.addEventListener('click', e => { if (e.target && e.target.closest && e.target.closest('label.w4-drop')) wrapXLSX(); }, true);

function boot() {
try {
const WR = window.WorkRequest;
if (!WR || !WR._test || !WR.setup) { console.warn('[WR v5] Cần khối Work Request cũ + WR v4 trước khối này.'); return; }
wrapXLSX();
const { issuesOf, evidenceFor, ppeItems } = WR._test;
const S = WR.setup;
if (!S.cfg.order || S.cfg.order === 'manual') S.cfg.order = 'file';

const ro = () => !!(window.Auth && !Auth.ok);
const hasLDC = () => typeof LDC !== 'undefined' && !!LDC.data;

/* ---------- đọc thêm Giai đoạn / Song song / Bổ sung A-B ---------- */
let enriched = null;
function enrich() {
  const d = WR.data; if (!d || enriched === d) return;
  enriched = d; d.hasPhase = false;
  try {
    const wb = lastWB; if (!wb) throw 0;
    const sn = wb.SheetNames.find(x => N(x) === 'work request') || wb.SheetNames[0];
    const T = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, raw: false, defval: '' });
    const hi = T.findIndex(r => (r || []).some(c => N(c).startsWith('ten cong viec'))); if (hi < 0) throw 0;
    const H = T[hi].map(c => N(String(c).split('\n')[0]));
    const cPh = H.findIndex(h => h.startsWith('giai doan')), cPar = H.findIndex(h => h.startsWith('song song')), cK = H.findIndex(h => h.startsWith('loai cong viec'));
    d.hasPhase = cPh >= 0;
    d.rows.forEach(r => {
      const R = T[r.line - 1] || [];
      const m = /(\d)/.exec(String(cPh >= 0 ? R[cPh] : '')); r.phase = m ? Math.min(5, Math.max(1, +m[1])) : 0;
      r.par = cPar >= 0 && YES(R[cPar]);
      const k = N(cK >= 0 ? R[cK] : '');
      r.sub = r.kind === 'extra' ? (/\bb$/.test(k) ? 'B' : 'A') : '';
    });
  } catch (e) { d.rows.forEach(r => { r.phase = r.phase || 0; r.par = !!r.par; r.sub = r.kind === 'extra' ? (r.sub || 'A') : ''; }); }

const kRank = r => r.kind === 'extra' ? (r.sub === 'B' ? 2 : 1) : 0;
const ph = r => r.phase || (WR.data && WR.data.hasPhase ? 3 : 1);

/* ---------- XẾP LỊCH: nhóm theo process → (Loại, Giai đoạn, thứ tự dòng) → nhóm song song ---------- */
function buildPlan(rows) {
  const byP = new Map();
  rows.forEach((r, i) => { const k = r.process || 'Chung'; if (!byP.has(k)) byP.set(k, []); byP.get(k).push(i); });
  const out = [];
  const chain = (list, proc) => {
    let prev = [], cur = [], gid = 0;
    list.forEach((i, k) => {
      const r = rows[i], p = k ? rows[list[k - 1]] : null;
      const join = k > 0 && r.par && ph(r) === ph(p) && kRank(r) === kRank(p);
      if (!join) { prev = cur; cur = []; gid++; }
      cur.push(i); out.push({ i, proc, deps: prev.slice(), gid, join });
    });
  };
  for (const [proc, list] of byP) {
    const sorted = list.slice().sort((a, b) => kRank(rows[a]) - kRank(rows[b]) || ph(rows[a]) - ph(rows[b]) || a - b);
    if (S.mode === 'custom' && S.cfg.extra === 'parallel') {

      chain(sorted.filter(i => rows[i].kind === 'extra'), proc);

        <small>Xếp theo 3 cột tím trong file: <b>Giai đoạn</b> 1→5, <b>Song song</b> với task trên, <b>Bắt buộc</b> trước – Bổ sung A – Bổ sung B. Tự gán người theo lịch đi ca. Chưa có file thì dùng bộ task mẫu.</small></span></button>
      <button class="w4-opt ${S.mode === 'custom' ? 'on' : ''}" data-w5="mode" data-v="custom"><span class="ic">🛠</span><span><b>Tinh chỉnh riêng</b>
        <small>Chỉnh Giai đoạn / Song song ngay trên web, chọn cách xếp việc bổ sung và cách gán người.</small></span></button>
    </div></section>`;
}
function stepFiles(d, src) {
  const sel = (k, opts) => `<select data-c5="${k}">${opts.map(([v, l]) => `<option value="${v}" ${S.cfg[k] === v ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
  const ne = d ? d.rows.filter(r => issuesOf(r).e.length).length : 0;
  return `<section class="w4-card ${src ? 'done' : ''}"><h4><span class="w4-n">2</span> Thông tin & tải file</h4>
    <div class="w4-info">
      <label>Tên kế hoạch<input id="wrName" value="${esc(WR.form.name)}" placeholder="${esc(d ? (d.meta.name || d.fileName.replace(/\.\w+$/, '')) : 'Shutdown ...')}"></label>
      <label>Bắt đầu Shutdown<input id="wrStart" type="datetime-local" value="${esc(WR.form.start)}"></label>
      <label>Mục tiêu (giờ)<input id="wrTarget" type="number" min="1" value="${esc(WR.form.target)}"></label></div>
    ${S.mode === 'custom' ? `<div class="w4-cfg"><div class="t">🛠 Yêu cầu setup riêng</div>
      <label>Thứ tự task${sel('order', [['file', 'Theo Giai đoạn & Song song trong file'], ['web', 'Chỉnh Giai đoạn / Song song trên web']])}</label>
      <label>Việc bổ sung${sel('extra', [['after', 'Làm sau việc bắt buộc'], ['parallel', 'Chạy song song từ đầu']])}</label>
      <label>Gán người${sel('assign', [['ldc', 'Tự gán theo lịch đi ca'], ['none', 'Để trống – gán sau']])}</label>
      <label>Khi thiếu người${sel('hc', [['no', 'Chỉ người đúng team'], ['yes', 'Cho phép team HC']])}</label></div>` : ''}
    <div class="w4-files">
      <div class="w4-file ${hasLDC() ? 'ok' : ''}"><h5>👥 Lịch đi ca (LDC)<em>${S.mode === 'custom' && S.cfg.assign === 'none' ? 'không cần' : 'để tự gán người'}</em></h5>

        <p>${d ? `✅ ${esc(d.fileName)} · ${d.rows.length} task${ne ? ` · <span style="color:#b91c1c">❌ ${ne} thiếu thông tin</span>` : ''}${d.hasPhase ? '' : ' · <span style="color:#b45309">file cũ – không có cột Giai đoạn, xếp nối tiếp</span>'}` : 'Tải form mẫu (đã có sẵn task), chỉnh nếu cần rồi upload lại.'}</p>
        <div class="w4-acts"><a class="btn sm" href="Mau_Work_Request.xlsx" download="Mau_Work_Request.xlsx">⬇ Tải form mẫu</a>
          <label class="w4-drop"><input type="file" id="wrFile" accept=".xlsx,.xlsm,.xls">📤 ${d ? 'Đổi file' : 'Upload file đã điền'}</label>
          ${d ? '<button class="btn sm" data-wr="clear">Bỏ file</button>' : ''}</div>
        ${S.mode === 'auto' && !d ? `<label class="w4-tpl"><input type="checkbox" id="w5Tpl" ${S.useTpl ? 'checked' : ''}> Chưa có file – dùng <b>bộ task mẫu (14 task)</b></label>` : ''}</div>
    </div></section>`;
}
function previewFile(d) {
  const P = buildPlan(d.rows), byP = new Map();
  P.forEach(o => { if (!byP.has(o.proc)) byP.set(o.proc, []); byP.get(o.proc).push(o); });
  const unset = d.hasPhase ? d.rows.filter(r => !r.phase).length : 0;
  let html = `<section class="w4-card"><h4><span class="w4-n">3</span> ${webEdit() ? 'Chỉnh Giai đoạn & Song song' : 'Xem trước thứ tự'}
      <span class="muted small" style="font-weight:400">· các process chạy song song · trong 1 process: nhóm trên xong → nhóm dưới · <b>‖</b> = chạy cùng lúc</span></h4>
    ${unset ? `<div class="w4-tpl" style="background:rgba(245,158,11,.16)">⚠ ${unset} task chưa chọn Giai đoạn → tạm xếp vào GĐ 3</div>` : ''}`;
  for (const [proc, list] of byP) {
    html += `<div class="w4-proc"><i style="background:${processColor(null, proc)}"></i>${esc(proc)} <span class="muted small">· ${list.length} task · ${U.fmtDur(list.reduce((s, o) => s + (d.rows[o.i].dur || 0), 0))} tổng công</span></div>`;
    if (webEdit()) {
      html += list.map((o, k) => { const r = d.rows[o.i];
        return `<div class="w5-edit ${d.hasPhase && !r.phase ? 'unset' : ''}"><div><b>${esc(r.name)}</b> ${badges(r)}<div class="w5-t sub">${r.dur || '–'}h · ${r.people || '–'} người${issuesOf(r).e.length ? ' · <span style="color:#b91c1c">❌ thiếu thông tin</span>' : ''}</div></div>
          <div><label>Giai đoạn</label><select data-ph5="${o.i}">${!r.phase ? '<option value="" selected>— chọn —</option>' : ''}${PHASES.map((p, j) => `<option value="${j + 1}" ${r.phase === j + 1 ? 'selected' : ''}>${p}</option>`).join('')}</select></div>
          <div><label>Song song với task trên?</label><select data-par5="${o.i}" ${k ? '' : 'disabled'}><option value="0">Không – làm sau</option><option value="1" ${r.par ? 'selected' : ''}>‖ Có – cùng lúc</option></select></div>
          <div><button class="btn sm" data-w5="edit" data-i="${o.i}">🛡</button></div></div>`; }).join('');
    } else {
      const groups = []; list.forEach(o => { if (!o.join) groups.push([]); groups[groups.length - 1].push(o); });
      html += groups.map((g, gi) => `<div class="w5-grp" style="--c:${processColor(null, proc)}"><div class="gt">${gi ? '⤷ sau nhóm ' + gi : '▶ bắt đầu ngay'}${g.length > 1 ? ` · <span class="w5-par">‖ ${g.length} task song song</span>` : ''}</div>
        ${g.map(o => { const r = d.rows[o.i], e = issuesOf(r).e.length; return `<div class="w5-t"><div><b>${esc(r.name)}</b> ${badges(r)}${e ? '<span class="wr-pill e">❌ thiếu</span>' : ''}
          <div class="sub">${r.dur || '–'}h · ${r.people || '–'} người${r.equip ? ' · ' + esc(r.equip) : ''}</div></div><button class="btn sm" data-w5="edit" data-i="${o.i}">🛡</button></div>`; }).join('')}</div>`).join('');
    }
  }
  return html + '</section>';
}
function previewTpl() {
  const T = templateTasks(), byId = new Map(T.map(t => [t.id, t])), by = new Map();
  T.forEach(t => { if (!by.has(t.process)) by.set(t.process, []); by.get(t.process).push(t); });
  return `<section class="w4-card"><h4><span class="w4-n">3</span> Xem trước – bộ task mẫu (${T.length} task)</h4>
    ${[...by].map(([p, l]) => `<div class="w4-proc"><i style="background:${processColor(null, p)}"></i>${esc(p)}</div>${l.map((t, k) => `<div class="w5-t"><div><b>${esc(t.taskName)}</b>
      <div class="sub">${t.dependencyIds.length ? '⤷ sau ' + t.dependencyIds.map(x => esc(byId.get(x)?.taskName || x)).join(', ') : k ? '≡ nối tiếp' : '▶ bắt đầu ngay'} · ${U.fmtDur(t.durationHours, true)}</div></div></div>`).join('')}`).join('')}</section>`;
}
function render() {
  const v = $('#wrView'); if (!v || !document.body.classList.contains('wr-mode')) return;
  enrich();
  const d = WR.data, src = source();
  if (!WR.form.start) WR.form.start = (d && metaStart(d.meta && d.meta.start)) || defStart();
  if (d && !WR.form.name && d.meta && d.meta.name) WR.form.name = d.meta.name;
  const ne = src === 'file' ? d.rows.filter(r => issuesOf(r).e.length).length : 0;
  const n = src === 'file' ? d.rows.length : src === 'tpl' ? templateTasks().length : 0;
  const block = ro() ? 'Đăng nhập để tạo' : !S.mode ? 'Chọn cách tạo lịch' : !src ? (S.mode === 'auto' ? 'Upload file task hoặc tick dùng bộ task mẫu' : 'Upload file task') : (src === 'file' && d.missingCols.length) ? 'File thiếu cột bắt buộc' : '';
  const st = [['Chọn cách tạo lịch', !!S.mode], ['Thông tin & tải file', !!src], ['Tạo ngay → Gantt', false]], cur = st.findIndex(x => !x[1]);
  const fid = document.activeElement && document.activeElement.closest && document.activeElement.closest('#wrView') ? document.activeElement.id : '';
  v.innerHTML = `
    <div class="wr-h"><b>📥 Tạo lịch Shutdown</b>${ro() ? '<button class="wr-pill w" data-wr="login" style="border:0;cursor:pointer">👁 Chỉ xem – bấm để đăng nhập</button>' : `<span class="wr-pill ok">✓ ${esc(Auth.user)}</span>`}
      <button class="btn sm" data-wr="op">📱 Ca trực</button>${ro() ? '' : '<button class="btn sm" data-wr="admin">🛡 Admin</button>'}<button class="btn sm" data-wr="back">Planner</button></div>
    <div class="w4-steps">${st.map((x, i) => `<span class="${x[1] ? 'ok' : i === cur ? 'cur' : ''}"><i>${x[1] ? '✓' : i + 1}</i>${x[0]}</span>`).join('<b>›</b>')}</div>
    ${stepMode()}${S.mode ? stepFiles(d, src) : ''}${S.mode && src ? (src === 'tpl' ? previewTpl() : previewFile(d)) : ''}
    ${S.mode ? `<div class="w4-bar"><div class="sum">${n ? `<span class="wr-pill">${n} task</span>` : ''}${ne ? `<span class="wr-pill e">❌ ${ne} thiếu thông tin</span>` : ''}
      <span class="wr-pill i">${S.mode === 'auto' ? '⚡ Tự động' : '🛠 Tinh chỉnh'}</span>${hasLDC() && (S.mode === 'auto' || S.cfg.assign === 'ldc') ? '<span class="wr-pill ok">👥 Tự gán người</span>' : ''}
      ${block ? `<span class="wr-pill w">${esc(block)}</span>` : ''}</div><button class="w4-go" data-w5="go" ${block ? 'disabled' : ''}>🚀 Tạo ngay</button></div>` : ''}`;
  if (fid) { const el = document.getElementById(fid); if (el && el.tagName === 'INPUT' && el.type !== 'file') { el.focus(); try { el.setSelectionRange(el.value.length, el.value.length); } catch (e) { } } }
}

/* ---------- sửa 1 task ---------- */
function editRow(i) {
  const d = WR.data, r = d && d.rows[i]; if (!r) return;
  const L = d.lists || {}, s = { ...(r.safety || {}) }, pv = { ...(r.photos || {}) };
  const opt = (arr, val) => `<option value="">— chọn —</option>${[...new Set([...(arr || []), ...(val && val !== '—' ? [val] : [])])].map(o => `<option ${o === val ? 'selected' : ''}>${esc(o)}</option>`).join('')}`;
  const kindV = r.kind === 'extra' ? 'Bổ sung – ' + (r.sub || 'A') : r.kind === 'mandatory' ? 'Bắt buộc' : '';
  const m = openModal(`<div class="modal-h"><h3>${esc(r.name)}</h3><button class="x" data-close>×</button></div>
    <div class="modal-b"><div class="wr-sf">
      <div class="wr-sec">A. Công việc</div>
      <label>Loại công việc<select id="eKind">${opt(['Bắt buộc', 'Bổ sung – A', 'Bổ sung – B'], kindV)}</select></label><label>Thiết bị / Khu vực<input id="eEq" value="${esc(r.equip)}"></label>
      <label>Giai đoạn<select id="ePh">${opt(PHASES, r.phase ? PHASES[r.phase - 1] : '')}</select></label><label>Song song với task trên?<select id="ePar">${opt(['Có', 'Không'], r.par ? 'Có' : 'Không')}</select></label>
      <label>Thời lượng (giờ)<input id="eDur" type="number" step="0.1" min="0" value="${esc(r.dur || '')}"></label><label>Số người<input id="ePp" type="number" min="1" value="${esc(r.people || '')}"></label>
      <label class="full">Mô tả ngắn cho operator<textarea id="eDesc" rows="2">${esc(r.desc)}</textarea></label>
      <div class="wr-sec">Ảnh upload</div>
      <label>Ảnh checklist<select id="pC">${opt(['Có', 'Không'], pv.check)}</select></label><label>Ảnh giấy phép<select id="pP">${opt(['Có', 'Không'], pv.ptw)}</select></label>
      <label>Ảnh hoàn thành (số)<select id="pD">${opt(['1', '2', '3', '4', '5'], pv.done ? String(pv.done) : '')}</select></label>
      <div class="wr-sec">B. Cần yêu cầu an toàn?</div><label class="full"><select id="eNeed">${opt(['Có', 'Không'], s.need)}</select></label></div>
    <div class="wr-sf" id="eBox" style="margin-top:8px"><div class="wr-sec">C. Yêu cầu an toàn</div>
      <label class="sf">Mode can thiệp<select data-k="mode">${opt(['Mode 0', 'Mode 1', 'Mode 2', 'Mode 3', 'Mode 4'], s.mode)}</select></label>
      <label class="sf">WI LOTO<input data-k="wiLoto" value="${esc(s.wiLoto)}"></label>
      <label class="sf full">Điểm khóa LOTO (Năng lượng: điểm khóa; …)<textarea data-k="lotoPts" rows="2">${esc(s.lotoPts)}</textarea></label>
      <label class="sf">Giấy phép làm việc<select data-k="ptw">${opt(L.ptw, s.ptw)}</select></label>
      <label class="sf">Phiếu tiên đoán rủi ro<select data-k="risk">${opt(['Có', 'Không'], s.risk)}</select></label>
      <label class="sf full">Bộ PPE<select data-k="ppe">${opt(Object.keys(L.packs || {}), s.ppe)}</select></label></div>
    <div class="wr-issue" id="eIss" style="margin-top:8px"></div></div>
    <div class="modal-f"><button class="btn" data-close>Hủy</button><button class="btn primary" id="eOk">Lưu</button></div>`);
  const read = () => {
    const ns = { ...s, need: $('#eNeed', m).value }; $$('#eBox [data-k]', m).forEach(x => ns[x.dataset.k] = x.value.trim());
    const kv = N($('#eKind', m).value), phv = /(\d)/.exec($('#ePh', m).value);
    return { ...r, equip: $('#eEq', m).value.trim(), desc: $('#eDesc', m).value.trim(), kind: kv.startsWith('bo sung') ? 'extra' : kv.startsWith('bat buoc') ? 'mandatory' : '',
      sub: kv.startsWith('bo sung') ? (/\bb$/.test(kv) ? 'B' : 'A') : '', phase: phv ? +phv[1] : 0, par: YES($('#ePar', m).value),
      dur: U.num($('#eDur', m).value, 0), people: Math.round(U.num($('#ePp', m).value, 0)),
      photos: { check: $('#pC', m).value, ptw: $('#pP', m).value, done: $('#pD', m).value }, safety: ns };
  };
  const refresh = () => { $('#eBox', m).classList.toggle('off', !YES($('#eNeed', m).value)); const is = issuesOf(read());
    $('#eIss', m).innerHTML = is.e.map(x => `<div class="e">❌ ${esc(x)}</div>`).join('') + is.w.map(x => `<div class="w">⚠ ${esc(x)}</div>`).join('') || '<div style="color:#15803d">✅ Đủ thông tin</div>'; };
  m.addEventListener('change', refresh); m.addEventListener('input', refresh); refresh();
  $('#eOk', m).onclick = () => { d.rows[i] = read(); closeModal(); render(); };
}

/* ---------- TẠO NGAY ---------- */
function parsePts(str) { return String(str || '').split(/[;\n]+/).map(x => x.trim()).filter(Boolean).map((x, i) => { const k = x.indexOf(':'); return k > 0 ? { stt: i + 1, energy: x.slice(0, k).trim(), point: x.slice(k + 1).trim() } : { stt: i + 1, energy: '', point: x }; }); }
function fit(plan) { try { const r = Scheduler.schedule(plan); if (plan.targetHours < r.kpi.windowHours) plan.targetHours = Math.ceil(r.kpi.windowHours); } catch (e) { } }
async function createNow() {
  if (ro()) { const b = $('#auBadge'); if (b) b.click(); return; }
  const src = source(); if (!S.mode || !src) return;
  const d = WR.data;
  if (src === 'file') {
    const ne = d.rows.filter(r => issuesOf(r).e.length).length;
    if (ne && !(await confirmBox('Tạo lịch Shutdown', `<b>${ne}</b> task còn thiếu thông tin (sẽ highlight trên Gantt). Vẫn tạo?`, 'Tạo ngay'))) return;
  }
  const start = (WR.form.start || defStart()).slice(0, 16), target = U.num(WR.form.target, 48) || 48;
  const name = WR.form.name.trim() || (src === 'file' ? (d.meta.name || d.fileName.replace(/\.\w+$/, '')) : 'Shutdown ' + start.slice(0, 10).split('-').reverse().join('/'));
  const meta = { status: 'published', source: src, arrange: S.mode, cfg: { ...S.cfg }, importedAt: Date.now(), publishedAt: Date.now(), publishedBy: (window.Auth && Auth.user) || '' };
  let newId = null;
  if (src === 'tpl') {
    Store.commit('Tạo lịch từ bộ task mẫu', () => { const plan = makePlan({ name, start, targetHours: target, tasks: templateTasks(), resourceCapacity: { 'Nhà thầu': 3 } });
      plan.wr = { ...meta, fileName: 'Bộ task mẫu' }; Store.state.plans.push(plan); Store.state.activePlanId = plan.id; newId = plan.id; fit(plan); });
  } else {
    const P = buildPlan(d.rows);
    Store.commit('Tạo lịch từ Work Request', () => {
      const plan = makePlan({ name, start, targetHours: target }); plan.wr = { ...meta, fileName: d.fileName, lists: d.lists };
      const tmp = { tasks: [] }, idOf = {}; let order = 0, prio = 0;
      for (const o of P) {
        const r = d.rows[o.i], hrs = r.dur > 0 ? r.dur : 1, ev = evidenceFor(r);
        const t = normalizeTask({ id: nextTaskId(tmp), order: ++order, branch: r.branch || 'Chung', process: r.process || 'Chung', taskName: r.name,
          durationHours: hrs, standardHours: hrs, quantity: 1, peopleRequired: Math.max(1, r.people || 1), assignee: '', owner: '',
          executionMode: 'parallel', lagHours: 0, notes: r.desc, method: '', progress: 0, evidence: ev });
        t.wr = { kind: r.kind, sub: r.sub, phase: ph(r), par: r.par, equip: r.equip, desc: r.desc, line: r.line, photos: { ...(r.photos || {}) }, safety: { ...(r.safety || {}) },
          points: parsePts((r.safety || {}).lotoPts), ppeItems: ppeItems(r.safety, d.lists), issues: issuesOf(r), seqSet: true, prio: r.kind === 'extra' ? ++prio : null };
        t.evidence = ev; if (t.wr.ppeItems.length && 'ppe' in t) t.ppe = t.wr.ppeItems.slice();
        idOf[o.i] = t.id; tmp.tasks.push(t);
      }
      P.forEach((o, k) => { const t = tmp.tasks[k], deps = o.deps.map(i => idOf[i]).filter(Boolean);
        if (deps.length) { t.executionMode = 'after_dependency'; t.dependencyIds = deps; } else { t.executionMode = 'parallel'; t.dependencyIds = []; } });
      plan.tasks = tmp.tasks; Store.state.plans.push(plan); Store.state.activePlanId = plan.id; newId = plan.id; fit(plan);
    });
  }
  const plan = Store.state.plans.find(p => p.id === newId); if (!plan) return;
  let assigned = 0;
  if (hasLDC() && (S.mode === 'auto' || S.cfg.assign === 'ldc')) {
    try { const dk = LDC.dayKey(U.parseLocalISO(plan.start)); LDC.planDay = dk; if (LDC.autoPick) LDC.autoPick(dk);
      const sug = LDC.suggest(plan, { overwrite: false, allowHC: S.mode === 'custom' && S.cfg.hc === 'yes', anyTeam: false }).filter(x => !x.keep && x.names.length);
      if (sug.length) Store.commit('Tự gán người theo LDC', p => { for (const x of sug) { const t = p.tasks.find(k => k.id === x.t.id); if (t) { t.assignee = x.names.join(' + '); assigned++; } } });
    } catch (e) { console.warn('[WR v5] gán người LDC lỗi:', e); }
  }
  WR.data = null; WR.form = { name: '', start: '', target: 48 }; WR.planId = newId; S.mode = null; S.useTpl = false;
  WR.close(); App.openPlan(newId);
  toast(`Đã tạo "${name}" · ${plan.tasks.length} task${assigned ? ` · đã gán người ${assigned} task` : ''}`, 'ok');
}

/* ---------- sự kiện ---------- */
const v = $('#wrView');
v.addEventListener('click', async e => {
  const b = e.target.closest('[data-w5]'); if (!b) return;
  const k = b.dataset.w5;
  if (k === 'mode') { S.mode = b.dataset.v; return render(); }
  if (k === 'edit') return editRow(+b.dataset.i);
  if (k === 'go') return createNow();
  if (k === 'ldc') { await LDC.askUpload('Upload lịch đi ca (LDC)'); return render(); }
});
v.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.c5) { S.cfg[t.dataset.c5] = t.value; return render(); }
  if (t.dataset.ph5 !== undefined) { WR.data.rows[+t.dataset.ph5].phase = +t.value || 0; return render(); }
  if (t.dataset.par5 !== undefined) { WR.data.rows[+t.dataset.par5].par = t.value === '1'; return render(); }
  if (t.id === 'w5Tpl') { S.useTpl = t.checked; return render(); }
});
WR.render = render;
WR._t5 = { buildPlan, enrich };
if (document.body.classList.contains('wr-mode')) render();
console.log('[WR v5] đã nạp – xếp theo Giai đoạn / Song song / Bổ sung A-B');
} catch (err) { console.error('[WR v5] lỗi:', err); }
}
document.addEventListener('DOMContentLoaded', () => setTimeout(boot, 150));
})();

  background:var(--glass-row);border:1px solid var(--glass-bd);box-shadow:0 6px 20px rgba(31,45,90,.08);overflow:hidden;
  animation:rpIn .55s var(--spring) both;animation-delay:var(--d,0ms);transition:transform .4s var(--spring),box-shadow .25s}

@media (max-width:600px){.rp-title small{max-width:52vw}.rp-ctrl{grid-template-columns:1fr}.rp-grid{grid-template-columns:1fr}.rp-h{padding:10px 12px}.rp-pill{padding:8px 12px;font-size:13px}
  .rp-kpis{grid-template-columns:repeat(5,1fr);gap:6px}.rp-k{padding:8px 6px;text-align:center;border-radius:16px}.rp-k b{font-size:20px}.rp-k span{font-size:10.5px}.rp-k::after{display:none}}
@media (prefers-reduced-motion:reduce){.rp-card,.rp-h,.rp-shead,.op-req{animation:none!important}}
</style>
<script>
(function () {
'use strict';
function boot() {
try {
const OP = window.OperatorView, WR = window.WorkRequest;
const esc = s => U.esc(s ?? '');
const plans = () => Store.state.plans;
const myName = () => SafeStore.get('op.name') || '';
const SHIFTS = [{ n: 1, s: 6, label: '06–14' }, { n: 2, s: 14, label: '14–22' }, { n: 3, s: 22, label: '22–06' }];
const ST = { todo: 'Chưa làm', run: 'Đang làm', done: 'Xong', late: 'Trễ' };
const KC = { all: '#0a84ff', todo: '#8e8e93', run: '#0a84ff', done: '#30d158', late: '#ff3b30' };

/* ---------- Dark mode ---------- */
function toggleDark() {
  const on = document.body.classList.toggle('dark');
  Store.ui().dark = on; Store.save();
  $$('[data-dark]').forEach(b => b.textContent = on ? '☀️' : '🌙');
}
const darkIcon = () => document.body.classList.contains('dark') ? '☀️' : '🌙';
const sp = $('.topbar .spacer');
if (sp && !$('#tbDark')) { const b = document.createElement('button'); b.className = 'tb-btn'; b.id = 'tbDark'; b.setAttribute('data-dark', ''); b.title = 'Giao diện sáng / tối'; b.textContent = darkIcon(); b.onclick = toggleDark; sp.after(b); }

/* ---------- Đổi tên "Ca trực" → "Report ca" ---------- */
function renameOp(root) {
  $$('button', root || document).forEach(b => {
    if (b.closest('#opView') || b.children.length) return;
    const t = b.textContent;
    if (/Ca trực/.test(t)) b.textContent = t.replace('📱', '📋').replace('Ca trực', 'Report ca');
  });
}

/* =====================================================================
   1. REPORT CA
   ===================================================================== */
if (OP) {
  const evOf = t => (Array.isArray(t.evidence) && t.evidence.length ? t.evidence : [{ id: 'done', label: 'Ảnh hoàn thành', min: 1 }]);
  const pr = (t, id) => ((t.proofs || {})[id] || []);
  const evStat = t => { let h = 0, n = 0; for (const e of evOf(t)) { const k = Math.max(1, e.min || 1); n += k; h += Math.min(k, pr(t, e.id).length); } return { h, n }; };
  const statusOf = (t, r) => { if (t.progress >= 100) return 'done'; const now = Date.now(); if (now >= r.end) return 'late'; if (now >= r.start || t.startedAt || evStat(t).h) return 'run'; return 'todo'; };
  const shiftWin = (date, ca) => { const s = U.parseLocalISO(date + 'T00:00') + SHIFTS[ca - 1].s * MS_H; return [s, s + 8 * MS_H]; };
  const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const toks = q => U.norm(q).split(' ').filter(Boolean);
  const wordHit = (hay, tk) => tk.every(k => new RegExp('(^|[^a-z0-9])' + reEsc(k)).test(hay));
  const hayOf = t => U.norm([t.assignee, t.owner, t.taskName, t.process, t.wr && t.wr.equip, t.doneBy, t.startedBy,
    ...Object.values(t.proofs || {}).flat().map(x => x && x.by)].filter(Boolean).join(' | '));
  const hl = (txt, tk) => !tk.length ? esc(txt) : String(txt || '').split(/(\s+)/).map(w => tk.some(k => U.norm(w).startsWith(k)) ? `<mark>${esc(w)}</mark>` : esc(w)).join('');
  OP.q = OP.q || ''; OP.st = OP.st || 'all';
  let lastKey = '', lastCa = null;

  OP.render = function () {
    const v = $('#opView'); if (!v || !document.body.classList.contains('op-mode')) return;
    let plan = plans().find(p => p.id === OP.planId);
    if (!plan) { plan = plans().find(p => p.id === Store.state.activePlanId) || plans()[0]; OP.planId = plan.id; }
    if (!OP.date) { const n = new Date(), h = n.getHours(), d = new Date(n.getFullYear(), n.getMonth(), n.getDate()); if (h < 6) d.setDate(d.getDate() - 1); OP.date = U.toLocalISO(d.getTime()).slice(0, 10); OP.ca = h >= 6 && h < 14 ? 1 : h >= 14 && h < 22 ? 2 : 3; }
    const res = Scheduler.schedule(plan), [ws, we] = shiftWin(OP.date, OP.ca), tk = toks(OP.q);
    const inShift = t => { const r = res.R.get(t.id); return r && (r.end > r.start ? r.start < we && r.end > ws : r.start >= ws && r.start < we); };
    const base = (tk.length ? plan.tasks.filter(t => wordHit(hayOf(t), tk)) : plan.tasks.filter(inShift))
      .sort((a, b) => res.R.get(a.id).start - res.R.get(b.id).start || a.order - b.order);
    const stOf = new Map(base.map(t => [t.id, statusOf(t, res.R.get(t.id))]));
    const cnt = k => k === 'all' ? base.length : base.filter(t => stOf.get(t.id) === k).length;
    const list = OP.st === 'all' ? base : base.filter(t => stOf.get(t.id) === OP.st);
    /* người khớp tên */
    const people = tk.length ? [...new Map(plan.tasks.flatMap(t => U.splitOwners(t.assignee)).filter(n => wordHit(U.norm(n), tk)).map(n => [U.norm(n), n])).values()].slice(0, 8) : [];
    const key = [plan.id, OP.date, OP.ca, OP.st, U.norm(OP.q)].join('|'), anim = key !== lastKey; lastKey = key;
    const fid = document.activeElement && document.activeElement.id, caret = fid === 'opQ' ? document.activeElement.selectionStart : null;
    const prevCa = lastCa == null ? OP.ca : lastCa; lastCa = OP.ca;
    const dd = OP.date.split('-').reverse().join('/');
    v.innerHTML = `
      <header class="rp-h">
        <div class="rp-title"><span class="rp-logo">📋</span><div><b>Report ca</b><small>${esc(plan.name)}</small></div></div>
        <button class="rp-pill" id="opName">👤 ${esc(myName() || 'Nhập tên của bạn')}</button>
        <button class="rp-ico" id="rpDark" data-dark title="Sáng / tối">${darkIcon()}</button>
        <button class="rp-pill" id="opBack">Planner</button>
      </header>
      <section class="rp-ctrl">
        <label class="rp-search"><span>🔍</span><input id="opQ" value="${esc(OP.q)}" placeholder="Tìm tên người hoặc tên việc… (vd: ky)" autocomplete="off">${OP.q ? '<button id="rpClr" title="Xóa">✕</button>' : ''}</label>
        <div class="rp-seg" id="rpSeg" style="--i:${prevCa - 1}"><i></i>${SHIFTS.map(s => `<button data-ca="${s.n}">Ca ${s.n}<small>${s.label}</small></button>`).join('')}</div>
        <input type="date" id="opDate" value="${OP.date}">
        <button class="rp-pill" id="opNow">⟳ Ca hiện tại</button>
        ${plans().length > 1 ? `<select id="opPlan" style="grid-column:1/-1">${plans().map(p => `<option value="${esc(p.id)}" ${p.id === plan.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select>` : ''}
      </section>
      <section class="rp-kpis">${[['all', 'Tất cả'], ['todo', 'Chưa làm'], ['run', 'Đang làm'], ['done', 'Xong'], ['late', 'Trễ']].map(([k, l]) =>
        `<button class="rp-k ${OP.st === k ? 'on' : ''}" data-rpst="${k}" style="--kc:${KC[k]}"><span>${l}</span><b>${cnt(k)}</b></button>`).join('')}</section>
      ${tk.length ? `<div class="rp-qinfo">🔎 <b>${base.length}</b> việc khớp “${esc(OP.q)}” (mọi ca)${people.map(n => `<button class="rp-person" data-rpq="${esc(n)}">👤 ${hl(n, tk)}</button>`).join('')}</div>` : ''}
      <div class="rp-grid ${anim ? '' : 'rp-noanim'}">
        ${list.length ? list.map((t, i) => {
          const r = res.R.get(t.id), st = stOf.get(t.id), s = evStat(t), c = processColor(plan, t.process), w = t.wr || {}, sf = w.safety || {};
          const pct = t.progress >= 100 ? 100 : Math.round(100 * s.h / s.n);
          const loto = (sf.wiLoto || sf.lotoPts) ? '<span>🔒 Khóa LOTO</span>' : '';
          const ptw = sf.ptw && !/^kh[oô]ng$/i.test(sf.ptw) ? '<span>📄 Giấy phép</span>' : '';
          const ppe = (w.ppeItems || t.ppe || []).length ? '<span>🦺 Đồ bảo hộ</span>' : '';
          return `<button class="rp-card st-${st}" data-op-task="${esc(t.id)}" style="--c:${c};--d:${Math.min(i, 14) * 35}ms">
            <div class="rp-top"><span class="rp-time">${U.fmtHM(r.start)} – ${U.fmtHM(r.end)}</span>
              ${tk.length || new Date(r.start).toDateString() !== new Date(r.end).toDateString() ? `<span class="rp-when">${U.fmtDM(r.start).slice(0, 5)} · Ca ${U.shiftOf(r.start)}</span>` : ''}
              <span class="rp-tag">${esc(t.process)}</span><span class="rp-st ${st}">${ST[st]}</span></div>
            <div class="rp-name">${hl(t.taskName, tk)}</div>
            <div class="rp-meta">👤 ${t.assignee ? hl(t.assignee, tk) : '<i>Chưa có người</i>'}${w.equip ? ` · 📍 ${hl(w.equip, tk)}` : ''}</div>
            ${loto || ptw || ppe ? `<div class="rp-chips">${loto}${ptw}${ppe}</div>` : ''}
            <div class="rp-foot"><span>📷 ${s.h}/${s.n} ảnh</span><div class="rp-pb"><i style="width:${pct}%"></i></div><span>${pct}%</span></div>
          </button>`; }).join('')
        : `<div class="rp-empty"><b>${tk.length ? '🔍' : '☕'}</b>${tk.length ? `Không tìm thấy việc nào khớp “${esc(OP.q)}”` : `Ca ${OP.ca} ngày ${dd} không có việc${OP.st !== 'all' ? ' ở mục “' + ({ todo: 'Chưa làm', run: 'Đang làm', done: 'Xong', late: 'Trễ' })[OP.st] + '”' : ''}.`}</div>`}
      </div>`;
    requestAnimationFrame(() => { const sg = $('#rpSeg'); if (sg) sg.style.setProperty('--i', OP.ca - 1); });
    if (fid === 'opQ') { const q = $('#opQ'); if (q) { q.focus(); try { q.setSelectionRange(caret, caret); } catch (e) { } } }
  };

  const v = $('#opView');
  let qT;
  v.addEventListener('input', e => {
    if (e.target.id !== 'opQ') return;
    clearTimeout(qT); const val = e.target.value;
    qT = setTimeout(() => { OP.q = val; OP.st = 'all'; OP.render(); }, 180);
  });
  v.addEventListener('click', e => {
    if (e.target.closest('#rpDark')) { e.stopPropagation(); return toggleDark(); }
    if (e.target.closest('#rpClr')) { e.preventDefault(); OP.q = ''; OP.render(); const q = $('#opQ'); if (q) q.focus(); return; }
    const k = e.target.closest('[data-rpst]'); if (k) { OP.st = k.dataset.rpst; return OP.render(); }
    const pq = e.target.closest('[data-rpq]'); if (pq) { OP.q = pq.dataset.rpq; return OP.render(); }
  });

  /* ---------- Màn hình chi tiết: thanh tiến độ + chữ dễ hiểu ---------- */
  function polishSheet() {
    const s = OP.sheet; if (!s || !document.body.contains(s.m)) return;
    const b = $('#opSheetB', s.m); if (!b) return;
    const p = plans().find(x => x.id === s.planId), t = p && p.tasks.find(x => x.id === s.taskId); if (!t) return;
    const r = Scheduler.schedule(p).R.get(t.id), st = evStat(t), pct = t.progress >= 100 ? 100 : Math.round(100 * st.h / st.n), sts = statusOf(t, r);
    let h = b.querySelector('.rp-shead');
    const html = `<div class="rp-ring" style="--p:${pct}"><b>${pct}%</b></div><div><strong>${ST[sts]}${t.progress >= 100 ? ' ✅' : ''}</strong>
      <small>📷 Ảnh đã chụp: <b>${st.h}/${st.n}</b>${t.progress >= 100 ? '' : st.h >= st.n ? ' · Đủ ảnh – bấm <b>Đóng task</b> ở dưới' : ` · Còn thiếu <b>${st.n - st.h}</b> ảnh`}</small></div>`;
    if (!h) { h = document.createElement('div'); h.className = 'rp-shead'; b.prepend(h); }
    if (h.innerHTML !== html) h.innerHTML = html;
    $$('.wr-gate', b).forEach(g => { const m = /còn (\d+) mục/.exec(g.textContent); if (m && !g.querySelector('button')) g.textContent = `🔒 Còn ${m[1]} việc chuẩn bị (chụp ảnh 🟡) – làm đủ mới bấm “Bắt đầu” được`; });
    $$('.wr-sub b', b).forEach(x => { if (/tick khi đã mang đủ/.test(x.textContent)) x.textContent = '🦺 Đồ bảo hộ – chạm để tick khi đã mặc đủ'; });
    $$('.op-warn', b).forEach(x => { if (/Chưa cấu hình nơi lưu ảnh/.test(x.textContent)) x.textContent = '⚠ Chưa cài nơi lưu ảnh – báo người lập kế hoạch.'; });
  }
  const _ot = OP.openTask;
  OP.openTask = function (...a) {

      ${sel ? `<span class="r7-sel">👤 ${esc(sel.name)}<button data-r7="clear" title="Bỏ chọn">✕</button></span>` : '<span style="opacity:.6">👤</span>'}
      <input id="r7Q" value="${esc(pickQ)}" placeholder="${sel ? 'Đổi người khác…' : 'Chọn người – gõ vài chữ của tên (vd: ky)'}" autocomplete="off">
      ${sel ? '<button class="r7-clear" data-r7="clear">Xem tất cả</button>' : ''}</div>
    ${pickOpen ? `<div class="r7-list">${opts.length ? opts.map((p, i) => `<button class="r7-opt ${i === pickIdx ? 'act' : ''}" data-r7p="${esc(U.norm(p.name))}"><span class="r7-av">${esc(initials(p.name))}</span>${esc(p.name)}<small>${p.n} việc</small></button>`).join('')
      : `<div class="r7-none">Không có ai tên “${esc(pickQ)}”</div>`}</div>` : ''}</div>`;
}

OP.render = function () {
  const v = $('#opView'); if (!v || !document.body.classList.contains('op-mode')) return;
  let plan = plans().find(p => p.id === OP.planId);
  if (!plan) { plan = plans().find(p => p.id === Store.state.activePlanId) || plans()[0]; OP.planId = plan.id; }
  if (!OP.date) { const n = new Date(), h = n.getHours(), d = new Date(n.getFullYear(), n.getMonth(), n.getDate()); if (h < 6) d.setDate(d.getDate() - 1); OP.date = U.toLocalISO(d.getTime()).slice(0, 10); OP.ca = h >= 6 && h < 14 ? 1 : h >= 14 && h < 22 ? 2 : 3; }
  const res = Scheduler.schedule(plan), [ws, we] = shiftWin(OP.date, OP.ca);
  const sel = OP.person ? people(plan).find(p => U.norm(p.name) === OP.person) : null; if (OP.person && !sel) OP.person = '';
  const base = (OP.person ? plan.tasks.filter(t => hasPerson(t, OP.person)) : plan.tasks.filter(t => inWin(res.R.get(t.id), ws, we)))
    .sort((a, b) => res.R.get(a.id).start - res.R.get(b.id).start || a.order - b.order);
  const stOf = new Map(base.map(t => [t.id, statusOf(t, res.R.get(t.id))]));
  const cnt = k => k === 'all' ? base.length : base.filter(t => stOf.get(t.id) === k).length;
  const list = OP.st === 'all' ? base : base.filter(t => stOf.get(t.id) === OP.st);
  const key = [plan.id, OP.date, OP.ca, OP.st, OP.person].join('|'), anim = key !== lastKey; lastKey = key;
  const focusQ = document.activeElement && document.activeElement.id === 'r7Q';
  const dd = OP.date.split('-').reverse().join('/');
  const pDone = base.filter(t => t.progress >= 100).length;
  v.innerHTML = `
    <header class="rp-h">
      <div class="rp-title"><span class="rp-logo">📋</span><div><b>Report ca</b><small>${esc(plan.name)}</small></div></div>
      <button class="rp-pill" id="opName">✍️ ${esc(myName() || 'Tên của bạn')}</button>
      <button class="rp-ico" data-r7="dark" title="Sáng / tối">${document.body.classList.contains('dark') ? '☀️' : '🌙'}</button>
      <button class="rp-pill" id="opBack">Planner</button>
    </header>
    ${OP.showStats ? statsHTML(plan, res) : ''}
    <section class="rp-ctrl">
      ${pickHTML(plan)}
      <div class="rp-seg" style="--i:${OP.ca - 1};${OP.person ? 'opacity:.45' : ''}"><i></i>${SHIFTS.map(s => `<button data-ca="${s.n}">Ca ${s.n}<small>${s.label.replace(':00', '').replace(':00', '')}</small></button>`).join('')}</div>
      <input type="date" id="opDate" value="${OP.date}">
      <button class="rp-pill" id="opNow">⟳ Ca hiện tại</button>
      ${plans().length > 1 ? `<select id="opPlan" style="grid-column:1/-1">${plans().map(p => `<option value="${esc(p.id)}" ${p.id === plan.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select>` : ''}
    </section>
    ${sel ? `<div class="r7-who"><span class="r7-av">${esc(initials(sel.name))}</span><div><b>${esc(sel.name)}</b><small>${base.length} việc trong kế hoạch · đã xong ${pDone} (${pct(pDone, base.length)}%)</small></div>
      <button class="r7-clear" data-r7="clear" style="margin-left:auto">✕ Bỏ chọn</button></div>` : ''}
    <div class="r7-chips">
      ${[['all', 'Tất cả'], ['todo', 'Chưa làm'], ['run', 'Đang làm'], ['done', 'Đã xong'], ['late', 'Trễ']].map(([k, l]) =>
        `<button class="r7-chip ${OP.st === k ? 'on' : ''}" data-rpst="${k}" style="--kc:${KC[k]}">${k === 'all' ? '' : '<i></i>'}${l} <em>${cnt(k)}</em></button>`).join('')}
      <button class="r7-chip" data-r7="stats" style="margin-left:auto">${OP.showStats ? '▴ Ẩn thống kê' : '📊 Xem thống kê'}</button>
    </div>
    <div class="rp-grid ${anim ? '' : 'rp-noanim'}">
      ${list.length ? list.map((t, i) => {
        const r = res.R.get(t.id), st = stOf.get(t.id), s = evStat(t), w = t.wr || {}, sf = w.safety || {};
        const p = t.progress >= 100 ? 100 : pct(s.h, s.n);
        const ic = [(sf.wiLoto || sf.lotoPts) ? '<span title="Cần khóa LOTO">🔒</span>' : '', sf.ptw && !/^kh[oô]ng$/i.test(sf.ptw) ? '<span title="Cần giấy phép">📄</span>' : '',
          (w.ppeItems || t.ppe || []).length ? '<span title="Đồ bảo hộ">🦺</span>' : ''].join('');
        return `<button class="rp-card st-${st}" data-op-task="${esc(t.id)}" style="--c:${processColor(plan, t.process)};--d:${Math.min(i, 14) * 30}ms">
          <div class="r7-top"><span class="r7-proc"><i></i>${esc(t.process)}</span><span class="r7-st ${st}">${ST[st]}</span></div>
          <div class="r7-name">${esc(t.taskName)}</div>
          <div class="r7-row"><span>🕒 ${U.fmtHM(r.start)} – ${U.fmtHM(r.end)}${OP.person || new Date(r.start).toDateString() !== new Date(r.end).toDateString() ? ` · ${U.fmtDM(r.start).slice(0, 5)}` : ''}</span>
            <span>👤 ${t.assignee ? esc(t.assignee) : 'Chưa có người'}</span></div>
          <div class="r7-foot">${ic ? `<div class="r7-icons">${ic}</div>` : ''}<span>📷 ${s.h}/${s.n}</span><div class="rp-pb"><i style="width:${p}%"></i></div><span>${p}%</span></div>
        </button>`; }).join('')
      : `<div class="rp-empty"><b>☕</b>${OP.person ? 'Người này không có việc ở mục đang chọn.' : `Ca ${OP.ca} ngày ${dd} không có việc${OP.st !== 'all' ? ' ở mục “' + ({ todo: 'Chưa làm', run: 'Đang làm', done: 'Đã xong', late: 'Trễ' })[OP.st] + '”' : ''}.`}</div>`}
    </div>`;
  if (focusQ) { const q = $('#r7Q'); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }
};

/* ---------- sự kiện ---------- */
const v = $('#opView');
const choose = key => { OP.person = key; OP.st = 'all'; pickOpen = false; pickQ = ''; OP.render(); };
v.addEventListener('focusin', e => { if (e.target.id === 'r7Q' && !pickOpen) { pickOpen = true; pickIdx = 0; OP.render(); } });
v.addEventListener('input', e => { if (e.target.id !== 'r7Q') return; pickQ = e.target.value; pickOpen = true; pickIdx = 0; OP.render(); });
v.addEventListener('keydown', e => {
  if (e.target.id !== 'r7Q') return;
  const opts = $$('.r7-opt', v);
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); pickIdx = (pickIdx + (e.key === 'ArrowDown' ? 1 : -1) + opts.length) % Math.max(1, opts.length); OP.render(); }
  if (e.key === 'Enter' && opts[pickIdx]) { e.preventDefault(); choose(opts[pickIdx].dataset.r7p); }
  if (e.key === 'Escape') { pickOpen = false; pickQ = ''; e.target.blur(); OP.render(); }
});
v.addEventListener('mousedown', e => { if (e.target.closest('.r7-opt')) e.preventDefault(); });
v.addEventListener('click', e => {
  const o = e.target.closest('[data-r7p]'); if (o) { e.stopPropagation(); return choose(o.dataset.r7p); }
  const a = e.target.closest('[data-r7]');
  if (a) {
    e.stopPropagation();
    const k = a.dataset.r7;
    if (k === 'clear') { OP.person = ''; pickQ = ''; pickOpen = false; return OP.render(); }
    if (k === 'stats') { OP.showStats = !OP.showStats; return OP.render(); }
    if (k === 'dark') { document.body.classList.toggle('dark'); Store.ui().dark = document.body.classList.contains('dark'); Store.save(); $$('[data-dark]').forEach(b => b.textContent = Store.ui().dark ? '☀️' : '🌙'); return OP.render(); }
  }
  if (e.target.closest('[data-ca]') && OP.person) { OP.person = ''; }
  if (pickOpen && !e.target.closest('.r7-pick')) { pickOpen = false; pickQ = ''; OP.render(); }
}, true);
if (document.body.classList.contains('op-mode')) OP.render();
console.log('[v7] đã nạp – Report ca: chọn người + thống kê');
} catch (err) { console.error('[v7] lỗi:', err); }
}
document.addEventListener('DOMContentLoaded', () => setTimeout(boot, 300));
})();
</script>

     ===================================================================== -->
<style id="v8-style">

@media (max-width:700px){.v8-tl{--lw:150px!important}.v8-row{font-size:11.5px}}
</style>
<script>
(function () {
'use strict';
let lastWB = null;
function wrapX() { if (!window.XLSX || XLSX.__v8) return; const r = XLSX.read; XLSX.read = function (...a) { const w = r.apply(this, a); lastWB = w; return w; }; XLSX.__v8 = true; }
document.addEventListener('change', e => { if (e.target && e.target.id === 'wrFile') wrapX(); }, true);
function boot() {
try {
const WR = window.WorkRequest; if (!WR || !WR._test) return;
wrapX();
const N = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[đĐ]/g, 'd').toLowerCase().replace(/\s+/g, ' ').trim();
const esc = s => U.esc(s ?? '');
let seen = null;
/* ---------- đọc cột "Bắt đầu sau Shutdown (giờ)" ---------- */
function readOffsets() {
  const d = WR.data; if (!d || seen === d) return; seen = d; d.hasOff = false;
  try {
    const wb = lastWB; if (!wb) return;
    const sn = wb.SheetNames.find(x => N(x) === 'work request') || wb.SheetNames[0];
    const T = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, raw: true, defval: '' });
    const hi = T.findIndex(r => (r || []).some(c => N(c).startsWith('ten cong viec'))); if (hi < 0) return;
    const H = T[hi].map(c => N(String(c).split('\n')[0]));
    const cO = H.findIndex(h => h.startsWith('bat dau sau')); if (cO < 0) return;
    let cnt = 0;
    d.rows.forEach(r => { const v = (T[r.line - 1] || [])[cO]; const n = typeof v === 'number' ? v : parseFloat(String(v).replace(',', '.')); if (isFinite(n) && String(v).trim() !== '') { r.off = n; cnt++; } else r.off = null; });
    d.hasOff = cnt > 0;
  } catch (e) { console.warn('[v8]', e); }
}
/* ---------- áp mốc giờ khi tạo kế hoạch ---------- */
function applyOff(plan, rows) {
  const byLine = new Map(rows.filter(r => r.off != null).map(r => [r.line, r]));
  const ts = plan.tasks.filter(t => t.wr && byLine.has(t.wr.line));
  if (!ts.length) return;
  ts.forEach(t => { const r = byLine.get(t.wr.line); t._off = r.off; });
  const byP = new Map(); ts.forEach(t => { if (!byP.has(t.process)) byP.set(t.process, []); byP.get(t.process).push(t); });
  for (const list of byP.values()) {
    list.sort((a, b) => a._off - b._off);
    list.forEach((t, k) => {
      let prev = null;
      for (let j = 0; j < k; j++) { const p = list[j], end = p._off + p.durationHours; if (end <= t._off + 1e-6 && (!prev || end > prev._off + prev.durationHours)) prev = p; }
      t.executionMode = prev ? 'after_dependency' : 'parallel'; t.dependencyIds = prev ? [prev.id] : [];
      t.constraintType = 'SNET'; t.constraintOffsetHours = t._off;
    });
  }
  plan.tasks.slice().sort((a, b) => (a._off ?? 1e9) - (b._off ?? 1e9) || a.order - b.order).forEach((t, i) => { t.order = i + 1; });
  const end = Math.max(...ts.map(t => t._off + t.durationHours));
  if (isFinite(end) && plan.targetHours < end) plan.targetHours = Math.ceil(end);
  ts.forEach(t => delete t._off);
  plan.wr = { ...plan.wr, timeline: true };
}
const _commit = Store.commit;
Store.commit = function (label, fn, ...rest) {
  if (label === 'Tạo lịch từ Work Request' && WR.data && WR.data.hasOff) {
    const rows = WR.data.rows, before = new Set(Store.state.plans.map(p => p.id));
    const f2 = function (...a) { const r = fn.apply(this, a); try { const p = Store.state.plans.find(x => !before.has(x.id)); if (p) applyOff(p, rows); } catch (e) { console.warn('[v8] applyOff', e); } return r; };
    return _commit.call(this, label, f2, ...rest);
  }
  return _commit.call(this, label, fn, ...rest);
};
/* ---------- xem trước dạng Gantt mini ---------- */
function timeline(d) {
  const rows = d.rows.map((r, i) => ({ r, i })).filter(x => x.r.off != null);
  const total = Math.max(24, ...rows.map(x => x.r.off + (x.r.dur || 0)));
  const days = Math.ceil(total / 24), start = U.parseLocalISO((WR.form.start || '').slice(0, 16));
  const edit = WR.setup && WR.setup.mode === 'custom';
  const by = new Map(); rows.forEach(x => { const k = x.r.process || 'Chung'; if (!by.has(k)) by.set(k, []); by.get(k).push(x); });
  const pct = h => (100 * h / total).toFixed(3) + '%';
  const hm = h => isFinite(start) ? U.fmtDM(start + h * MS_H) : '+' + h + 'h';
  const ticks = []; for (let h = 0; h <= total; h += 12) ticks.push(h);
  const noOff = d.rows.length - rows.length;
  return `<div class="v8-sum"><span class="wr-pill i">🕒 ${rows.length} task theo mốc giờ</span><span class="wr-pill">Tổng ${Math.round(total)} giờ · kết thúc ${esc(hm(total))}</span>
      ${noOff ? `<span class="wr-pill w">⚠ ${noOff} task chưa có mốc giờ – xếp nối tiếp</span>` : ''}${edit ? '<span class="wr-pill ok">✏️ Sửa số giờ ngay trên thanh</span>' : ''}</div>
    <div class="v8-tl" style="--lw:300px;--dw:${(100 * 24 / total).toFixed(3)}%">
      <div class="v8-axis">${ticks.map(h => `<span style="left:${pct(h)}">${esc(hm(h).slice(0, isFinite(start) ? 11 : 9))}</span><i style="left:${pct(h)}"></i>`).join('')}</div>
      ${[...by].map(([p, l]) => `<div class="v8-proc" style="--c:${processColor(null, p)}"><i></i>${esc(p)}<small>· ${l.length} task</small></div>
        ${l.sort((a, b) => a.r.off - b.r.off).map(({ r, i }) => `<div class="v8-row"><div class="v8-name" title="${esc(r.name)}">${esc(r.name)}${edit ? `<span class="v8-ed"><input type="number" step="0.5" min="0" value="${r.off}" data-v8o="${i}" title="Bắt đầu sau (giờ)"><input type="number" step="0.5" min="0.1" value="${r.dur}" data-v8d="${i}" title="Thời lượng (giờ)"></span>` : ''}</div>
          <div class="v8-track"><div class="v8-bar" style="left:${pct(r.off)};width:${pct(Math.max(.2, r.dur || 0))};--c:${processColor(null, p)}" title="${esc(r.name)}\n${esc(hm(r.off))} → ${esc(hm(r.off + (r.dur || 0)))} (${r.dur}h)"></div>
            <span class="v8-when" style="left:${pct(r.off + (r.dur || 0))}">${esc(hm(r.off).slice(-5))} · ${r.dur}h</span></div></div>`).join('')}`).join('')}
    </div>`;
}
function patch() {
  const v = $('#wrView'); if (!v || !document.body.classList.contains('wr-mode')) return;
  readOffsets();
  const d = WR.data; if (!d || !d.hasOff) return;
  $$('.w4-file p span', v).forEach(s => { if (/không có cột Giai đoạn/.test(s.textContent)) { s.style.color = '#15803d'; s.textContent = 'có mốc giờ theo plan ✓'; } });
  const card = [...$$('.w4-card', v)].find(c => /Xem trước thứ tự|Chỉnh Giai đoạn/.test((c.querySelector('h4') || {}).textContent || ''));
  if (!card || card.dataset.v8) return;
  card.dataset.v8 = 1;
  card.innerHTML = `<h4><span class="w4-n">3</span> Xem trước lịch theo mốc giờ <span class="muted small" style="font-weight:400">· giống “Plan Shutdown” – đổi giờ Shutdown thì cả lịch dời theo</span></h4>${timeline(d)}`;
}
const _r = WR.render;
WR.render = function (...a) { const r = _r.apply(this, a); try { patch(); } catch (e) { console.warn('[v8]', e); } return r; };
const v = $('#wrView');
if (v) {
  v.addEventListener('change', e => {
    const o = e.target.dataset.v8o, du = e.target.dataset.v8d;
    if (o !== undefined) { WR.data.rows[+o].off = Math.max(0, U.num(e.target.value, 0)); WR.render(); }
    if (du !== undefined) { WR.data.rows[+du].dur = Math.max(.1, U.num(e.target.value, 1)); WR.render(); }
  });
  v.addEventListener('input', e => { if (e.target.id === 'wrStart') setTimeout(() => { const c = $('.w4-card[data-v8]', v); if (c) { delete c.dataset.v8; patch(); } }, 300); });
}
if (document.body.classList.contains('wr-mode')) WR.render();
console.log('[v8] đã nạp – lịch theo mốc giờ');
} catch (err) { console.error('[v8] lỗi:', err); }
}
document.addEventListener('DOMContentLoaded', () => setTimeout(boot, 360));
})();
</script>

<script>
(function () {
'use strict';
function boot() {
try {
if (typeof sb === 'undefined' || typeof cloudSave !== 'function') { console.warn('[v9] Chưa có Supabase.'); return; }
const pill = document.createElement('div'); pill.id = 'v9Sync'; pill.title = 'Bấm để thử đồng bộ lại'; document.body.appendChild(pill);
let timer = null, retry = null, tries = 0, pending = false, busy = false, warned = false;
const canWrite = () => !(window.Auth && !Auth.ok) || document.body.classList.contains('op-mode');
function show(state, text) {
  pill.className = state ? 'show ' + state : '';
  pill.innerHTML = state ? `<i></i>${text}` : '';
  if (state === 'ok') setTimeout(() => { if (pill.classList.contains('ok')) pill.className = ''; }, 2500);
}
async function push() {
  if (busy) { pending = true; return; }
  busy = true; pending = false;
  const payload = { plans: Store.state.plans, savedAt: Date.now(), by: CLIENT_ID };
  try {
    const { error } = await sb.from('planner_state').upsert({ id: 1, data: payload, updated_at: new Date().toISOString() });
    if (error) throw new Error(error.message || 'Supabase lỗi');
    lastCloudAt = payload.savedAt;
    if (tries || warned) show('ok', 'Đã đồng bộ cloud ✓');
    tries = 0; warned = false; clearTimeout(retry);
  } catch (e) {
    tries++;
    console.warn('[v9] lưu cloud lỗi lần ' + tries + ':', e && e.message);
    const wait = Math.min(60, [3, 8, 15, 30][tries - 1] || 60);
    show('wait', `Chưa lưu được lên cloud – tự thử lại sau ${wait}s (dữ liệu vẫn trên máy)`);
    if (!warned) { warned = true; toast('Mất kết nối cloud – dữ liệu vẫn lưu trên máy này, sẽ tự đồng bộ khi có mạng.', 'warn'); }
    clearTimeout(retry); retry = setTimeout(push, wait * 1000);
  } finally {
    busy = false;
    if (pending) { clearTimeout(timer); timer = setTimeout(push, 500); }
  }
}
/* Thay hàm lưu cũ (cũ: báo lỗi đỏ mỗi lần, không thử lại) */
cloudSave = function () {
  if (!canWrite()) return;
  clearTimeout(timer); timer = setTimeout(push, 800);
};
pill.onclick = () => { tries = 0; clearTimeout(retry); push(); };
window.addEventListener('online', () => { if (tries) { tries = 0; push(); } });
console.log('[v9] đã nạp – lưu cloud tự thử lại');
} catch (err) { console.error('[v9] lỗi:', err); }
}
document.addEventListener('DOMContentLoaded', () => setTimeout(boot, 420));
})();
</script>

<script>
(function () {
'use strict';
/* =====================================================================
   1. PPE: nhận diện chữ người dùng ghi → đúng món bảo hộ chuẩn
   ===================================================================== */
const NV = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[đĐ]/g, 'd').toLowerCase().replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
const PPE_RULES = [            // thứ tự quan trọng: món cụ thể trước, món chung sau
  ['harness', 'Dây an toàn trên cao', /(day|dai) an toan|toan than|harness|chong roi/],
  ['heat',    'Bảo hộ chịu nhiệt',   /chiu nhiet|cach nhiet|nhiet|heat|ao dai tay/],
  ['chem',    'Bảo hộ hóa chất',     /hoa chat|tap de|chemical|chong axit|apron/],
  ['loto',    'Khóa LOTO cá nhân',   /loto|khoa ca nhan|o khoa|padlock/],
  ['vest',    'Áo phản quang',       /phan quang|vest|ao pq/],
  ['mask',    'Khẩu trang / mặt nạ', /mat na|khau trang|mask|ho hap|n95|phin loc/],
  ['ear',     'Nút / chụp tai',      /\btai\b|nut tai|chup tai|ear|tieng on|chong on/],
  ['glasses', 'Kính bảo hộ',         /\bkinh\b|goggle|glass|che mat|tam che/],
  ['gloves',  'Găng tay',            /\bgang\b|gang tay|glove/],
  ['boots',   'Giày bảo hộ',         /giay|\bung\b|boot|shoe/],
  ['helmet',  'Mũ bảo hộ',           /\bmu\b|\bnon\b|helmet|hard ?hat/],
];
function ppeId(raw) {
  const n = NV(raw); if (!n) return '';
  if (PPE_RULES.some(r => r[0] === String(raw))) return String(raw);
  for (const [id, , re] of PPE_RULES) if (re.test(n)) return id;
  return String(raw).trim();
}
const ppeLabel = id => (PPE_RULES.find(r => r[0] === id) || [, id])[1];
const normList = arr => [...new Set((Array.isArray(arr) ? arr : []).map(ppeId).filter(Boolean))];
window.PPE_DETECT = { ppeId, ppeLabel, normList };

/* sửa dữ liệu task: t.ppe (id chuẩn) + t.wr.ppeItems (tên chuẩn) + tick đã có */
function fixTask(t) {
  if (!t) return t;
  if (Array.isArray(t.ppe)) t.ppe = normList(t.ppe);
  if (t.wr && Array.isArray(t.wr.ppeItems) && t.wr.ppeItems.length) {
    const ids = normList(t.wr.ppeItems), labels = ids.map(ppeLabel);
    const old = t.wrChecks && t.wrChecks.ppe;
    if (old) { const nw = {}; Object.keys(old).forEach(k => { nw[ppeLabel(ppeId(k))] = old[k]; }); t.wrChecks = { ...t.wrChecks, ppe: nw }; }
    t.wr = { ...t.wr, ppeItems: labels };
    if (!t.ppe || !t.ppe.length) t.ppe = ids;
  }
  return t;
}

function boot() {
try {
const _nt = normalizeTask;
normalizeTask = function (t) { return fixTask(_nt(t)); };
Store.state.plans.forEach(p => p.tasks.forEach(fixTask));

/* =====================================================================
   2. PANEL TASK: 2 lựa chọn – Sau task cụ thể (nhiều, mọi process) | Task độc lập
   ===================================================================== */
const esc = s => U.esc(s ?? '');
let st = null;   // { mode:'after'|'free', sel:Set, q:'' }

const _dr = Drawer.render;
Drawer.render = function (t, isNew) {
  _dr.apply(this, arguments);
  try { inject(t, isNew); } catch (e) { console.warn('[v10]', e); }
};
function depInputs() { return $$('#d_deps input[type=checkbox], #d_deps input'); }
function setMode(v) {
  const md = $('#d_mode'); if (!md) return;
  if (md.value === 'fixed') return;
  md.value = v; md.dispatchEvent(new Event('change', { bubbles: true }));
}
function syncToForm() {
  depInputs().forEach(i => { const want = st.mode === 'after' && st.sel.has(i.value); if (i.checked !== want) { i.checked = want; i.dispatchEvent(new Event('change', { bubbles: true })); } });
  setMode(st.mode === 'after' && st.sel.size ? 'after_dependency' : 'parallel');
}
function inject(t, isNew) {
  const box = $('#drawer .xseq'); if (!box || box.querySelector('.v10-opts')) return;
  const md = $('#d_mode'); if (md && md.value === 'fixed') return;   // task cố định giờ: giữ nguyên
  box.classList.add('v10');
  const p = Store.plan(), ro = !!(window.Auth && !Auth.ok);
  const blocked = isNew ? new Set() : Scheduler.descendants(p, t.id);
  const allowed = new Set(depInputs().map(i => i.value));
  let deps = (t.dependencyIds || []).slice();
  /* task "nối tiếp" cũ → hiển thị là "sau task trước cùng process" */
  if (!deps.length && !isNew && t.executionMode === 'sequential') {
    const prev = p.tasks.filter(x => x.process === t.process && x.order < t.order && x.id !== t.id).sort((a, b) => b.order - a.order)[0];
    if (prev) deps = [prev.id];
  }
  st = { mode: deps.length ? 'after' : 'free', sel: new Set(deps), q: '', ro, blocked, allowed, self: t.id, proc: t.process };
  const wrap = document.createElement('div'); wrap.id = 'v10Box';
  const head = box.querySelector('.xs-h');
  head ? head.after(wrap) : box.prepend(wrap);
  draw();
  if (!ro) syncToForm();
}
function draw() {
  const w = $('#v10Box'); if (!w || !st) return;
  const p = Store.plan(), res = App.res, procName = ($('#d_process') && $('#d_process').value) || st.proc;
  const byId = new Map(p.tasks.map(x => [x.id, x]));
  const q = NV(st.q);
  const cand = p.tasks.filter(x => x.id !== st.self).sort((a, b) => (a.process === procName ? 0 : 1) - (b.process === procName ? 0 : 1) || a.process.localeCompare(b.process) || a.order - b.order);
  const groups = new Map();
  cand.forEach(x => { if (q && !NV(x.taskName + ' ' + x.process + ' #' + x.order).includes(q)) return; if (!groups.has(x.process)) groups.set(x.process, []); groups.get(x.process).push(x); });
  const fmt = x => { const r = res && res.R.get(x.id); return r ? 'xong ' + U.fmtDM(r.end) : ''; };
  w.innerHTML = `
    <div class="v10-opts">
      <button type="button" data-v10="after" class="${st.mode === 'after' ? 'on' : ''}" ${st.ro ? 'disabled' : ''}><span class="ic">⤷</span><span><b>Sau task cụ thể</b><small>Chờ 1 hoặc nhiều task xong mới làm (trong hoặc ngoài process)</small></span></button>
      <button type="button" data-v10="free" class="${st.mode === 'free' ? 'on' : ''}" ${st.ro ? 'disabled' : ''}><span class="ic">▶</span><span><b>Task độc lập</b><small>Không chờ task nào – làm ngay từ đầu Shutdown (hoặc theo mốc giờ)</small></span></button>
    </div>
    ${st.mode === 'after' ? `<div class="v10-pick">
      <div class="v10-sel">${st.sel.size ? [...st.sel].map(id => { const x = byId.get(id); return x ? `<span>#${x.order} ${esc(x.taskName.length > 38 ? x.taskName.slice(0, 38) + '…' : x.taskName)} <em>${esc(x.process)}</em>${st.ro ? '' : `<button type="button" data-v10rm="${esc(id)}">✕</button>`}</span>` : ''; }).join('') : '<span class="none">⚠ Chưa chọn task nào – chọn ở danh sách bên dưới</span>'}</div>
      ${st.ro ? '' : `<input class="v10-q" id="v10Q" placeholder="🔍 Tìm task theo tên / process / số…" value="${esc(st.q)}" autocomplete="off">
      <div class="v10-list">${[...groups].map(([g, l]) => `<div class="v10-g"><i style="background:${processColor(p, g)}"></i>${esc(g)}${g === procName ? ' <em>· cùng process</em>' : ''}</div>
        ${l.map(x => { const dis = st.blocked.has(x.id) || !st.allowed.has(x.id), on = st.sel.has(x.id);
          return `<button type="button" class="v10-it ${on ? 'on' : ''} ${dis && !on ? 'dis' : ''}" data-v10t="${esc(x.id)}" ${dis && !on ? 'disabled title="Không chọn được – task này đang chạy sau task hiện tại (sẽ tạo vòng lặp)"' : ''}>
            <span class="ck">${on ? '✓' : ''}</span>#${x.order} ${esc(x.taskName)}<small>${esc(fmt(x))}</small></button>`; }).join('')}`).join('') || '<div class="v10-hint" style="padding:10px">Không tìm thấy task.</div>'}</div>
      <div class="v10-hint">Chọn được nhiều task. Task này chỉ bắt đầu khi <b>tất cả</b> task đã chọn xong.</div>`}
    </div>` : `<div class="v10-ind">▶ Task chạy độc lập – không phụ thuộc task nào.</div>`}`;
  if (document.activeElement && document.activeElement.id === 'v10Q') { }
}
document.addEventListener('click', e => {
  if (!st || !e.target.closest || !e.target.closest('#v10Box')) return;
  const m = e.target.closest('[data-v10]'), it = e.target.closest('[data-v10t]'), rm = e.target.closest('[data-v10rm]');
  if (m) { st.mode = m.dataset.v10; }
  else if (it && !it.disabled) { const id = it.dataset.v10t; st.sel.has(id) ? st.sel.delete(id) : st.sel.add(id); }
  else if (rm) { st.sel.delete(rm.dataset.v10rm); }
  else return;
  e.preventDefault(); syncToForm(); draw();
  const q = $('#v10Q'); if (q && st.q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
});
document.addEventListener('input', e => {
  if (e.target.id !== 'v10Q' || !st) return;
  st.q = e.target.value; draw();
  const q = $('#v10Q'); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
});
document.addEventListener('change', e => { if (e.target.id === 'd_process' && st) draw(); });

/* chặn lưu khi chọn "Sau task cụ thể" mà chưa chọn task nào */
const _sv = Drawer.save;
Drawer.save = function (...a) {
  if (st && $('#v10Box') && st.mode === 'after' && !st.sel.size) { toast('Chọn ít nhất 1 task phải xong trước, hoặc chọn “Task độc lập”.', 'warn'); return; }
  if (st && $('#v10Box')) syncToForm();
  return _sv.apply(this, a);
};
if (App.res) App.render();
console.log('[v10] đã nạp – PPE nhận diện + 2 lựa chọn bắt đầu');
} catch (err) { console.error('[v10] lỗi:', err); }
}
document.addEventListener('DOMContentLoaded', () => setTimeout(boot, 480));
})();
</script>
