<script>
(function () {
'use strict';
const mobile = () => matchMedia('(max-width:700px)').matches;
const isOpen = m => m && !m.classList.contains('hidden') && getComputedStyle(m).display !== 'none';
function fit() {
  const menus = [...document.querySelectorAll('.dd-menu')], any = menus.some(isOpen);
  document.body.classList.toggle('v11-open', any && mobile());
  if (mobile()) return;
  menus.forEach(m => {
    if (!isOpen(m)) { m.style.removeProperty('margin-left'); return; }
    m.style.marginLeft = '0px';
    const r = m.getBoundingClientRect(), pad = 8;
    let dx = 0;
    if (r.left < pad) dx = pad - r.left;
    else if (r.right > innerWidth - pad) dx = innerWidth - pad - r.right;
    if (dx) m.style.marginLeft = dx + 'px';
  });
}
document.addEventListener('click', () => requestAnimationFrame(() => requestAnimationFrame(fit)), true);
window.addEventListener('resize', fit);
/* bấm nền mờ (điện thoại) để đóng menu */
document.addEventListener('click', e => {
  if (!document.body.classList.contains('v11-open')) return;
  if (e.target.closest('.dd-menu') || e.target.closest('#btnMore') || e.target.closest('#btnExport')) return;

  z-index:500!important;max-height:calc(100dvh - 24px);overflow-y:auto;min-width:240px}

<script>
(function () {
'use strict';
const pairs = [];   // [menu, nút mở]
const mobile = () => matchMedia('(max-width:700px)').matches;
const isOpen = m => !m.classList.contains('hidden') && getComputedStyle(m).display !== 'none';
function setup() {
  document.querySelectorAll('.dd-menu').forEach(m => {
    if (m.classList.contains('v12')) return;
    const wrap = m.parentElement;
    const btn = (m.id === 'menuMore' && document.getElementById('btnMore')) || (m.id === 'menuExport' && document.getElementById('btnExport'))
      || (wrap && wrap.querySelector('button:not(.dd-menu button)'));
    m.classList.add('v12');
    document.body.appendChild(m);          // đưa menu ra khỏi thanh kính mờ
    pairs.push([m, btn]);
  });
}
function place() {
  let any = false;
  pairs.forEach(([m, b]) => {
    if (!isOpen(m)) return;
    any = true;

function ensureEar() {
  if (adsBusy || typeof Store === 'undefined' || !Store.plan) return;
  const p = Store.plan(); if (!p || !p.tasks.length) return;
  let res; try { res = App.res && App.res.R ? App.res : Scheduler.schedule(p); } catch (e) { return; }
  const ads = p.tasks.filter(t => NV(t.process) === 'ads'); if (!ads.length) return;
  const adsEnd = Math.max(...ads.map(t => (res.R.get(t.id) || {}).end || 0));
  let changed = false;
  p.tasks.forEach(t => {
    const r = res.R.get(t.id); if (!r || r.start >= adsEnd) return;
    t.ppe = Array.isArray(t.ppe) ? t.ppe : [];
    if (!t.ppe.includes('ear')) { t.ppe.push('ear'); changed = true; }
    if (t.wr) { const it = t.wr.ppeItems || []; if (!it.some(x => /tai/i.test(x))) { t.wr.ppeItems = [...it, 'Nút / chụp tai']; changed = true; } }
  });

}

const _fetch = window.fetch.bind(window);
window.fetch = async function (input, init) {
  const url = typeof input === 'string' ? input : (input && input.url) || '';
  if (/drive\.google\.com\/drive\/folders/.test(url)) {
    throw new Error('Link sai: đang dùng link THƯ MỤC Drive. Cần link Web App Apps Script dạng https://script.google.com/macros/s/…/exec');
  }
  if (!/script\.google(usercontent)?\.com\/macros\//.test(url) || !init || init.signal || String(init.method || 'GET').toUpperCase() !== 'POST') return _fetch(input, init);
  if (!/\/exec(\?|$)/.test(url)) throw new Error('Link Apps Script phải kết thúc bằng /exec (không dùng link /dev hoặc link trang soạn code).');
  const opt = { ...init, redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' } };
  let last;
  for (let i = 0; i < 3; i++) {
    try {
      const r = await _fetch(url, opt);
      const txt = await r.clone().text();
      if (/<html|accounts\.google\.com|ServiceLogin/i.test(txt)) throw new Error('Apps Script yêu cầu đăng nhập Google → Deploy lại với "Who has access: Anyone".');
      return r;
    } catch (e) { last = e; if (/Anyone|exec|Link sai/.test(e.message)) break; await new Promise(z => setTimeout(z, 1200 * (i + 1))); }
  }
  throw new Error(last && /Failed to fetch/i.test(last.message) ? 'Không gửi được ảnh: mạng công ty chặn script.google.com hoặc link sai. Thử bằng 4G.' : (last ? last.message : 'Upload lỗi'));
};

<script>
(function () {
'use strict';
const NV = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[đĐ]/g, 'd').toLowerCase().replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
const esc = s => U.esc(s ?? '');
const ini = n => String(n || '').trim().split(/\s+/).slice(-2).map(w => w[0] || '').join('').toUpperCase();

/* ===================== PPE: gộp món trùng ===================== */
const RULES = [
  ['harness', 'Dây an toàn trên cao', /(day|dai) an toan|toan than|harness/],
  ['heat', 'Bảo hộ chịu nhiệt', /chiu nhiet|cach nhiet|ao dai tay|heat/],
  ['chem', 'Áo tạp dề hóa chất', /hoa chat|tap de|chemical|apron/],
  ['loto', 'Khóa LOTO cá nhân', /loto|khoa ca nhan|padlock/],
  ['vest', 'Áo phản quang', /phan quang|vest/],
  ['mask', 'Khẩu trang', /mat na|khau trang|mask|ho hap|n95/],
  ['ear', 'Nút / chụp tai', /\btai\b|chup tai|nut tai|ear|chong on|tieng on/],
  ['glasses', 'Kính bảo hộ', /\bkinh\b|goggle|glass/],
  ['gloves', 'Găng tay', /\bgang\b|glove/],
  ['boots', 'Giày bảo hộ', /giay|\bung\b|boot|shoe/],
  ['helmet', 'Mũ bảo hộ', /\bmu\b|\bnon\b|helmet|hard ?hat/],
];
const IDS = RULES.map(r => r[0]);
function pid(raw) {
  const s = String(raw ?? '').trim(); if (!s) return '';
  if (IDS.includes(s)) return s;
  const n = NV(s); for (const [id, , re] of RULES) if (re.test(n)) return id;
  return s;
}
const plabel = id => (RULES.find(r => r[0] === id) || [, id])[1];
function fixPPE(t) {
  if (!t) return;
  if (Array.isArray(t.ppe)) { const v = [...new Set(t.ppe.map(pid).filter(Boolean))]; if (v.join() !== t.ppe.join()) t.ppe = v; }
  if (t.wr && Array.isArray(t.wr.ppeItems)) {
    const v = [...new Set(t.wr.ppeItems.map(x => plabel(pid(x))))];
    if (v.join() !== t.wr.ppeItems.join()) {
      const old = t.wrChecks && t.wrChecks.ppe;
      if (old) { const nw = {}; Object.keys(old).forEach(k => nw[plabel(pid(k))] = old[k]); t.wrChecks = { ...t.wrChecks, ppe: nw }; }
      t.wr = { ...t.wr, ppeItems: v };

const fixAll = () => { try { Store.state.plans.forEach(p => p.tasks.forEach(fixPPE)); } catch (e) { } };

/* ===================== Phụ thuộc: chọn nhiều + phá vòng lặp ===================== */
function unlock(root) {

    b.disabled = false; b.classList.remove('dis'); b.classList.add('v15-move');
    b.title = 'Chọn task này → task hiện tại sẽ được dời ra sau nó';
  });
  (root || document).querySelectorAll('#v10Box .v10-hint').forEach(h => { if (!h.dataset.v15) { h.dataset.v15 = 1; h.innerHTML = 'Chọn được <b>nhiều task</b>, cả trong và ngoài process. Task này chỉ bắt đầu khi <b>tất cả</b> task đã chọn xong.'; } });
}
function hideOldDeps() {

}
function applyDeps(pl, tid, sel, oldDeps) {
  const T = pl.tasks.find(x => x.id === tid); if (!T) return 0;
  const byId = new Map(pl.tasks.map(x => [x.id, x]));
  sel = sel.filter(id => id !== tid && byId.has(id));
  let moved = 0;
  for (let guard = 0; guard < 60; guard++) {
    const desc = Scheduler.descendants(pl, tid);
    const bad = sel.filter(s => desc.has(s)); if (!bad.length) break;
    const reach = c => bad.includes(c.id) || bad.some(b => Scheduler.descendants(pl, c.id).has(b));
    const sameProc = pl.tasks.filter(x => x.process === T.process).sort((a, b) => a.order - b.order);
    const nextSeq = sameProc[sameProc.findIndex(x => x.id === tid) + 1];
    let progress = false;
    pl.tasks.forEach(c => {
      if (c.id === tid) return;
      const explicit = (c.dependencyIds || []).includes(tid);
      const implicit = !explicit && c === nextSeq && c.executionMode === 'sequential';
      if (!(explicit || implicit) || !reach(c)) return;
      const nd = [...new Set([...(c.dependencyIds || []).filter(x => x !== tid), ...oldDeps.filter(x => x !== c.id)])];
      c.dependencyIds = nd; c.executionMode = nd.length ? 'after_dependency' : 'parallel';
      if (implicit) T.executionMode = 'after_dependency';
      progress = true; moved++;
    });
    T.dependencyIds = []; T.executionMode = 'parallel';   // tạm tách để tính lại
    if (!progress) break;
  }
  const desc = Scheduler.descendants(pl, tid);
  T.dependencyIds = sel.filter(s => !desc.has(s));
  T.executionMode = T.dependencyIds.length ? 'after_dependency' : 'parallel';

    let moved = 0;
    Store.commit('Gán task phải xong trước', pl => { moved = applyDeps(pl, tid, sd.ids, oldDeps); });

  };
  const choose = name => {

    const m = openModal(`<div class="modal-h"><h3>👋 Bạn là ai?</h3><button class="x" data-close>×</button></div>
      <div class="modal-b"><input class="v15-q" id="v15Q" placeholder="🔍 Gõ tên của bạn (vd: ky, loc)…" autocomplete="off"><div class="v15-list" id="v15L"></div></div>
      <div class="modal-f"><button class="btn" id="v15All">Xem tất cả việc theo ca</button></div>`, 'v15-pick');
    const draw = () => {
      const q = NV(m.querySelector('#v15Q').value), tk = q.split(' ').filter(Boolean);
      const list = all.filter(p => tk.every(k => new RegExp('(^| )' + k).test(NV(p.name))));
      m.querySelector('#v15L').innerHTML = list.map(p => `<button class="v15-p ${U.norm(p.name) === saved ? 'on' : ''}" data-v15n="${esc(p.name)}"><span class="av">${esc(ini(p.name))}</span><span>${esc(p.name)}<small>${p.n} việc</small></span></button>`).join('')
        || `<div class="v15-none">Không có ai tên “${esc(m.querySelector('#v15Q').value)}” trong kế hoạch.</div>`;
    };
    m.querySelector('#v15Q').addEventListener('input', draw);
    m.querySelector('#v15Q').addEventListener('keydown', e => { if (e.key === 'Enter') { const f = m.querySelector('[data-v15n]'); if (f) choose(f.dataset.v15n); } });

}

    <div class="v17-b">
      ${isAdmin() ? `<div class="v17-cfg">📁 Link thư mục Drive chứa ảnh: <input id="v17F" value="${esc(folder)}" placeholder="https://drive.google.com/drive/folders/…"><button class="v17-btn pri" id="v17Save">Lưu link</button></div>`
        : (!folder ? '<div class="v17-cfg">ℹ️ Chưa có link thư mục Drive – nhờ người lập kế hoạch (đã đăng nhập) dán link vào đây.</div>' : '')}
      <div class="v17-sum"><span>📷 ${list.length} ảnh đang hiện</span><span>· ${total} ảnh trong kế hoạch “${esc(p.name)}”</span><span>· bấm vào ảnh để xem bản gốc trên Drive</span></div>
      ${list.length ? [...groups.values()].map(g => { const t = g[0].t;
        return `<div class="v17-task" style="--c:${processColor(p, t.process)}"><i></i>#${t.order} ${esc(t.taskName)} <small>· ${esc(t.process)} · ${g.length} ảnh</small></div>
        <div class="v17-grid">${g.map(x => `<a class="v17-ph" href="${esc(x.url || 'https://drive.google.com/file/d/' + x.fid + '/view')}" target="_blank" rel="noopener">
          <img loading="lazy" src="https://drive.google.com/thumbnail?id=${encodeURIComponent(x.fid)}&sz=w400" alt="" onerror="this.style.opacity=.15">
          <span>${esc(x.label)}<br>👤 ${esc(x.by || '—')} · ${esc(fmt(x.at))}${x.ca ? ' · Ca ' + x.ca : ''}</span></a>`).join('')}</div>`; }).join('')
      : `<div class="v17-empty">📭 ${gf.who === 'me' ? 'Bạn chưa upload ảnh nào.' : 'Chưa có ảnh nào được upload.'}</div>`}
    </div>`;
  box.querySelector('#v17X').onclick = closeGallery;
  box.querySelector('#v17Who').onchange = e => { gf.who = e.target.value; drawGallery(); };
  const q = box.querySelector('#v17Q');

  const sv = box.querySelector('#v17Save');
  if (sv) sv.onclick = () => {
    const v = box.querySelector('#v17F').value.trim();

    toast('Đã lưu link thư mục Drive.', 'ok'); drawGallery();
  };
}
/* nút trên đầu Report ca */
function addBtn() {

/* ---------------- POPUP NHẬP TÊN: bật chắc chắn ---------------- */
let wasOn = false;

function tick() {

     DÁN NGAY TRƯỚC dòng </body> (sau tất cả các khối khác)
     ===================================================================== -->
<style id="v19-style">

<script>
(function () {
'use strict';
/* Có thể dán link Apps Script (/exec) vào đây nếu muốn cố định riêng cho khối này */
const V19_UPLOAD_URL = 'https://script.google.com/macros/s/AKfycbwBBRYjbZDwdDTpNLSsjTgJzElSd8NGgXjmqxIq97rGCL0-Cxtk-mYu0oNi7oQP-qJ0/exec';
const MAX_SIDE = 1280, QUALITY = 0.72, PARALLEL = 2, TIMEOUT = 45000, RETRY = 1;

const pad = n => String(n).padStart(2, '0');
const stamp = () => { const d = new Date(); return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`; };
const uid = () => Math.random().toString(36).slice(2, 10);
const OP = () => window.OperatorView;
const myName = () => { try { return SafeStore.get('op.name') || ''; } catch (e) { return ''; } };

/* ---------- lấy link Apps Script ---------- */
function uploadUrl() {
  if (/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec/.test(V19_UPLOAD_URL)) return V19_UPLOAD_URL;
  for (const s of document.scripts) {                    // đọc link đã gắn cứng trong code (const UPLOAD_URL = '...')
    const m = /const\s+UPLOAD_URL\s*=\s*'(https:\/\/script\.google\.com\/macros\/s\/[^']+\/exec)'/.exec(s.textContent || '');
    if (m) return m[1];
  }
  const p = (Store.state.plans || []).find(x => x.uploadUrl);
  return p ? p.uploadUrl : '';
}

/* ---------- nén ảnh ---------- */
async function loadBitmap(file) {
  if (window.createImageBitmap) { try { return await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch (e) { } }
  const url = URL.createObjectURL(file);
  try { return await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error('Không đọc được ảnh')); i.src = url; }); }
  finally { setTimeout(() => URL.revokeObjectURL(url), 3000); }
}
function draw(img, max, q) {
  const w = img.width || img.naturalWidth, h = img.height || img.naturalHeight, s = Math.min(1, max / Math.max(w, h));
  const c = document.createElement('canvas'); c.width = Math.round(w * s); c.height = Math.round(h * s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', q);
}

/* ---------- hàng đợi upload ---------- */
const queue = [], running = new Set();
function key(taskId, reqId) { return taskId + '|' + reqId; }
function rerender() { try { App.render(); } catch (e) { } }
function setItem(it, patch) { const full = patch.state && patch.state !== it.state; Object.assign(it, patch); if (full) rerender(); else decorate(); }

function enqueue(planId, taskId, reqId, file) {
  const op = OP(); if (!op) return;
  if (!myName()) { toast('Hãy nhập tên trước khi chụp ảnh (nút tên ở góc trên).', 'warn'); return; }
  if (!uploadUrl()) { toast('Chưa cài link lưu ảnh (Apps Script /exec). Báo người lập kế hoạch.', 'err'); return; }
  const k = key(taskId, reqId), it = { k: uid(), prev: '', state: 'up', err: '', pct: 5, file, planId, taskId, reqId, ctrl: null, tries: 0, ca: op.ca };
  if (!op.local.has(k)) op.local.set(k, []);
  op.local.get(k).push(it); rerender();
  queue.push(it); pump();
}
function pump() {
  while (running.size < PARALLEL && queue.length) {
    const it = queue.shift(); if (it.cancel) continue;
    running.add(it);
    run(it).finally(() => { running.delete(it); pump(); });
  }
}
async function run(it) {
  const op = OP();
  try {
    if (!it.data) {
      const img = await loadBitmap(it.file);
      it.data = draw(img, MAX_SIDE, QUALITY);
      it.prev = draw(img, 300, 0.65);
      if (img.close) img.close();
      setItem(it, { pct: 25 });
    }
    const p = Store.state.plans.find(x => x.id === it.planId), t = p && p.tasks.find(x => x.id === it.taskId);
    if (!t) throw new Error('Task không còn tồn tại');
    const ev = (t.evidence || []).find(e => e.id === it.reqId) || { label: 'Anh' };
    const dd = pad(new Date().getDate()) + '-' + pad(new Date().getMonth() + 1);
    const body = JSON.stringify({ plan: p.name, folder: `${pad(t.order)} ${t.taskName} – Ca ${it.ca} (${dd})`,
      name: `${String(ev.label).replace(/^.*?· /, '')}_${myName()}_${stamp()}_${it.k.slice(0, 4)}.jpg`, mime: 'image/jpeg', data: it.data.split(',')[1] });
    let j = null, last = null;
    for (it.tries = 0; it.tries <= RETRY && !it.cancel; it.tries++) {
      it.ctrl = new AbortController();
      const tm = setTimeout(() => it.ctrl.abort(), TIMEOUT);
      setItem(it, { pct: 35 + it.tries * 15, err: it.tries ? `thử lại lần ${it.tries}` : '' });
      try {
        it.t0 = Date.now();
        const r = await fetch(uploadUrl(), { method: 'POST', body, signal: it.ctrl.signal, redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' } });
        const txt = await r.text();
        try { j = JSON.parse(txt); } catch (e) { throw new Error(/accounts\.google|ServiceLogin|<html/i.test(txt) ? 'Apps Script chưa để "Anyone"' : 'Apps Script trả lỗi'); }
        if (!j.ok) throw new Error(j.error || 'Upload lỗi');
        clearTimeout(tm); break;
      } catch (e) {
        clearTimeout(tm); j = null;
        last = it.cancel ? new Error('Đã hủy') : e.name === 'AbortError' ? new Error('Mạng chậm – quá 60 giây') : e;
        if (it.cancel || /Anyone/.test(last.message)) break;
        await new Promise(z => setTimeout(z, 1500 * (it.tries + 1)));
      }
    }
    if (it.cancel) return;
    if (!j) throw last || new Error('Upload lỗi');
    setItem(it, { pct: 95 });
    op.prev.set(j.id, it.prev);
    Store.commit('Upload ảnh: ' + t.taskName, pl => {
      const p2 = pl && pl.tasks ? pl : Store.state.plans.find(x => x.id === it.planId);
      const tk = (p2 && p2.tasks || []).find(x => x.id === it.taskId) || Store.state.plans.find(x => x.id === it.planId).tasks.find(x => x.id === it.taskId);
      if (!tk) return false;
      tk.proofs = tk.proofs || {};
      (tk.proofs[it.reqId] = tk.proofs[it.reqId] || []).push({ fid: j.id, url: j.url, by: myName(), at: Date.now(), ca: it.ca });
      if (j.folder) tk.proofFolder = j.folder;
      if ((tk.progress || 0) < 100) tk.progress = Math.max(tk.progress || 0, progressOf(tk));
    });
    removeLocal(it);
    toast('✓ Đã lưu ảnh', 'ok');
  } catch (e) {
    if (it.cancel) return;
    setItem(it, { state: 'fail', err: (e && e.message) || 'Lỗi', pct: 0 });
  }
}
function progressOf(t) {
  const ev = (t.evidence && t.evidence.length) ? t.evidence : [{ id: 'done', min: 1 }];
  let h = 0, n = 0; ev.forEach(e => { const k = Math.max(1, e.min || 1); n += k; h += Math.min(k, ((t.proofs || {})[e.id] || []).length); });
  return Math.round(90 * h / Math.max(1, n));
}
function removeLocal(it) {
  const op = OP(), k = key(it.taskId, it.reqId), arr = op.local.get(k) || [];
  op.local.set(k, arr.filter(x => x !== it)); rerender();
}
function cancel(itK) {
  const op = OP();
  for (const arr of op.local.values()) {
    const it = arr.find(x => x.k === itK); if (!it) continue;
    it.cancel = true; try { it.ctrl && it.ctrl.abort(); } catch (e) { }
    const i = queue.indexOf(it); if (i >= 0) queue.splice(i, 1);
    removeLocal(it); toast('Đã hủy ảnh đang gửi', 'ok'); return;
  }
}

/* ---------- xóa ảnh đã gửi (khi task chưa đóng) ---------- */
async function deleteProof(planId, taskId, reqId, fid) {
  const p = Store.state.plans.find(x => x.id === planId), t = p && p.tasks.find(x => x.id === taskId); if (!t) return;
  if ((t.progress || 0) >= 100) { toast('Task đã đóng – không xóa ảnh được.', 'warn'); return; }
  if (!confirm('Xóa ảnh này để chụp tấm khác?')) return;
  Store.commit('Xóa ảnh', pl => {
    const tk = Store.state.plans.find(x => x.id === planId).tasks.find(x => x.id === taskId); if (!tk || !tk.proofs) return false;
    tk.proofs[reqId] = (tk.proofs[reqId] || []).filter(x => x.fid !== fid);
    if ((tk.progress || 0) < 100) tk.progress = progressOf(tk);
  });
  toast('Đã xóa ảnh', 'ok');
  const u = uploadUrl();   // chuyển file trên Drive vào thùng rác (Apps Script v2 mới hỗ trợ; bản cũ bỏ qua, không lỗi)
  if (u) fetch(u, { method: 'POST', body: JSON.stringify({ action: 'delete', id: fid }), headers: { 'Content-Type': 'text/plain;charset=utf-8' } }).catch(() => { });
}

/* ---------- gắn nút ✕ + thanh tiến độ vào màn hình ảnh ---------- */
function decorate() {
  const op = OP(), s = op && op.sheet; if (!s || !document.body.contains(s.m)) return;
  const p = Store.state.plans.find(x => x.id === s.planId), t = p && p.tasks.find(x => x.id === s.taskId); if (!t) return;
  const done = (t.progress || 0) >= 100;
  s.m.querySelectorAll('.op-req').forEach(req => {
    const inp = req.querySelector('input[data-req]'); const reqId = inp ? inp.dataset.req : (req.querySelector('[data-req]') || {}).dataset?.req;
    if (!reqId) return;
    const proofs = (t.proofs || {})[reqId] || [], locs = op.local.get(key(t.id, reqId)) || [];
    const anchors = [...req.querySelectorAll('.op-thumbs > a')], pend = [...req.querySelectorAll('.op-thumbs > .up, .op-thumbs > .fail')];
    anchors.forEach((a, i) => {
      a.querySelectorAll('i[data-rm]').forEach(x => x.remove());
      const pr = proofs[i]; if (!pr || done || a.querySelector('.v19-x')) return;
      a.insertAdjacentHTML('beforeend', `<button type="button" class="v19-x" title="Xóa ảnh này" data-v19rm="${pr.fid}" data-req="${reqId}">✕</button>`);
    });
    pend.forEach((d, i) => {
      const it = locs[i]; if (!it) return;
      if (d.classList.contains('up')) {
        d.style.setProperty('--v19p', (it.pct || 10) + '%');
        const sec = it.t0 ? Math.round((Date.now() - it.t0) / 1000) : 0;
        const txt = it.err ? `Đang gửi… (${it.err})` : (it.pct < 30 ? 'Đang nén ảnh…' : `Đang gửi lên Drive… ${sec}s`);
        const sm = d.querySelector('small'); if (sm && sm.textContent !== txt) sm.textContent = txt;
      } else if (d.classList.contains('fail')) {
        const txt = '⚠ ' + it.err + ' – chạm để gửi lại'; const sm = d.querySelector('small'); if (sm && sm.textContent !== txt) sm.textContent = txt; d.dataset.v19retry = it.k;
      }
      if (!d.querySelector('.v19-x')) d.insertAdjacentHTML('beforeend', `<button type="button" class="v19-x" title="${d.classList.contains('up') ? 'Hủy gửi' : 'Bỏ ảnh lỗi'}" data-v19c="${it.k}">✕</button>`);
    });
  });
  const n = running.size + queue.length, f = s.m.querySelector('#opSheetF');
  let bar = s.m.querySelector('.v19-bar');
  if (n && f) { if (!bar) { bar = document.createElement('div'); bar.className = 'v19-bar'; f.prepend(bar); } const h = `<i></i>Đang gửi ${n} ảnh – có thể tiếp tục chụp, không cần chờ`; if (bar.innerHTML !== h) bar.innerHTML = h; }
  else if (bar) bar.remove();
}

/* ---------- chặn luồng upload cũ, dùng luồng mới ---------- */
document.addEventListener('change', e => {
  const inp = e.target; if (!inp || inp.type !== 'file' || !inp.dataset || !inp.dataset.req) return;
  const op = OP(); if (!op || !op.sheet || !op.sheet.m.contains(inp)) return;
  e.stopImmediatePropagation();
  const files = [...inp.files]; inp.value = '';
  files.forEach(f => enqueue(op.sheet.planId, op.sheet.taskId, inp.dataset.req, f));
}, true);
document.addEventListener('click', e => {
  const c = e.target.closest && e.target.closest('[data-v19c]');
  if (c) { e.preventDefault(); e.stopImmediatePropagation(); return cancel(c.dataset.v19c); }
  const r = e.target.closest && e.target.closest('[data-v19rm]');
  if (r) { e.preventDefault(); e.stopImmediatePropagation(); const s = OP().sheet; return deleteProof(s.planId, s.taskId, r.dataset.req, r.dataset.v19rm); }
  const f = e.target.closest && e.target.closest('.op-thumbs [data-fail]');
  if (f && !e.target.closest('.v19-x')) {
    e.preventDefault(); e.stopImmediatePropagation();
    const k = f.dataset.v19retry; if (!k) return;
    for (const arr of OP().local.values()) { const it = arr.find(x => x.k === k); if (it) { Object.assign(it, { state: 'up', err: '', pct: 30, cancel: false }); rerender(); queue.push(it); pump(); break; } }
  }
}, true);

function boot() {
  const op = OP(); if (!op) { console.warn('[v19] Chưa có Report ca'); return; }
  const _o = op.openTask;
  op.openTask = function (...a) {
    const r = _o.apply(this, a);
    const b = op.sheet && op.sheet.m;
    if (b) new MutationObserver(() => { clearTimeout(b._v19); b._v19 = setTimeout(decorate, 30); }).observe(b, { childList: true, subtree: true });
    decorate(); return r;
  };
  setInterval(() => { if (running.size) decorate(); }, 1000);
  window.addEventListener('beforeunload', e => { if (running.size || queue.length) { e.preventDefault(); e.returnValue = 'Còn ảnh đang gửi'; } });
  console.log('[v19] đã nạp – upload ảnh ổn định + xóa ảnh');
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => setTimeout(boot, 900)); else setTimeout(boot, 900);
})();
</script>
<!-- ===================== HẾT v19 ===================== -->
  
<!-- =====================================================================
     v20 – GÓI SỬA 19/10
       1. Gantt: tên task hiện TRÀN RA BÊN PHẢI thanh (cạnh tên người), không nằm trong ô
       2. Tab Tạo lịch: link SharePoint LDC hiện ngay từ đầu
       3. Nút ＋ nổi trên Planner: thêm nhanh 1 task
       4. ✂ Tách task: làm được 1 phần → chuyển phần còn lại sang process / ngày giờ khác
       5. ⏸ Hold task: tạm ngưng task, chọn lại thứ tự cho các task đang chạy sau nó
       6. ▶ Normal run: process chưa tới giờ shutdown → tạo đoạn "Normal run" theo ca + gán người theo LDC
       7. Report ca: hiện rõ GIỜ KẾ HOẠCH + nhập GIỜ THỰC TẾ → Planner tự dời theo
     DÁN NGAY TRƯỚC dòng </body> (sau tất cả các khối khác)
     ===================================================================== -->

<script>
(function () {
'use strict';
const LDC_LINK = 'https://nestle.sharepoint.com/:x:/r/teams/TAF_SCHEDULE_DATA/_layouts/15/Doc.aspx?sourcedoc=%7BB01C8F64-EB26-490C-83BE-5F493A25B47E%7D&file=LDC.xlsx&action=default&mobileredirect=true&DefaultItemOpen=1';
const NV = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[đĐ]/g, 'd').toLowerCase().replace(/\s+/g, ' ').trim();
const esc = s => U.esc(s ?? '');
const canEdit = () => !(window.Auth && !Auth.ok);
const needLogin = () => { if (canEdit()) return false; const b = document.getElementById('auBadge'); if (b) b.click(); else toast('Cần đăng nhập để thao tác.', 'warn'); return true; };
const plan = () => Store.plan();
const sched = p => Scheduler.schedule(p || plan());
const iso = ms => U.toLocalISO(ms).slice(0, 16);

/* ======================= 1. TÊN TASK BÊN PHẢI ======================= */
function patchGantt() {
  const _tr = Gantt.taskRow;
  Gantt.taskRow = function (t, g, p) {
    let h = _tr.call(this, t, g, p);
    const who = t.assignee || t.owner || '';
    const tags = (t.hold ? '<i class="v20-tag">⏸ HOLD</i>' : '') + (t.normalRun ? '<i class="v20-tag nr">▶ Normal run</i>' : '');
    h = h.replace(/<div class="outlbl"([^>]*)>[\s\S]*?<\/div>/, `<div class="outlbl v20"$1>${tags}<b>${esc(t.taskName)}</b>${who ? `<span>· ${esc(who)}</span>` : ''}</div>`);
    if (t.hold) h = h.replace('class="grow ', 'class="grow v20-hold ');
    if (t.normalRun) h = h.replace('class="grow ', 'class="grow v20-nr ');
    return h;
  };
}

/* ======================= 2. LINK LDC HIỆN NGAY ======================= */
function ldcLink() {
  const v = document.getElementById('wrView'); if (!v) return;
  const box = [...v.querySelectorAll('.w4-file')].find(b => /lich di ca/.test(NV(b.textContent)));
  if (!box || box.querySelector('.v20-ldc')) return;
  box.querySelectorAll('.v14-ldc').forEach(x => x.remove());
  const d = document.createElement('div'); d.className = 'v14-ldc v20-ldc';
  d.innerHTML = `<b>Cách lấy file lịch đi ca:</b><ol>
    <li>Mở <a href="${LDC_LINK}" target="_blank" rel="noopener">file LDC trên SharePoint ↗</a></li>
    <li>Chọn <b>File → Tạo bản sao → Tải xuống bản sao</b></li>
    <li>Bấm <b>📤 Upload LDC.xlsx</b> bên dưới và chọn file vừa tải</li></ol>`;
  const acts = box.querySelector('.w4-acts'); acts ? box.insertBefore(d, acts) : box.appendChild(d);
}

/* ======================= 3. NÚT + NỔI ======================= */
function addFab() {
  if (document.getElementById('v20Add')) return;
  const b = document.createElement('button'); b.id = 'v20Add'; b.title = 'Thêm task'; b.textContent = '＋';
  b.onclick = () => { if (needLogin()) return; if (App.view === 'home') { toast('Mở 1 kế hoạch trước.', 'warn'); return; } Drawer.openNew(); };
  document.body.appendChild(b);
}

/* ======================= 4. TÁCH TASK ======================= */
function splitTask(id) {
  if (needLogin()) return;
  const p = plan(), t = p.tasks.find(x => x.id === id); if (!t) return;
  const r = sched(p).R.get(id), procs = [...new Set(p.tasks.map(x => x.process))];
  const half = Math.round(t.durationHours * 50) / 100;
  const m = openModal(`<div class="modal-h"><h3>✂ Tách task</h3><button class="x" data-close>×</button></div>
    <div class="modal-b"><div class="v20-note"><b>${esc(t.taskName)}</b><br>Kế hoạch: ${U.fmtDM(r.start)} → ${U.fmtDM(r.end)} · ${U.fmtDur(t.durationHours)}</div>
      <div class="v20-f">
        <label>Phần đã / sẽ làm ở đây (giờ)<input id="v20H" type="number" step="0.25" min="0.25" max="${t.durationHours - 0.25}" value="${half}"></label>
        <label>Phần còn lại (giờ)<input id="v20R" type="number" disabled value="${(t.durationHours - half).toFixed(2)}"></label>
        <label>Phần còn lại – Process<select id="v20P">${procs.map(x => `<option ${x === t.process ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select></label>
        <label>Phần còn lại – bắt đầu lúc<input id="v20S" type="datetime-local" value="${iso(r.start + half * MS_H)}"></label>
        <label class="full">Người thực hiện phần còn lại<input id="v20W" value="${esc(t.assignee || '')}" placeholder="Để trống = gán sau"></label>
      </div>
      <p class="muted small">Các task đang chạy sau task này sẽ chờ <b>phần còn lại</b> xong mới bắt đầu.</p></div>
    <div class="modal-f"><button class="btn" data-close>Hủy</button><button class="btn primary" id="v20Ok">✂ Tách</button></div>`, 'sm');
  m.querySelector('#v20H').oninput = e => { const h = U.num(e.target.value, 0); m.querySelector('#v20R').value = Math.max(0, t.durationHours - h).toFixed(2); m.querySelector('#v20S').value = iso(r.start + h * MS_H); };
  m.querySelector('#v20Ok').onclick = () => {
    const h = U.num(m.querySelector('#v20H').value, 0), rest = t.durationHours - h, st = U.parseLocalISO(m.querySelector('#v20S').value);
    if (!(h > 0 && rest > 0)) { toast('Số giờ tách phải nhỏ hơn thời lượng task.', 'warn'); return; }
    if (!isFinite(st)) { toast('Chọn giờ bắt đầu phần còn lại.', 'warn'); return; }
    let newId = null;
    Store.commit('Tách task: ' + t.taskName, pl => {
      const a = pl.tasks.find(x => x.id === id); if (!a) return false;
      const P = U.parseLocalISO(pl.start);
      const b = normalizeTask(JSON.parse(JSON.stringify(a)));
      b.id = nextTaskId(pl); newId = b.id;
      b.taskName = a.taskName.replace(/\s*\(phần \d\)$/, '') + ' (phần 2)';
      a.taskName = a.taskName.replace(/\s*\(phần \d\)$/, '') + ' (phần 1)';
      b.process = m.querySelector('#v20P').value; b.assignee = m.querySelector('#v20W').value.trim();
      b.durationHours = rest; b.standardHours = rest; a.durationHours = h; a.standardHours = h;
      b.progress = 0; b.proofs = {}; b.startedAt = null; b.doneBy = null; b.doneAt = null;
      b.dependencyIds = [a.id]; b.executionMode = 'after_dependency';
      b.constraintType = 'SNET'; b.constraintOffsetHours = (st - P) / MS_H;
      pl.tasks.forEach(x => { if (x.id !== b.id && (x.dependencyIds || []).includes(a.id)) x.dependencyIds = x.dependencyIds.map(d => d === a.id ? b.id : d); });
      b.order = a.order + 0.5; pl.tasks.push(b);
      pl.tasks.sort((x, y) => x.order - y.order).forEach((x, i) => x.order = i + 1);
    });
    closeModal(); toast('Đã tách task thành 2 phần.', 'ok');
    if (newId) setTimeout(() => Drawer.open(newId), 80);
  };
}

/* ======================= 5. HOLD TASK ======================= */
function dependentsOf(p, id) {
  const t = p.tasks.find(x => x.id === id), out = p.tasks.filter(x => (x.dependencyIds || []).includes(id));
  const same = p.tasks.filter(x => x.process === t.process).sort((a, b) => a.order - b.order);
  const nx = same[same.findIndex(x => x.id === id) + 1];
  if (nx && nx.executionMode === 'sequential' && !(nx.dependencyIds || []).length && !out.includes(nx)) out.push(nx);
  return out;
}
function holdTask(id) {
  if (needLogin()) return;
  const p = plan(), t = p.tasks.find(x => x.id === id); if (!t) return;
  const deps = dependentsOf(p, id).filter(x => !x.hold), preds = (t.dependencyIds || []).slice();
  const cand = p.tasks.filter(x => x.id !== id && !x.hold).sort((a, b) => a.order - b.order);
  const opts = sel => `<option value="">▶ Chạy độc lập</option>${preds.length ? `<option value="__pred" ${sel === '__pred' ? 'selected' : ''}>↺ Chạy sau task trước của task bị hold</option>` : ''}
    ${cand.map(c => `<option value="${esc(c.id)}">#${c.order} ${esc(c.taskName.slice(0, 45))} (${esc(c.process)})</option>`).join('')}`;
  const m = openModal(`<div class="modal-h"><h3>⏸ Hold task</h3><button class="x" data-close>×</button></div>
    <div class="modal-b"><div class="v20-note"><b>${esc(t.taskName)}</b> sẽ <b>tạm ngưng</b> – không chạy, không tính thời gian, không hiện trong Report ca.</div>
      ${deps.length ? `<p style="margin:0 0 6px"><b>${deps.length} task</b> đang chờ task này. Chọn lại để chúng chạy tiếp:</p>
        ${deps.map(d => `<div class="v20-dep"><span>#${d.order} ${esc(d.taskName)} <small class="muted">· ${esc(d.process)}</small></span><select data-v20d="${esc(d.id)}">${opts(preds.length ? '__pred' : '')}</select></div>`).join('')}`
        : '<p class="muted">Không có task nào đang chờ task này.</p>'}
    </div>
    <div class="modal-f"><button class="btn" data-close>Hủy</button><button class="btn primary" id="v20Hold" style="background:#ff9f0a">⏸ Hold task</button></div>`, 'sm');
  m.querySelector('#v20Hold').onclick = () => {
    const choice = {}; m.querySelectorAll('[data-v20d]').forEach(s => choice[s.dataset.v20d] = s.value);
    Store.commit('Hold task: ' + t.taskName, pl => {
      const a = pl.tasks.find(x => x.id === id); if (!a) return false;
      a.hold = true; a.holdDur = a.durationHours; a.holdDeps = (a.dependencyIds || []).slice(); a.holdMode = a.executionMode;
      a.durationHours = 0;
      Object.entries(choice).forEach(([did, v]) => {
        const d = pl.tasks.find(x => x.id === did); if (!d) return;
        let nd = (d.dependencyIds || []).filter(x => x !== id);
        if (v === '__pred') nd = [...new Set([...nd, ...a.holdDeps])]; else if (v) nd = [...new Set([...nd, v])];
        d.dependencyIds = nd; d.executionMode = nd.length ? 'after_dependency' : 'parallel';
      });
    });
    closeModal(); Drawer.close(); toast('Đã hold task – các task sau đã được nối lại.', 'ok');
  };
}
function unholdTask(id) {
  if (needLogin()) return;
  Store.commit('Bỏ hold task', pl => {
    const a = pl.tasks.find(x => x.id === id); if (!a) return false;
    a.hold = false; a.durationHours = a.holdDur || a.durationHours || 1; a.dependencyIds = a.holdDeps || a.dependencyIds; a.executionMode = a.holdMode || a.executionMode;
    delete a.holdDur; delete a.holdDeps; delete a.holdMode;
  });
  toast('Task đã chạy lại. Kiểm tra lại thứ tự các task phía sau nếu cần.', 'ok');
  setTimeout(() => Drawer.open(id), 80);
}
function drawerButtons(t) {
  const d = document.getElementById('drawer'); if (!d || !t || !t.id || App.drawerIsNew || d.querySelector('.v20-acts')) return;
  const host = d.querySelector('.v13-hero') || d.querySelector('.drawer-b'); if (!host) return;
  const box = document.createElement('div'); box.className = 'v20-acts';
  box.innerHTML = t.hold ? `<button type="button" class="unhold" data-v20a="unhold">▶ Bỏ hold – chạy lại</button>`
    : `<button type="button" data-v20a="split">✂ Tách task</button><button type="button" class="hold" data-v20a="hold">⏸ Hold task</button>`;
  host.appendChild(box);
  box.onclick = e => { const b = e.target.closest('[data-v20a]'); if (!b) return; const k = b.dataset.v20a;
    if (k === 'split') splitTask(t.id); if (k === 'hold') holdTask(t.id); if (k === 'unhold') unholdTask(t.id); };
}

/* ======================= 6. NORMAL RUN ======================= */
function normalRun() {
  if (needLogin()) return;
  const p = plan(), res = sched(p), P = U.parseLocalISO(p.start);
  const first = new Map();
  p.tasks.filter(t => !t.normalRun && !t.hold).forEach(t => { const r = res.R.get(t.id); if (!r) return; const f = first.get(t.process); if (f == null || r.start < f) first.set(t.process, r.start); });
  const plans = [...first].filter(([, s]) => s - P >= MS_H);
  if (!plans.length) { toast('Mọi process đều bắt đầu ngay khi Shutdown – không cần Normal run.', 'ok'); return; }
  let made = 0;
  Store.commit('Tạo Normal run', pl => {
    pl.tasks = pl.tasks.filter(t => !t.normalRun);
    const tmp = { tasks: pl.tasks };
    plans.forEach(([proc, end]) => {
      const br = (pl.tasks.find(t => t.process === proc) || {}).branch || 'Chung';
      let s = P;
      while (s < end - 15 * MS_MIN) {
        const d = new Date(s), h = d.getHours(), nb = [6, 14, 22, 30].find(x => x > h) ?? 30;
        const cut = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 0, 0).getTime() + nb * MS_H;
        const e = Math.min(end, cut);
        const t = normalizeTask({ id: nextTaskId(tmp), order: 0, branch: br, process: proc, taskName: `Normal run – ${proc}`,
          durationHours: (e - s) / MS_H, standardHours: (e - s) / MS_H, quantity: 1, peopleRequired: 1, assignee: '', owner: '',
          executionMode: 'parallel', lagHours: 0, notes: 'Process vẫn chạy bình thường trước khi tới giờ shutdown', method: '', progress: 0 });
        t.normalRun = true; t.constraintType = 'SNET'; t.constraintOffsetHours = (s - P) / MS_H; t.evidence = [{ id: 'done', label: 'Ảnh / xác nhận chạy bình thường', min: 1 }];
        tmp.tasks.push(t); made++; s = e;
      }
    });
    pl.tasks.sort((a, b) => (a.normalRun ? -1 : 0) - (b.normalRun ? -1 : 0) || a.order - b.order).forEach((t, i) => t.order = i + 1);
  });
  let assigned = 0;
  if (typeof LDC !== 'undefined' && LDC.data) {
    try {
      const pl = plan(), dk = LDC.dayKey(U.parseLocalISO(pl.start)); LDC.planDay = dk; if (LDC.autoPick) LDC.autoPick(dk);
      const sug = LDC.suggest(pl, { overwrite: false, allowHC: false, anyTeam: false }).filter(x => x.t.normalRun && !x.keep && x.names.length);
      if (sug.length) Store.commit('Gán người Normal run theo LDC', q => sug.forEach(x => { const t = q.tasks.find(k => k.id === x.t.id); if (t) { t.assignee = x.names.join(' + '); assigned++; } }));
    } catch (e) { console.warn('[v20] LDC', e); }
  }
  toast(`Đã tạo ${made} đoạn Normal run theo ca${assigned ? ` · gán người ${assigned} đoạn theo LDC` : (typeof LDC !== 'undefined' && LDC.data ? '' : ' · upload LDC để tự gán người')}.`, 'ok');
}
function addNRButton() {
  const sp = document.querySelector('.topbar .spacer'); if (!sp || document.getElementById('v20NR')) return;
  const b = document.createElement('button'); b.id = 'v20NR'; b.className = 'tb-btn'; b.textContent = '▶ Normal run'; b.title = 'Tạo đoạn chạy bình thường cho process chưa tới giờ shutdown';
  b.onclick = normalRun; sp.parentNode.insertBefore(b, sp);
}

/* ======================= 7. REPORT CA: GIỜ KẾ HOẠCH / THỰC TẾ ======================= */
function timeBox() {
  const OP = window.OperatorView, s = OP && OP.sheet; if (!s || !document.body.contains(s.m)) return;
  const b = s.m.querySelector('#opSheetB'); if (!b || b.querySelector('.v20-time')) return;
  const p = Store.state.plans.find(x => x.id === s.planId), t = p && p.tasks.find(x => x.id === s.taskId); if (!t) return;
  const r = Scheduler.schedule(p).R.get(t.id); if (!r) return;
  const as = t.actualStart || '', ae = t.actualEnd || '';
  const box = document.createElement('div'); box.className = 'v20-time';
  const diffTxt = () => {
    if (!as && !ae) return '';
    const st = as ? U.parseLocalISO(as) : r.start, en = ae ? U.parseLocalISO(ae) : null;
    const ds = Math.round((st - (t.planStart || r.start)) / MS_MIN);
    const late = en && en > (t.planEnd || r.end);
    return `<div class="diff ${late || ds > 0 ? 'late' : 'ok'}">${ds ? (ds > 0 ? `⏱ Bắt đầu trễ ${U.fmtDur(ds / 60)}` : `⏩ Bắt đầu sớm ${U.fmtDur(-ds / 60)}`) : '✓ Bắt đầu đúng giờ'}${en ? ` · kết thúc ${U.fmtDM(en)}${late ? ' (trễ kế hoạch)' : ''}` : ''}</div>`;
  };
  const ps = t.planStart || r.start, pe = t.planEnd || r.end;
  box.innerHTML = `<div class="plan"><small>🕒 Giờ kế hoạch</small><b>${U.fmtHM(ps)} – ${U.fmtHM(pe)}</b><em>${U.fmtDM(ps).slice(0, 5)} · ${U.fmtDur(t.durationHours)}</em></div>
    <div class="act"><label>Bắt đầu thực tế<input type="datetime-local" id="v20As" value="${esc(as)}"></label>
      <label>Kết thúc thực tế<input type="datetime-local" id="v20Ae" value="${esc(ae)}"></label>
      <button type="button" id="v20Save">Lưu giờ thực tế</button></div>${diffTxt()}`;
  const head = b.querySelector('.rp-shead'); head ? head.after(box) : b.prepend(box);
  box.querySelector('#v20Save').onclick = () => {
    const sa = box.querySelector('#v20As').value, ea = box.querySelector('#v20Ae').value;
    if (!sa) { toast('Nhập giờ bắt đầu thực tế.', 'warn'); return; }
    const st = U.parseLocalISO(sa), en = ea ? U.parseLocalISO(ea) : null;
    if (en && en <= st) { toast('Giờ kết thúc phải sau giờ bắt đầu.', 'warn'); return; }
    Store.commit('Giờ thực tế: ' + t.taskName, pl => {
      const q = (pl.tasks ? pl : Store.state.plans.find(x => x.id === s.planId));
      const a = (q.tasks || Store.state.plans.find(x => x.id === s.planId).tasks).find(x => x.id === t.id); if (!a) return false;
      const P = U.parseLocalISO((Store.state.plans.find(x => x.id === s.planId) || q).start);
      if (!a.planStart) { a.planStart = r.start; a.planEnd = r.end; a.planDur = a.durationHours; }
      a.actualStart = sa; a.actualEnd = ea || '';
      if (a.executionMode === 'fixed') a.constraintOffsetHours = (st - P) / MS_H;
      else { a.constraintType = 'SNET'; a.constraintOffsetHours = (st - P) / MS_H; }
      if (en) { a.durationHours = (en - st) / MS_H; a.standardHours = a.durationHours; }
    });
    const nr = Scheduler.schedule(Store.state.plans.find(x => x.id === s.planId)).R.get(t.id);
    toast(nr && Math.abs(nr.start - st) > MS_MIN ? `Đã lưu – task trước chưa xong nên chỉ bắt đầu được lúc ${U.fmtDM(nr.start)}.` : 'Đã lưu giờ thực tế – Planner đã dời theo.', 'ok');
    box.remove(); timeBox();
  };
}

/* ======================= Ẩn task HOLD khỏi Report ca ======================= */
function hideHoldInReport() {
  const OP = window.OperatorView; if (!OP || !document.body.classList.contains('op-mode')) return;
  const p = Store.state.plans.find(x => x.id === OP.planId); if (!p) return;
  document.querySelectorAll('#opView .rp-card').forEach(c => { const t = p.tasks.find(x => x.id === c.dataset.opTask); if (t && t.hold) c.style.display = 'none'; });
}

function boot() {
  try {
    patchGantt(); addFab(); addNRButton();
    const _dr = Drawer.render;
    Drawer.render = function (t) { const o = _dr.apply(this, arguments); try { drawerButtons(t); } catch (e) { console.warn('[v20]', e); } return o; };
    if (window.WorkRequest) { const _w = WorkRequest.render; WorkRequest.render = function (...a) { const o = _w.apply(this, a); try { ldcLink(); } catch (e) { } return o; }; }
    const wv = document.getElementById('wrView'); if (wv) new MutationObserver(() => ldcLink()).observe(wv, { childList: true, subtree: true });
    const OP = window.OperatorView;
    if (OP) {
      const _ot = OP.openTask;
      OP.openTask = function (...a) { const o = _ot.apply(this, a); const b = OP.sheet && OP.sheet.m.querySelector('#opSheetB');
        if (b) new MutationObserver(() => { if (!b.querySelector('.v20-time')) timeBox(); }).observe(b, { childList: true }); timeBox(); return o; };
      const _r = OP.render; OP.render = function (...a) { const o = _r.apply(this, a); hideHoldInReport(); return o; };
    }
    if (App.res) App.render();
    console.log('[v20] đã nạp – tên task bên phải, + task, tách, hold, normal run, giờ thực tế');
  } catch (e) { console.error('[v20] lỗi:', e); }
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => setTimeout(boot, 1300)); else setTimeout(boot, 1300);
})();
</script>
